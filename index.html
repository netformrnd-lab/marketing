                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)' }}>
                  {monthDates.map(({ date, isCurrentMonth, day }, idx) => {
                    const isToday = date === today, dt = tasksByDate[date] || [], dow = idx % 7;
                    return (
                      <div key={date} style={{ minHeight: 140, padding: 8, borderRight: dow < 6 ? '1px solid #F2F3F5' : 'none', borderBottom: idx < 35 ? '1px solid #F2F3F5' : 'none', background: isToday ? '#EBF4FF' : 'white', opacity: isCurrentMonth ? 1 : 0.4, display: 'flex', flexDirection: 'column' }}>
                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8, flexShrink: 0 }}>
                          <span style={{ width: 28, height: 28, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, fontWeight: isToday ? 700 : 500, color: isToday ? 'white' : dow >= 5 ? '#F04452' : '#191F28', background: isToday ? '#3182F6' : 'transparent' }}>{day}</span>
                          {dt.length > 0 && <span style={{ fontSize: 11, color: '#8B95A1' }}>{dt.length}건</span>}
                        </div>
                        {/* 스크롤 가능한 업무 리스트 */}
                        <div style={{ flex: 1, overflow: 'auto', display: 'flex', flexDirection: 'column', gap: 4 }}>
                          {dt.map(t => { 
                            const project = projects.find(p => p.id === t.projectId);
                            const proj = project ? BRANDS.find(b => b.id === project.brandId) : BRANDS.find(p => p.id === t.projectId);
                            const member = TEAM_MEMBERS.find(m => m.id === t.memberId);
                            return (
                              <div key={t.id} onClick={() => setSelectedTask(t)} style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '4px 8px', borderRadius: 6, background: proj ? `${proj.color}15` : '#F7F8FA', borderLeft: `3px solid ${proj ? proj.color : '#8B95A1'}`, cursor: 'pointer', flexShrink: 0 }}>
                                <span style={{ fontSize: 11, fontWeight: 500, color: t.completed ? '#8B95A1' : '#191F28', textDecoration: t.completed ? 'line-through' : 'none', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', flex: 1 }}>{t.title}</span>
                                {member && <div style={{ width: 18, height: 18, borderRadius: '50%', background: member.color, color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 8, fontWeight: 700, flexShrink: 0 }}>{member.initial}</div>}
                              </div>
                            ); 
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* 업무 상세 모달 - 메모 포함 */}
          {selectedTask && (
            <div onClick={() => setSelectedTask(null)} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.4)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000 }}>
              <div onClick={(e) => e.stopPropagation()} style={{ background: 'white', borderRadius: 20, padding: 24, width: '100%', maxWidth: 420, maxHeight: '80vh', overflow: 'auto' }}>
                {(() => { 
                  const project = projects.find(p => p.id === selectedTask.projectId);
                  const proj = project ? BRANDS.find(b => b.id === project.brandId) : BRANDS.find(x => x.id === selectedTask.projectId);
                  return <>
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 20 }}>
                      <h2 style={{ fontSize: 18, fontWeight: 700, color: '#191F28' }}>📝 업무 상세</h2>
                      <button onClick={() => setSelectedTask(null)} style={{ width: 32, height: 32, borderRadius: 8, border: 'none', background: '#F7F8FA', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}><Icon name="x" size={18} color="#8B95A1" /></button>
                    </div>
                    
                    <div style={{ background: '#F7F8FA', borderRadius: 12, padding: 16, marginBottom: 16 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}>
                        {proj ? <span style={{ padding: '4px 10px', borderRadius: 6, background: `${proj.color}15`, color: proj.color, fontSize: 12, fontWeight: 600 }}>{proj.name}</span> : <span style={{ padding: '4px 10px', borderRadius: 6, background: '#8B95A115', color: '#8B95A1', fontSize: 12, fontWeight: 600 }}>기타 업무</span>}
                        {selectedTask.bookmark && <Icon name="bookmarkFill" size={16} color="#F59E0B" />}
                      </div>
                      <h3 style={{ fontSize: 18, fontWeight: 700, color: '#191F28', marginBottom: 8, textDecoration: selectedTask.completed ? 'line-through' : 'none' }}>{selectedTask.title}</h3>
                      <p style={{ fontSize: 14, color: '#6B7684' }}>📅 {formatShortDate(selectedTask.date)}</p>
                    </div>
                    
                    {/* 메모 영역 */}
                    {selectedTask.note && (
                      <div style={{ background: '#FFFBEB', borderRadius: 12, padding: 16, marginBottom: 16, border: '1px solid #FEF3C7' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 8 }}>
                          <Icon name="fileText" size={16} color="#F59E0B" />
                          <span style={{ fontSize: 13, fontWeight: 600, color: '#92400E' }}>메모</span>
                        </div>
                        <p style={{ fontSize: 14, color: '#191F28', lineHeight: 1.6, whiteSpace: 'pre-wrap' }}>{selectedTask.note}</p>
                      </div>
                    )}
                    
                    {/* 첨부파일 영역 */}
                    {selectedTask.attachments && selectedTask.attachments.length > 0 && (
                      <div style={{ background: '#F0F7FF', borderRadius: 12, padding: 16, marginBottom: 16, border: '1px solid #DBEAFE' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 12 }}>
                          <Icon name="paperclip" size={16} color="#3182F6" />
                          <span style={{ fontSize: 13, fontWeight: 600, color: '#1E40AF' }}>첨부파일 ({selectedTask.attachments.length})</span>
                        </div>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                          {selectedTask.attachments.map(file => (
                            <div key={file.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', borderRadius: 8, background: 'white', border: '1px solid #E5E8EB' }}>
                              <Icon name="fileText" size={18} color="#3182F6" />
                              <span style={{ flex: 1, fontSize: 13, color: '#191F28', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{file.name}</span>
                              <span style={{ fontSize: 11, color: '#8B95A1' }}>{(file.size / 1024).toFixed(1)}KB</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                    
                    {/* 버튼 영역 */}
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                      <button onClick={() => toggleTaskComplete(selectedTask.id)} style={{ width: '100%', padding: 14, borderRadius: 12, border: 'none', background: selectedTask.completed ? '#F7F8FA' : '#3182F6', color: selectedTask.completed ? '#6B7684' : 'white', fontSize: 15, fontWeight: 600, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, cursor: 'pointer' }}>
                        <Icon name="check" size={18} color={selectedTask.completed ? '#6B7684' : 'white'} /> {selectedTask.completed ? '완료 취소' : '완료 처리'}
                      </button>
                      
                      <div style={{ display: 'flex', gap: 8 }}>
                        <button onClick={() => { setEditingTask(selectedTask); setShowEditModal(true); setSelectedTask(null); }} style={{ flex: 1, padding: 14, borderRadius: 12, border: '1px solid #E5E8EB', background: 'white', color: '#191F28', fontSize: 15, fontWeight: 600, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, cursor: 'pointer' }}>
                          <Icon name="edit" size={18} color="#6B7684" /> 수정
                        </button>
                        <button onClick={() => requestDeleteTask(selectedTask)} style={{ flex: 1, padding: 14, borderRadius: 12, border: 'none', background: '#FEE4E2', color: '#F04452', fontSize: 15, fontWeight: 600, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, cursor: 'pointer' }}>
                          <Icon name="trash" size={18} color="#F04452" /> 삭제
                        </button>
                      </div>
                    </div>
                  </>;
                })()}
              </div>
            </div>
          )}
          
          {/* 업무 수정 모달 */}
          {showEditModal && (
            <TaskModal 
              task={editingTask} 
              date={editingTask?.date || today} 
              onSave={(task) => { updateTask(task); setShowEditModal(false); setEditingTask(null); }} 
              onClose={() => { setShowEditModal(false); setEditingTask(null); }} 
            />
          )}
          
          {/* 삭제 확인 모달 */}
          {confirmDelete && (
            <ConfirmModal
              title="업무 삭제"
              message={`"${confirmDelete.title}"을(를) 삭제하시겠습니까?`}
              onConfirm={handleConfirmDelete}
              onCancel={() => setConfirmDelete(null)}
            />
          )}
        </div>
      );
    }

    // ============ 휴지통 탭 ============
    function TrashTab({ tasks, setTasks, projects, setProjects, fixedTasks, setFixedTasks, currentUser }) {
      const [confirmAction, setConfirmAction] = useState(null); // { type: 'restore' | 'delete' | 'empty', item?, itemType? }
      
      // ESC 키로 모달 닫기
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape' && confirmAction) {
            setConfirmAction(null);
          }
        };
        document.addEventListener('keydown', handleKeyDown);
        return () => document.removeEventListener('keydown', handleKeyDown);
      }, [confirmAction]);
      
      // 삭제된 항목들
      const trashedTasks = tasks.filter(t => t.deletedAt && !t.parentTaskId);
      const trashedProjects = projects.filter(p => p.deletedAt);
      const trashedFixedTasks = fixedTasks.filter(t => t.deletedAt);
      
      // 남은 일수 계산
      const getDaysLeft = (deletedAt) => {
        const days = Math.ceil((deletedAt + 7 * 24 * 60 * 60 * 1000 - Date.now()) / (24 * 60 * 60 * 1000));
        return Math.max(0, days);
      };
      
      // 복원
      const restoreTask = (id) => {
        setTasks(prev => prev.map(t => 
          (t.id === id || t.parentTaskId === id) ? { ...t, deletedAt: undefined } : t
        ));
      };
      
      const restoreProject = (id) => {
        setProjects(prev => prev.map(p => p.id === id ? { ...p, deletedAt: undefined } : p));
        setTasks(prev => prev.map(t => t.projectId === id ? { ...t, deletedAt: undefined } : t));
      };
      
      const restoreFixedTask = (id) => {
        setFixedTasks(prev => prev.map(t => t.id === id ? { ...t, deletedAt: undefined } : t));
      };
      
      // 영구 삭제
      const permanentDeleteTask = (id) => {
        setTasks(prev => prev.filter(t => t.id !== id && t.parentTaskId !== id));
      };
      
      const permanentDeleteProject = (id) => {
        setProjects(prev => prev.filter(p => p.id !== id));
        setTasks(prev => prev.filter(t => t.projectId !== id));
      };
      
      const permanentDeleteFixedTask = (id) => {
        setFixedTasks(prev => prev.filter(t => t.id !== id));
      };
      
      // 휴지통 비우기
      const emptyTrash = () => {
        setTasks(prev => prev.filter(t => !t.deletedAt));
        setProjects(prev => prev.filter(p => !p.deletedAt));
        setFixedTasks(prev => prev.filter(t => !t.deletedAt));
      };
      
      // 확인 처리
      const handleConfirm = () => {
        if (!confirmAction) return;
        
        if (confirmAction.type === 'restore') {
          if (confirmAction.itemType === 'task') restoreTask(confirmAction.item.id);
          else if (confirmAction.itemType === 'project') restoreProject(confirmAction.item.id);
          else if (confirmAction.itemType === 'fixedTask') restoreFixedTask(confirmAction.item.id);
        } else if (confirmAction.type === 'delete') {
          if (confirmAction.itemType === 'task') permanentDeleteTask(confirmAction.item.id);
          else if (confirmAction.itemType === 'project') permanentDeleteProject(confirmAction.item.id);
          else if (confirmAction.itemType === 'fixedTask') permanentDeleteFixedTask(confirmAction.item.id);
        } else if (confirmAction.type === 'empty') {
          emptyTrash();
        }
        
        setConfirmAction(null);
      };
      
      const totalCount = trashedTasks.length + trashedProjects.length + trashedFixedTasks.length;
      
      return (
        <div style={{ minHeight: '100vh', background: '#F7F8FA' }}>
          <header style={{ background: 'white', borderBottom: '1px solid #E5E8EB', padding: '20px 32px' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <h1 style={{ fontSize: 24, fontWeight: 700, color: '#191F28' }}>🗑️ 휴지통</h1>
                <span style={{ fontSize: 14, color: '#6B7684', background: '#F7F8FA', padding: '4px 12px', borderRadius: 20 }}>
                  {totalCount}개 항목
                </span>
              </div>
              {totalCount > 0 && (
                <button 
                  onClick={() => setConfirmAction({ type: 'empty' })}
                  style={{ 
                    display: 'flex', alignItems: 'center', gap: 6,
                    padding: '10px 16px', borderRadius: 10,
                    border: 'none', background: '#F04452', color: 'white',
                    fontSize: 14, fontWeight: 600, cursor: 'pointer'
                  }}
                >
                  <Icon name="trash" size={16} color="white" /> 휴지통 비우기
                </button>
              )}
            </div>
            <p style={{ fontSize: 13, color: '#8B95A1', marginTop: 8 }}>
              삭제된 항목은 7일 후 자동으로 영구 삭제됩니다
            </p>
          </header>
          
          <div style={{ padding: 24, maxWidth: 900, margin: '0 auto' }}>
            {totalCount === 0 ? (
              <div style={{ textAlign: 'center', padding: '80px 20px' }}>
                <div style={{ fontSize: 64, marginBottom: 16 }}>🗑️</div>
                <h3 style={{ fontSize: 18, fontWeight: 600, color: '#191F28', marginBottom: 8 }}>휴지통이 비어있습니다</h3>
                <p style={{ fontSize: 14, color: '#8B95A1' }}>삭제된 항목이 없습니다</p>
              </div>
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                {/* 프로젝트 */}
                {trashedProjects.length > 0 && (
                  <div>
                    <h3 style={{ fontSize: 14, fontWeight: 600, color: '#6B7684', marginBottom: 12, display: 'flex', alignItems: 'center', gap: 8 }}>
                      <Icon name="folder" size={16} color="#6B7684" /> 프로젝트 ({trashedProjects.length})
                    </h3>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                      {trashedProjects.map(project => {
                        const brand = BRANDS.find(b => b.id === project.brandId);
                        const daysLeft = getDaysLeft(project.deletedAt);
                        return (
                          <div key={project.id} style={{ 
                            display: 'flex', alignItems: 'center', gap: 12,
                            padding: 16, background: 'white', borderRadius: 12,
                            border: '1px solid #E5E8EB'
                          }}>
                            <div style={{ width: 4, height: 40, borderRadius: 2, background: brand?.color || '#8B95A1' }} />
                            <div style={{ flex: 1 }}>
                              <p style={{ fontSize: 15, fontWeight: 600, color: '#191F28' }}>{project.title}</p>
                              <p style={{ fontSize: 12, color: '#8B95A1', marginTop: 2 }}>{brand?.name || '브랜드 없음'}</p>
                            </div>
                            <span style={{ 
                              fontSize: 12, color: daysLeft <= 1 ? '#F04452' : '#8B95A1',
                              background: daysLeft <= 1 ? '#FEE4E2' : '#F7F8FA',
                              padding: '4px 10px', borderRadius: 6
                            }}>
                              {daysLeft}일 후 삭제
                            </span>
                            <button 
                              onClick={() => setConfirmAction({ type: 'restore', item: project, itemType: 'project' })}
                              style={{ padding: '8px 14px', borderRadius: 8, border: '1px solid #00C471', background: '#F0FDF4', color: '#00C471', fontSize: 13, fontWeight: 600, cursor: 'pointer' }}
                            >
                              복원
                            </button>
                            <button 
                              onClick={() => setConfirmAction({ type: 'delete', item: project, itemType: 'project' })}
                              style={{ padding: '8px 14px', borderRadius: 8, border: 'none', background: '#FEE4E2', color: '#F04452', fontSize: 13, fontWeight: 600, cursor: 'pointer' }}
                            >
                              영구삭제
                            </button>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
                
                {/* 업무 */}
                {trashedTasks.length > 0 && (
                  <div>
                    <h3 style={{ fontSize: 14, fontWeight: 600, color: '#6B7684', marginBottom: 12, display: 'flex', alignItems: 'center', gap: 8 }}>
                      <Icon name="clipboard" size={16} color="#6B7684" /> 업무 ({trashedTasks.length})
                    </h3>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                      {trashedTasks.map(task => {
                        const project = projects.find(p => p.id === task.projectId);
                        const brand = project ? BRANDS.find(b => b.id === project.brandId) : null;
                        const daysLeft = getDaysLeft(task.deletedAt);
                        const subtaskCount = tasks.filter(t => t.parentTaskId === task.id).length;
                        return (
                          <div key={task.id} style={{ 
                            display: 'flex', alignItems: 'center', gap: 12,
                            padding: 16, background: 'white', borderRadius: 12,
                            border: '1px solid #E5E8EB'
                          }}>
                            <div style={{ flex: 1 }}>
                              <p style={{ fontSize: 15, fontWeight: 500, color: '#191F28' }}>{task.title}</p>
                              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 4 }}>
                                {brand && <span style={{ fontSize: 11, color: brand.color, background: `${brand.color}15`, padding: '2px 8px', borderRadius: 4 }}>{brand.name}</span>}
                                <span style={{ fontSize: 12, color: '#8B95A1' }}>{task.date}</span>
                                {subtaskCount > 0 && <span style={{ fontSize: 11, color: '#6B7684' }}>+{subtaskCount}개 서브태스크</span>}
                              </div>
                            </div>
                            <span style={{ 
                              fontSize: 12, color: daysLeft <= 1 ? '#F04452' : '#8B95A1',
                              background: daysLeft <= 1 ? '#FEE4E2' : '#F7F8FA',
                              padding: '4px 10px', borderRadius: 6
                            }}>
                              {daysLeft}일 후 삭제
                            </span>
                            <button 
                              onClick={() => setConfirmAction({ type: 'restore', item: task, itemType: 'task' })}
                              style={{ padding: '8px 14px', borderRadius: 8, border: '1px solid #00C471', background: '#F0FDF4', color: '#00C471', fontSize: 13, fontWeight: 600, cursor: 'pointer' }}
                            >
                              복원
                            </button>
                            <button 
                              onClick={() => setConfirmAction({ type: 'delete', item: task, itemType: 'task' })}
                              style={{ padding: '8px 14px', borderRadius: 8, border: 'none', background: '#FEE4E2', color: '#F04452', fontSize: 13, fontWeight: 600, cursor: 'pointer' }}
                            >
                              영구삭제
                            </button>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
                
                {/* 루틴 업무 */}
                {trashedFixedTasks.length > 0 && (
                  <div>
                    <h3 style={{ fontSize: 14, fontWeight: 600, color: '#6B7684', marginBottom: 12, display: 'flex', alignItems: 'center', gap: 8 }}>
                      <Icon name="clock" size={16} color="#6B7684" /> 루틴 업무 ({trashedFixedTasks.length})
                    </h3>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                      {trashedFixedTasks.map(task => {
                        const daysLeft = getDaysLeft(task.deletedAt);
                        const typeLabel = { daily: '일일', weekly: '주간', monthly: '월간' }[task.routineType] || '';
                        const typeColor = { daily: '#F59E0B', weekly: '#3B82F6', monthly: '#9333EA' }[task.routineType] || '#8B95A1';
                        return (
                          <div key={task.id} style={{ 
                            display: 'flex', alignItems: 'center', gap: 12,
                            padding: 16, background: 'white', borderRadius: 12,
                            border: '1px solid #E5E8EB'
                          }}>
                            <div style={{ flex: 1 }}>
                              <p style={{ fontSize: 15, fontWeight: 500, color: '#191F28' }}>{task.title}</p>
                              <span style={{ fontSize: 11, color: typeColor, background: `${typeColor}15`, padding: '2px 8px', borderRadius: 4, marginTop: 4, display: 'inline-block' }}>{typeLabel} 루틴</span>
                            </div>
                            <span style={{ 
                              fontSize: 12, color: daysLeft <= 1 ? '#F04452' : '#8B95A1',
                              background: daysLeft <= 1 ? '#FEE4E2' : '#F7F8FA',
                              padding: '4px 10px', borderRadius: 6
                            }}>
                              {daysLeft}일 후 삭제
                            </span>
                            <button 
                              onClick={() => setConfirmAction({ type: 'restore', item: task, itemType: 'fixedTask' })}
                              style={{ padding: '8px 14px', borderRadius: 8, border: '1px solid #00C471', background: '#F0FDF4', color: '#00C471', fontSize: 13, fontWeight: 600, cursor: 'pointer' }}
                            >
                              복원
                            </button>
                            <button 
                              onClick={() => setConfirmAction({ type: 'delete', item: task, itemType: 'fixedTask' })}
                              style={{ padding: '8px 14px', borderRadius: 8, border: 'none', background: '#FEE4E2', color: '#F04452', fontSize: 13, fontWeight: 600, cursor: 'pointer' }}
                            >
                              영구삭제
                            </button>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
          
          {/* 확인 모달 */}
          {confirmAction && (
            <div onClick={() => setConfirmAction(null)} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1200 }}>
              <div onClick={(e) => e.stopPropagation()} style={{ background: 'white', borderRadius: 20, padding: 28, width: '100%', maxWidth: 400 }}>
                <div style={{ textAlign: 'center', marginBottom: 24 }}>
                  <div style={{ 
                    width: 56, height: 56, borderRadius: '50%', 
                    background: confirmAction.type === 'restore' ? '#F0FDF4' : '#FEE4E2', 
                    display: 'flex', alignItems: 'center', justifyContent: 'center', 
                    margin: '0 auto 16px' 
                  }}>
                    <Icon 
                      name={confirmAction.type === 'restore' ? 'refresh' : 'trash'} 
                      size={28} 
                      color={confirmAction.type === 'restore' ? '#00C471' : '#F04452'} 
                    />
                  </div>
                  <h3 style={{ fontSize: 18, fontWeight: 700, color: '#191F28', marginBottom: 8 }}>
                    {confirmAction.type === 'restore' ? '항목 복원' : 
                     confirmAction.type === 'empty' ? '휴지통 비우기' : '영구 삭제'}
                  </h3>
                  <p style={{ fontSize: 14, color: '#6B7684', lineHeight: 1.5 }}>
                    {confirmAction.type === 'restore' 
                      ? `"${confirmAction.item?.title}"을(를) 복원하시겠습니까?`
                      : confirmAction.type === 'empty'
                        ? '휴지통의 모든 항목이 영구 삭제됩니다. 이 작업은 되돌릴 수 없습니다.'
                        : `"${confirmAction.item?.title}"을(를) 영구 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.`
                    }
                  </p>
                </div>
                <div style={{ display: 'flex', gap: 12 }}>
                  <button onClick={() => setConfirmAction(null)} style={{ flex: 1, padding: 14, borderRadius: 12, border: '1px solid #E5E8EB', background: 'white', fontSize: 15, fontWeight: 600, color: '#6B7684', cursor: 'pointer' }}>
                    취소
                  </button>
                  <button 
                    onClick={handleConfirm} 
                    style={{ 
                      flex: 1, padding: 14, borderRadius: 12, border: 'none', 
                      background: confirmAction.type === 'restore' ? '#00C471' : '#F04452', 
                      fontSize: 15, fontWeight: 600, color: 'white', cursor: 'pointer' 
                    }}
                  >
                    {confirmAction.type === 'restore' ? '복원' : confirmAction.type === 'empty' ? '비우기' : '삭제'}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ============ 그로스보드 탭 ============
    function GrowthBoardTab({ tasks, projects, currentUser }) {
      // 주차 계산 헬퍼
      const getWeekNumber = (date) => {
        const d = new Date(date);
        const firstDay = new Date(d.getFullYear(), 0, 1);
        const pastDays = (d - firstDay) / 86400000;
        return Math.ceil((pastDays + firstDay.getDay() + 1) / 7);
      };
      
      const getWeekRange = (year, week) => {
        const firstDay = new Date(year, 0, 1);
        const days = (week - 1) * 7;
        const startDate = new Date(firstDay.setDate(firstDay.getDate() + days - firstDay.getDay() + 1));
        const endDate = new Date(startDate);
        endDate.setDate(startDate.getDate() + 6);
        return { start: formatDate(startDate), end: formatDate(endDate) };
      };
      
      const currentYear = new Date().getFullYear();
      const currentWeek = getWeekNumber(new Date());
      
      // 상태
      const [selectedYear, setSelectedYear] = useState(currentYear);
      const [selectedWeek, setSelectedWeek] = useState(currentWeek);
      const [selectedBrand, setSelectedBrand] = useState(1);
      const [nodes, setNodes] = useState([]);
      const [connections, setConnections] = useState([]);
      const [selectedNode, setSelectedNode] = useState(null);
      const [showAddBranch, setShowAddBranch] = useState(false);
      const [newBranchName, setNewBranchName] = useState('');
      const [editingNode, setEditingNode] = useState(null);
      const [boards, setBoards] = useState({});
      
      // 줌 & 패닝 상태 (transform 기반 무한 캔버스)
      const [zoom, setZoom] = useState(1);
      const [offset, setOffset] = useState({ x: 100, y: 50 }); // 초기 위치
      const [isPanning, setIsPanning] = useState(false);
      const [spacePressed, setSpacePressed] = useState(false);
      const panStart = React.useRef({ x: 0, y: 0, offsetX: 0, offsetY: 0 });
      const canvasRef = React.useRef(null);
      
      // 스페이스바 & ESC 전역 이벤트 리스너
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
            e.preventDefault();
            setSpacePressed(true);
          }
          if (e.key === 'Escape') {
            if (showAddBranch) setShowAddBranch(false);
            else if (editingNode) setEditingNode(null);
            else if (selectedNode) setSelectedNode(null);
          }
        };
        const handleKeyUp = (e) => {
          if (e.code === 'Space') {
            e.preventDefault();
            setSpacePressed(false);
            setIsPanning(false);
          }
        };
        
        document.addEventListener('keydown', handleKeyDown);
        document.addEventListener('keyup', handleKeyUp);
        
        return () => {
          document.removeEventListener('keydown', handleKeyDown);
          document.removeEventListener('keyup', handleKeyUp);
        };
      }, [showAddBranch, editingNode, selectedNode]);
      
      // 현재 보드 키 (브랜드 통합)
      const boardKey = `${currentUser.id}-${selectedYear}-W${selectedWeek}`;
      
      // Firebase에서 보드 데이터 로드
      useEffect(() => {
        const loadBoard = async () => {
          const data = await FirebaseService.getDoc('growthboards', boardKey);
          if (data) {
            let loadedNodes = data.nodes || [];
            let loadedConnections = data.connections || [];
            
            // "그 외 업무" 노드가 없으면 추가
            if (!loadedNodes.find(n => n.id === 'other-tasks')) {
              const otherNode = {
                id: 'other-tasks',
                type: 'other',
                text: '그 외 업무',
                x: 200,
                y: 500,
                color: '#8B95A1'
              };
              loadedNodes.push(otherNode);
              loadedConnections.push({
                id: 'conn-other',
                from: 'center',
                to: 'other-tasks'
              });
            }
            
            setNodes(loadedNodes);
            setConnections(loadedConnections);
          } else {
            // 새 보드 초기화 - 중심 노드 + 그 외 업무 노드
            const centerNode = {
              id: 'center',
              type: 'center',
              text: `${selectedYear}년 ${selectedWeek}주차`,
              x: 200,
              y: 300,
              color: '#3182F6'
            };
            const otherNode = {
              id: 'other-tasks',
              type: 'other',
              text: '그 외 업무',
              x: 200,
              y: 500,
              color: '#8B95A1'
            };
            setNodes([centerNode, otherNode]);
            setConnections([{
              id: 'conn-other',
              from: 'center',
              to: 'other-tasks'
            }]);
          }
        };
        loadBoard();
      }, [boardKey, selectedYear, selectedWeek]);
      
      // 보드 저장
      const saveBoard = async (newNodes, newConnections) => {
        await FirebaseService.saveDoc('growthboards', boardKey, {
          nodes: newNodes,
          connections: newConnections,
          updatedAt: new Date().toISOString()
        });
      };
      
      // 내 프로젝트만 필터링 (내가 만든 프로젝트 + 내가 참여한 프로젝트)
      const myProjects = useMemo(() => {
        // 내가 담당자인 업무가 있는 프로젝트 ID
        const myTaskProjectIds = [...new Set(
          tasks.filter(t => t.memberId === currentUser.id).map(t => t.projectId)
        )];
        
        return projects.filter(p => 
          p.creatorId === currentUser.id || myTaskProjectIds.includes(p.id)
        );
      }, [projects, tasks, currentUser.id]);
      
      // 프로젝트별 하위업무
      const getProjectTasks = (projectId) => {
        return tasks.filter(t => t.projectId === projectId);
      };
      
      // 프로젝트의 브랜드 정보 가져오기
      const getProjectBrand = (project) => {
        return BRANDS.find(b => b.id === project.brandId);
      };
      
      // 이미 보드에 추가된 프로젝트 ID
      const addedProjectIds = useMemo(() => {
        return nodes.filter(n => n.projectId).map(n => n.projectId);
      }, [nodes]);
      
      // 수동 동기화 함수 - 프로젝트/업무 변경사항 반영
      const syncWithProjects = () => {
        if (nodes.length === 0) return;
        
        let updatedNodes = [...nodes];
        let updatedConnections = [...connections];
        let hasChanges = false;
        
        // 1. 프로젝트/업무 이름 변경 동기화
        updatedNodes = updatedNodes.map(node => {
          // 프로젝트 노드 동기화
          if (node.projectId) {
            const project = projects.find(p => p.id === node.projectId);
            if (project && node.text !== project.title) {
              hasChanges = true;
              return { ...node, text: project.title };
            }
          }
          // 업무 노드 동기화
          if (node.taskId) {
            const task = tasks.find(t => t.id === node.taskId);
            if (task && node.text !== task.title) {
              hasChanges = true;
              return { ...node, text: task.title };
            }
          }
          return node;
        });
        
        // 2. 새로 추가된 완료 업무 동기화 (내가 담당한 업무만)
        updatedNodes.forEach(node => {
          if (node.projectId && node.type === 'branch') {
            const projectTasks = tasks.filter(t => 
              t.projectId === node.projectId && 
              t.completed && 
              !t.parentTaskId &&
              t.memberId === currentUser.id
            );
            
            // 이미 추가된 업무 ID
            const existingTaskIds = updatedNodes
              .filter(n => n.taskId && connections.some(c => c.from === node.id && c.to === n.id))
              .map(n => n.taskId);
            
            // 새로 추가할 업무
            projectTasks.forEach(task => {
              if (!existingTaskIds.includes(task.id)) {
                hasChanges = true;
                const taskNodeId = `task-${task.id}-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`;
                updatedNodes.push({
                  id: taskNodeId,
                  type: 'task',
                  taskId: task.id,
                  text: task.title,
                  x: 0,
                  y: 0,
                  completed: task.completed,
                  color: '#00C471'
                });
                updatedConnections.push({
                  id: `conn-task-${taskNodeId}`,
                  from: node.id,
                  to: taskNodeId
                });
                
                // 서브태스크도 추가 (내가 담당한 것만)
                const subtasks = tasks.filter(st => 
                  st.parentTaskId === task.id && st.completed && st.memberId === currentUser.id
                );
                subtasks.forEach(st => {
                  const subtaskNodeId = `subtask-${st.id}-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`;
                  updatedNodes.push({
                    id: subtaskNodeId,
                    type: 'task',
                    taskId: st.id,
                    text: st.title,
                    x: 0,
                    y: 0,
                    completed: st.completed,
                    color: '#10B981',
                    isSubtask: true
                  });
                  updatedConnections.push({
                    id: `conn-subtask-${subtaskNodeId}`,
                    from: taskNodeId,
                    to: subtaskNodeId
                  });
                });
              }
            });
          }
        });
        
        // 3. 업무일지 업무 동기화 - 모두 "그 외 업무" 노드 아래로
        const weekRange = getWeekRange(selectedYear, selectedWeek);
        const diaryTasks = tasks.filter(t => 
          t.memberId === currentUser.id &&
          t.completed &&
          !t.parentTaskId &&
          t.date >= weekRange.start &&
          t.date <= weekRange.end &&
          // 프로젝트 하위업무가 아닌 것 (projectId가 브랜드 ID이거나 null)
          (BRANDS.some(b => b.id === t.projectId) || !t.projectId)
        );
        
        // 이미 추가된 업무일지 업무 ID
        const existingDiaryTaskIds = updatedNodes.filter(n => n.taskId && n.isDiaryTask).map(n => n.taskId);
        
        // 모든 업무일지 업무를 "그 외 업무" 노드 아래에 추가
        diaryTasks.forEach(task => {
          if (!existingDiaryTaskIds.includes(task.id)) {
            hasChanges = true;
            const brand = BRANDS.find(b => b.id === task.projectId);
            const taskNodeId = `diary-${task.id}-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`;
            updatedNodes.push({
              id: taskNodeId,
              type: 'task',
              taskId: task.id,
              text: task.title,
              x: 0,
              y: 0,
              completed: task.completed,
              color: brand ? brand.color : '#8B95A1',
              isDiaryTask: true,
              brandId: task.projectId || null
            });
            updatedConnections.push({
              id: `conn-diary-${taskNodeId}`,
              from: 'other-tasks',
              to: taskNodeId
            });
          }
        });
        
        if (hasChanges) {
          // 자동 정렬 적용
          const layoutedNodes = autoLayoutTree(updatedNodes, updatedConnections);
          setNodes(layoutedNodes);
          setConnections(updatedConnections);
          saveBoard(layoutedNodes, updatedConnections);
          alert('✅ 동기화 완료!\n프로젝트/업무 변경사항이 반영되었습니다.');
        } else {
          alert('ℹ️ 변경사항이 없습니다.');
        }
      };
      
      // 레이아웃 상수 - EdrawMind 스타일
      const LAYOUT = {
        centerX: 200,
        centerY: 300,
        level1X: 330,   // 브랜드 노드
        level2X: 490,   // 프로젝트 노드
        level3X: 660,   // 하위업무 노드
        level4X: 820,   // 서브태스크 노드
        nodeGapY: 70,
        taskGapY: 50,
        subtaskGapY: 38
      };
      
      // 트리 자동 정렬 함수 - 레벨별 고정 X좌표
      const autoLayoutTree = (nodeList, connList) => {
        const centerNode = nodeList.find(n => n.id === 'center');
        if (!centerNode) return nodeList;
        
        // 레벨별 X 좌표
        const levelX = {
          0: LAYOUT.centerX,
          1: LAYOUT.level1X,
          2: LAYOUT.level2X,
          3: LAYOUT.level3X,
          4: LAYOUT.level4X,
          5: LAYOUT.level4X + 150
        };
        
        // 자식 노드 가져오기
        const getChildren = (parentId) => {
          return connList.filter(c => c.from === parentId).map(c => nodeList.find(n => n.id === c.to)).filter(Boolean);
        };
        
        // 서브트리 높이 계산 (총 필요 세로 공간)
        const getSubtreeHeight = (nodeId, level, visited = new Set()) => {
          if (visited.has(nodeId)) return 0;
          visited.add(nodeId);
          
          const children = getChildren(nodeId);
          const gap = level === 1 ? LAYOUT.nodeGapY : level === 2 ? LAYOUT.taskGapY : LAYOUT.subtaskGapY;
          
          if (children.length === 0) return gap;
          
          let totalHeight = 0;
          children.forEach(child => {
            totalHeight += getSubtreeHeight(child.id, level + 1, new Set(visited));
          });
          return totalHeight;
        };
        
        // 노드 배치 (재귀)
        const positionNode = (nodeId, level, startY) => {
          const node = nodeList.find(n => n.id === nodeId);
          if (!node) return startY;
          
          node.x = levelX[level] || (levelX[4] + (level - 4) * 160);
          
          const children = getChildren(nodeId);
          const gap = level === 1 ? LAYOUT.nodeGapY : level === 2 ? LAYOUT.taskGapY : LAYOUT.subtaskGapY;
          
          if (children.length === 0) {
            node.y = startY;
            return startY + gap;
          }
          
          // 자식들 먼저 배치
          let currentY = startY;
          const childYs = [];
          
          children.forEach(child => {
            const childStartY = currentY;
            currentY = positionNode(child.id, level + 1, currentY);
            childYs.push(nodeList.find(n => n.id === child.id)?.y || childStartY);
          });
          
          // 부모는 자식들의 중앙에 배치
          if (childYs.length > 0) {
            node.y = (Math.min(...childYs) + Math.max(...childYs)) / 2;
          } else {
            node.y = startY;
          }
          
          return currentY;
        };
        
        // 중심 노드부터 시작
        const level1Children = getChildren('center');
        let currentY = 100;
        
        level1Children.forEach(child => {
          currentY = positionNode(child.id, 1, currentY);
        });
        
        // 중심 노드 위치 설정
        centerNode.x = LAYOUT.centerX;
        if (level1Children.length > 0) {
          const ys = level1Children.map(c => c.y);
          centerNode.y = (Math.min(...ys) + Math.max(...ys)) / 2;
        } else {
          centerNode.y = LAYOUT.centerY;
        }
        
        return nodeList;
      };
      
      // 프로젝트 드롭 핸들러 - 프로젝트 + 하위업무 추가
      const handleDropProject = (project) => {
        const centerNode = nodes.find(n => n.id === 'center');
        if (!centerNode) return;
        
        const projectBrand = getProjectBrand(project);
        if (!projectBrand) return;
        
        // 해당 브랜드의 노드가 이미 있는지 확인
        const brandNodeId = `brand-${projectBrand.id}`;
        let existingBrandNode = nodes.find(n => n.id === brandNodeId);
        
        let updatedNodes = [...nodes];
        let updatedConnections = [...connections];
        
        // 브랜드 노드가 없으면 생성
        if (!existingBrandNode) {
          const brandNode = {
            id: brandNodeId,
            type: 'brand',
            text: projectBrand.name,
            x: 0,
            y: 0,
            color: projectBrand.color,
            brandId: projectBrand.id
          };
          
          updatedNodes.push(brandNode);
          updatedConnections.push({
            id: `conn-brand-${brandNodeId}`,
            from: 'center',
            to: brandNodeId
          });
        }
        
        // 완료된 하위업무 중 내가 담당한 업무만 필터링 (부모 업무만)
        const allProjectTasks = getProjectTasks(project.id);
        const projectTasks = allProjectTasks.filter(t => 
          t.completed && !t.parentTaskId && t.memberId === currentUser.id
        );
        
        // 프로젝트 노드 (브랜치로 생성)
        const projectNodeId = `project-${project.id}-${Date.now()}`;
        
        const projectNode = {
          id: projectNodeId,
          type: 'branch',
          projectId: project.id,
          text: project.title,
          x: 0,
          y: 0,
          color: projectBrand?.color || '#6B7684',
          brandId: project.brandId,
          kpiLabel: '',
          kpiValue: ''
        };
        
        // 프로젝트-브랜드 연결 (브랜드 노드 아래에)
        const projectConnection = {
          id: `conn-project-${Date.now()}`,
          from: brandNodeId,
          to: projectNodeId
        };
        
        // 완료된 하위업무 노드들
        const taskNodes = [];
        const taskConnections = [];
        const subtaskNodes = [];
        const subtaskConnections = [];
        
        projectTasks.forEach((task) => {
          const taskNodeId = `task-${task.id}-${Date.now()}`;
          
          taskNodes.push({
            id: taskNodeId,
            type: 'task',
            taskId: task.id,
            text: task.title,
            x: 0,
            y: 0,
            completed: task.completed,
            color: '#00C471'
          });
          
          taskConnections.push({
            id: `conn-task-${taskNodeId}`,
            from: projectNodeId,
            to: taskNodeId
          });
          
          // 서브태스크 추가
          const subtasks = allProjectTasks.filter(st => st.parentTaskId === task.id && st.completed && st.memberId === currentUser.id);
          subtasks.forEach((st) => {
            const subtaskNodeId = `subtask-${st.id}-${Date.now()}`;
            subtaskNodes.push({
              id: subtaskNodeId,
              type: 'task',
              taskId: st.id,
              text: st.title,
              x: 0,
              y: 0,
              completed: st.completed,
              color: '#10B981',
              isSubtask: true
            });
            
            subtaskConnections.push({
              id: `conn-subtask-${subtaskNodeId}`,
              from: taskNodeId,
              to: subtaskNodeId
            });
          });
        });
        
        updatedNodes = [...updatedNodes, projectNode, ...taskNodes, ...subtaskNodes];
        updatedConnections = [...updatedConnections, projectConnection, ...taskConnections, ...subtaskConnections];
        
        // 자동 레이아웃 적용
        updatedNodes = autoLayoutTree(updatedNodes, updatedConnections);
        
        setNodes(updatedNodes);
        setConnections(updatedConnections);
        saveBoard(updatedNodes, updatedConnections);
      };
      
      // 가지(브랜치) 추가
      const addBranch = () => {
        if (!newBranchName.trim()) return;
        
        const newNode = {
          id: `branch-${Date.now()}`,
          type: 'branch',
          text: newBranchName.trim(),
          x: 0,
          y: 0,
          color: '#6B7684',
          kpiLabel: '',
          kpiValue: ''
        };
        
        const newConnection = {
          id: `conn-${Date.now()}`,
          from: 'center',
          to: newNode.id
        };
        
        let updatedNodes = [...nodes, newNode];
        const updatedConnections = [...connections, newConnection];
        
        // 자동 레이아웃 적용
        updatedNodes = autoLayoutTree(updatedNodes, updatedConnections);
        
        setNodes(updatedNodes);
        setConnections(updatedConnections);
        saveBoard(updatedNodes, updatedConnections);
        
        setNewBranchName('');
        setShowAddBranch(false);
      };
      
      // 업무를 브랜치에 추가 (드롭)
      const handleDropOnBranch = (branchId, task) => {
        const branchNode = nodes.find(n => n.id === branchId);
        if (!branchNode) return;
        
        const childCount = connections.filter(c => c.from === branchId).length;
        const offsetY = childCount * 50;
        
        const newNode = {
          id: `task-${Date.now()}`,
          type: 'task',
          taskId: task.id,
          text: task.title,
          x: branchNode.x + 180,
          y: branchNode.y - 50 + offsetY,
          completed: task.completed,
          color: task.completed ? '#00C471' : '#3182F6'
        };
        
        const newConnection = {
          id: `conn-${Date.now()}`,
          from: branchId,
          to: newNode.id
        };
        
        const updatedNodes = [...nodes, newNode];
        const updatedConnections = [...connections, newConnection];
        
        setNodes(updatedNodes);
        setConnections(updatedConnections);
        saveBoard(updatedNodes, updatedConnections);
      };
      
      // 노드 드래그 중인 노드 ID와 겹치는 대상 노드
      const [draggingNodeId, setDraggingNodeId] = useState(null);
      const [dropTargetNodeId, setDropTargetNodeId] = useState(null);
      const dropTargetRef = React.useRef(null); // ref로 실시간 추적
      
      // 노드의 모든 자손 ID 가져오기
      const getAllDescendantIds = (nodeId, connList) => {
        const descendants = [];
        const childConns = connList.filter(c => c.from === nodeId);
        childConns.forEach(conn => {
          descendants.push(conn.to);
          descendants.push(...getAllDescendantIds(conn.to, connList));
        });
        return descendants;
      };
      
      // 노드 드래그 (자식들도 함께 이동)
      const handleNodeDrag = (nodeId, dx, dy) => {
        setDraggingNodeId(nodeId);
        
        // 이동할 노드들 (자신 + 모든 자손)
        const descendantIds = getAllDescendantIds(nodeId, connections);
        const moveIds = [nodeId, ...descendantIds];
        
        // 드래그 노드의 부모 찾기
        const dragParentConn = connections.find(c => c.to === nodeId);
        const dragParentId = dragParentConn?.from;
        
        setNodes(prev => {
          const updated = prev.map(n => 
            moveIds.includes(n.id) ? { ...n, x: n.x + dx, y: n.y + dy } : n
          );
          
          // 노드 너비 계산
          const getNodeWidth = (n) => {
            if (n.type === 'center') return 120;
            if (n.type === 'brand') return 130;
            if (n.type === 'branch') return 140;
            return n.isSubtask ? 110 : 130;
          };
          
          // 노드 중심점 계산 (왼쪽 정렬 노드는 x + width/2)
          const getNodeCenter = (n) => {
            if (n.type === 'center') return { x: n.x, y: n.y };
            return { x: n.x + getNodeWidth(n) / 2, y: n.y };
          };
          
          // 드래그 중인 노드와 겹치는 노드 찾기 (자손 제외)
          const draggingNode = updated.find(n => n.id === nodeId);
          if (draggingNode) {
            const dragCenter = getNodeCenter(draggingNode);
            let foundTarget = null;
            let minDist = Infinity;
            
            for (const otherNode of updated) {
              if (otherNode.id === nodeId) continue;
              if (moveIds.includes(otherNode.id)) continue; // 자손은 드롭 대상에서 제외
              
              // 타겟 노드의 부모 찾기
              const otherParentConn = connections.find(c => c.to === otherNode.id);
              const otherParentId = otherParentConn?.from;
              
              // 같은 부모의 형제가 아닌 task는 드롭 대상에서 제외 (부모가 될 수 없음)
              const isSibling = dragParentId && dragParentId === otherParentId;
              if (otherNode.type === 'task' && !isSibling) continue;
              
              const otherCenter = getNodeCenter(otherNode);
              
              // 겹침 판정 (노드 중심 간 거리)
              const dist = Math.sqrt(
                Math.pow(dragCenter.x - otherCenter.x, 2) + 
                Math.pow(dragCenter.y - otherCenter.y, 2)
              );
              
              if (dist < 100 && dist < minDist) { // 100px 이내 중 가장 가까운 노드
                foundTarget = otherNode.id;
                minDist = dist;
              }
            }
            dropTargetRef.current = foundTarget; // ref도 업데이트
            setDropTargetNodeId(foundTarget);
          }
          
          return updated;
        });
      };
      
      const handleNodeDragEnd = (nodeId) => {
        // 드롭 대상이 있으면 이동 (ref 사용으로 최신 값 보장)
        const targetId = dropTargetRef.current;
        if (targetId && nodeId) {
          handleMoveNodeToParent(nodeId, targetId);
        } else {
          saveBoard(nodes, connections);
        }
        setDraggingNodeId(null);
        setDropTargetNodeId(null);
        dropTargetRef.current = null;
      };
      
      // 노드를 다른 노드의 하위로 이동 또는 순서 변경
      const handleMoveNodeToParent = (childNodeId, targetNodeId) => {
        if (childNodeId === targetNodeId) return;
        if (childNodeId === 'center') return;
        
        const childNode = nodes.find(n => n.id === childNodeId);
        const targetNode = nodes.find(n => n.id === targetNodeId);
        if (!childNode || !targetNode) return;
        
        // 드래그 노드의 현재 부모 찾기
        const childParentConn = connections.find(c => c.to === childNodeId);
        const childParentId = childParentConn?.from;
        
        // 타겟 노드의 부모 찾기
        const targetParentConn = connections.find(c => c.to === targetNodeId);
        const targetParentId = targetParentConn?.from;
        
        // 자기 자신의 자식에게 이동하는 것 방지
        const isChildOfDragging = (nodeId) => {
          const childConns = connections.filter(c => c.from === childNodeId);
          for (const conn of childConns) {
            if (conn.to === nodeId) return true;
            if (isChildOfDragging(conn.to)) return true;
          }
          return false;
        };
        if (isChildOfDragging(targetNodeId)) return;
        
        let updatedConnections = [...connections];
        
        // 같은 부모를 가진 형제 노드인 경우 → 순서만 변경 (연결은 그대로)
        if (childParentId === targetParentId && childParentId) {
          // 연결은 변경하지 않고, 순서만 바꾸기 위해 connections 배열 순서 조정
          const parentConns = updatedConnections.filter(c => c.from === childParentId);
          const otherConns = updatedConnections.filter(c => c.from !== childParentId);
          
          // 타겟 노드 위치 찾기
          const targetIdx = parentConns.findIndex(c => c.to === targetNodeId);
          const childIdx = parentConns.findIndex(c => c.to === childNodeId);
          
          if (targetIdx !== -1 && childIdx !== -1) {
            // child를 target 위치로 이동
            const [childConn] = parentConns.splice(childIdx, 1);
            const newTargetIdx = parentConns.findIndex(c => c.to === targetNodeId);
            parentConns.splice(newTargetIdx, 0, childConn);
            updatedConnections = [...otherConns, ...parentConns];
          }
        } else {
          // 다른 부모의 노드 → 하위로 이동
          // 기존 연결 제거
          updatedConnections = connections.filter(c => c.to !== childNodeId);
          
          // 새 연결 추가 (타겟 노드의 하위로)
          updatedConnections.push({
            id: `conn-move-${Date.now()}`,
            from: targetNodeId,
            to: childNodeId
          });
        }
        
        // 자동 레이아웃 적용
        let updatedNodes = autoLayoutTree([...nodes], updatedConnections);
        
        setNodes(updatedNodes);
        setConnections(updatedConnections);
        saveBoard(updatedNodes, updatedConnections);
        setDraggingNodeId(null);
        setDropTargetNodeId(null);
        dropTargetRef.current = null;
      };
      
      // 노드 삭제
      const deleteNode = (nodeId) => {
        if (nodeId === 'center') return;
        
        // 연결된 자식 노드도 함께 삭제
        const childIds = connections.filter(c => c.from === nodeId).map(c => c.to);
        const allDeleteIds = [nodeId, ...childIds];
        
        const updatedNodes = nodes.filter(n => !allDeleteIds.includes(n.id));
        const updatedConnections = connections.filter(c => 
          !allDeleteIds.includes(c.from) && !allDeleteIds.includes(c.to)
        );
        
        setNodes(updatedNodes);
        setConnections(updatedConnections);
        saveBoard(updatedNodes, updatedConnections);
        setSelectedNode(null);
      };
      
      // KPI 업데이트
      const updateNodeKpi = (nodeId, kpiLabel, kpiValue) => {
        const updatedNodes = nodes.map(n => 
          n.id === nodeId ? { ...n, kpiLabel, kpiValue } : n
        );
        setNodes(updatedNodes);
        saveBoard(updatedNodes, connections);
      };
      
      // 노드 텍스트 업데이트
      const updateNodeText = (nodeId, text) => {
        const updatedNodes = nodes.map(n => 
          n.id === nodeId ? { ...n, text } : n
        );
        setNodes(updatedNodes);
        saveBoard(updatedNodes, connections);

      // 브랜드 정보

      // 드래그 중인 프로젝트

      // 카테고리에 프로젝트 드롭 핸들러
      const handleDropOnCategory = (categoryNodeId, project) => {
        const categoryNode = nodes.find(n => n.id === categoryNodeId);
        if (!categoryNode || categoryNode.projectId) return; // 이미 프로젝트가 연결된 노드면 무시
        
        const projectBrand = getProjectBrand(project);
        
        // 완료된 하위업무 중 내가 담당한 업무만 필터링 (부모 업무만)
        const allProjectTasks = getProjectTasks(project.id);
        const projectTasks = allProjectTasks.filter(t => 
          t.completed && !t.parentTaskId && t.memberId === currentUser.id

        // 프로젝트 노드 생성 (카테고리 하위에)
        const projectNodeId = `project-${project.id}-${Date.now()}`;
        const projectNode = {
          id: projectNodeId,
          type: 'branch',
          projectId: project.id,
          text: project.title,
          x: 0,
          y: 0,
          color: projectBrand?.color || '#6B7684',
          brandId: project.brandId,
          kpiLabel: '',
          kpiValue: ''
        };
        
        // 프로젝트-카테고리 연결
        const projectConnection = {
          id: `conn-project-${Date.now()}`,
          from: categoryNodeId,
          to: projectNodeId
        };
        
        // 완료된 하위업무 노드들 + 서브태스크
        const taskNodes = [];
        const taskConnections = [];
        const subtaskNodes = [];
        const subtaskConnections = [];
        
        projectTasks.forEach((task) => {
          const taskNodeId = `task-${task.id}-${Date.now()}`;
          
          taskNodes.push({
            id: taskNodeId,
            type: 'task',
            taskId: task.id,
            text: task.title,
            x: 0,
            y: 0,
            completed: task.completed,
            color: '#00C471'
          });
          
          taskConnections.push({
            id: `conn-task-${taskNodeId}`,
            from: projectNodeId,
            to: taskNodeId
          });
          
          // 서브태스크 추가
          const subtasks = allProjectTasks.filter(st => st.parentTaskId === task.id && st.completed && st.memberId === currentUser.id);
          subtasks.forEach((st) => {
            const subtaskNodeId = `subtask-${st.id}-${Date.now()}`;
            subtaskNodes.push({
              id: subtaskNodeId,
              type: 'task',
              taskId: st.id,
              text: st.title,
              x: 0,
              y: 0,
              completed: st.completed,
              color: '#10B981',
              isSubtask: true
            });
            
            subtaskConnections.push({
              id: `conn-subtask-${subtaskNodeId}`,
              from: taskNodeId,
              to: subtaskNodeId
            });
          });
        });
        
        let updatedNodes = [...nodes, projectNode, ...taskNodes, ...subtaskNodes];
        const updatedConnections = [...connections, projectConnection, ...taskConnections, ...subtaskConnections];
        
        // 자동 레이아웃 적용
        updatedNodes = autoLayoutTree(updatedNodes, updatedConnections);
        
        setNodes(updatedNodes);
        setConnections(updatedConnections);
        saveBoard(updatedNodes, updatedConnections);
      };
      
      // 전체 레이아웃 재정렬 함수
      const reLayoutAll = () => {
        const updatedNodes = autoLayoutTree([...nodes], connections);
        setNodes(updatedNodes);
        saveBoard(updatedNodes, connections);
      };

      return (
        <div style={{ display: 'flex', height: '100vh', background: '#F7F8FA' }}>
          {/* 왼쪽: 프로젝트 목록 (브랜드별 그룹화) */}
          <div style={{ width: 320, background: 'white', borderRight: '1px solid #E5E8EB', display: 'flex', flexDirection: 'column' }}>
            <div style={{ padding: 20, borderBottom: '1px solid #E5E8EB' }}>
              <h2 style={{ fontSize: 16, fontWeight: 700, color: '#191F28', marginBottom: 16 }}>📁 프로젝트</h2>
              
              {/* 기간 선택 */}
              <div style={{ display: 'flex', gap: 8 }}>
                <select 
                  value={selectedYear} 
                  onChange={(e) => setSelectedYear(Number(e.target.value))}
                  style={{ flex: 1, padding: '8px 12px', borderRadius: 8, border: '1px solid #E5E8EB', fontSize: 13 }}
                >
                  {[2024, 2025, 2026].map(y => <option key={y} value={y}>{y}년</option>)}
                </select>
                <select 
                  value={selectedWeek} 
                  onChange={(e) => setSelectedWeek(Number(e.target.value))}
                  style={{ flex: 1, padding: '8px 12px', borderRadius: 8, border: '1px solid #E5E8EB', fontSize: 13 }}
                >
                  {Array.from({ length: 52 }, (_, i) => i + 1).map(w => 
                    <option key={w} value={w}>{w}주차</option>
                  )}
                </select>
              </div>
            </div>
            
            {/* 브랜드별 프로젝트 목록 */}
            <div style={{ flex: 1, overflow: 'auto', padding: 12 }}>
              {BRANDS.map(brand => {
                const brandProjects = myProjects.filter(p => p.brandId === brand.id);
                
                if (brandProjects.length === 0) return null;
                
                return (
                  <div key={brand.id} style={{ marginBottom: 20 }}>
                    {/* 브랜드 헤더 */}
                    <div style={{ 
                      display: 'flex', alignItems: 'center', gap: 8, 
                      padding: '8px 12px', marginBottom: 8,
                      background: `${brand.color}10`, borderRadius: 8,
                      borderLeft: `3px solid ${brand.color}`
                    }}>
                      <span style={{ fontSize: 13, fontWeight: 700, color: brand.color }}>{brand.name}</span>
                      <span style={{ fontSize: 11, color: '#8B95A1' }}>({brandProjects.length})</span>
                    </div>
                    
                    {/* 프로젝트 카드들 */}
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                      {brandProjects.map(project => {
                        const isAdded = addedProjectIds.includes(project.id);
                        const projectTasks = getProjectTasks(project.id);
                        const completedCount = projectTasks.filter(t => t.completed).length;
                        const statusColors = { progress: '#3182F6', hold: '#F59E0B', complete: '#00C471' };
                        const statusLabels = { progress: '진행중', hold: '보류', complete: '완료' };
                        
                        return (
                          <div
                            key={project.id}

                            onDragStart={(e) => {
                              if (isAdded) return;
                              setDraggedProject(project);
                              e.dataTransfer.effectAllowed = 'copy';
                            }}
                            onDragEnd={() => setDraggedProject(null)}
                            style={{
                              padding: '12px 14px', borderRadius: 10,
                              background: isAdded ? '#F7F8FA' : 'white',
                              border: `1px solid ${isAdded ? '#E5E8EB' : '#E5E8EB'}`,
                              opacity: isAdded ? 0.5 : 1,
                              cursor: isAdded ? 'default' : 'grab',
                              borderLeft: `3px solid ${brand.color}`
                            }}
                          >
                            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 6 }}>
                              <span style={{ 
                                fontSize: 13, fontWeight: 600, 
                                color: '#191F28',
                                flex: 1
                              }}>{project.title}</span>
                              {isAdded && <span style={{ fontSize: 10, color: '#00C471', fontWeight: 600 }}>✓ 추가됨</span>}
                            </div>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                              <span style={{ 
                                fontSize: 10, padding: '2px 6px', borderRadius: 4, 
                                background: `${statusColors[project.status]}15`, 
                                color: statusColors[project.status],
                                fontWeight: 600
                              }}>{statusLabels[project.status]}</span>
                              <span style={{ fontSize: 10, color: '#8B95A1' }}>
                                완료 {completedCount} / 전체 {projectTasks.length}
                              </span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
              
              {/* 그 외 업무 섹션 (업무일지 업무 통합) */}
              {(() => {
                const weekRange = getWeekRange(selectedYear, selectedWeek);
                const diaryTasks = tasks.filter(t => 
                  t.memberId === currentUser.id &&
                  t.completed &&
                  !t.parentTaskId &&
                  t.date >= weekRange.start &&

                  (BRANDS.some(b => b.id === t.projectId) || !t.projectId)
                );
                
                if (diaryTasks.length === 0) return null;
                
                return (
                  <div style={{ marginBottom: 20 }}>
                    {/* 그 외 업무 헤더 */}
                    <div style={{

                      padding: '8px 12px', marginBottom: 8,

                    }}>
                      <span style={{ fontSize: 13, fontWeight: 700, color: '#6B7684' }}>그 외 업무</span>

                    {/* 업무일지 업무 카드들 */}

                      {diaryTasks.map(task => {

                          >
                            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                              <span style={{ fontSize: 12, fontWeight: 500, color: '#4B5563' }}>{task.title}</span>
                              {isAdded && <span style={{ fontSize: 10, color: '#6B7684', fontWeight: 600 }}>✓ 추가됨</span>}
                            </div>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 4 }}>
                              <span style={{ fontSize: 10, color: '#9CA3AF' }}>📝 업무일지</span>
                              {brand && <span style={{ fontSize: 10, color: brand.color, fontWeight: 500 }}>{brand.name}</span>}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })()}
              
              {myProjects.length === 0 && (
                <div style={{ padding: 20, textAlign: 'center', color: '#8B95A1' }}>
                  <Icon name="folder" size={32} color="#D1D6DB" />
                  <p style={{ fontSize: 13, marginTop: 8 }}>내 프로젝트가 없습니다</p>
                </div>
              )}
            </div>
          </div>
          
          {/* 오른쪽: 마인드맵 캔버스 */}
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>
            {/* 상단 툴바 */}
            <div style={{ padding: '16px 24px', background: 'white', borderBottom: '1px solid #E5E8EB', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <h1 style={{ fontSize: 20, fontWeight: 700, color: '#191F28' }}>
                  🎯 그로스보드
                </h1>
                <span style={{ fontSize: 14, color: '#6B7684', background: '#F7F8FA', padding: '4px 12px', borderRadius: 6 }}>

                </span>

              <div style={{ display: 'flex', gap: 8 }}>

                  title="프로젝트/업무 변경사항 동기화 + 정렬"
                >
