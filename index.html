                brandId: 'other'
              };
              
              updatedNodes.push(otherNode);
              updatedConnections.push({
                id: `conn-brand-${otherNodeId}`,
                from: 'center',
                to: otherNodeId
              });
            }
            parentNodeId = otherNodeId;
          }
          
          // 업무 노드 추가
          const taskNodeId = `diary-${task.id}-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`;
          
          updatedNodes.push({
            id: taskNodeId,
            type: 'task',
            taskId: task.id,
            text: task.title,
            x: 0,
            y: 0,
            completed: task.completed,
            color: brand ? brand.color : '#8B95A1',
            isDiaryTask: true,
            brandId: task.projectId || null
          });
          
          updatedConnections.push({
            id: `conn-diary-${taskNodeId}`,
            from: parentNodeId,
            to: taskNodeId
          });
          
          // 하위업무도 함께 추가
          const subtaskList = project.subtasks || tasks.filter(t => t.parentTaskId === task.id && t.memberId === currentUser.id);
          subtaskList.forEach((st) => {
            const subtaskNodeId = `subtask-${st.id}-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`;
            updatedNodes.push({
              id: subtaskNodeId,
              type: 'task',
              taskId: st.id,
              text: st.title,
              x: 0,
              y: 0,
              completed: st.completed,
              color: '#10B981',
              isDiaryTask: true,
              isSubtask: true,
              brandId: task.projectId || null
            });
            
            updatedConnections.push({
              id: `conn-subtask-${subtaskNodeId}`,
              from: taskNodeId,
              to: subtaskNodeId
            });
          });
          
          // 자동 레이아웃 적용
          updatedNodes = autoLayoutTree(updatedNodes, updatedConnections);
          
          setNodes(updatedNodes);
          setConnections(updatedConnections);
          saveBoard(updatedNodes, updatedConnections);
          return;
        }
        
        // "그 외 업무" 브랜드 드래그 처리
        if (project.isOtherBrand) {
          let updatedNodes = [...nodes];
          let updatedConnections = [...connections];
          
          // "그 외 업무" 브랜드 노드 생성
          const brandNodeId = 'brand-other';
          const existingBrandNode = nodes.find(n => n.id === brandNodeId);
          
          if (!existingBrandNode) {
            const brandNode = {
              id: brandNodeId,
              type: 'brand',
              text: '그 외 업무',
              x: 0,
              y: 0,
              color: '#8B95A1',
              brandId: 'other'
            };
            
            updatedNodes.push(brandNode);
            updatedConnections.push({
              id: `conn-brand-${brandNodeId}`,
              from: 'center',
              to: brandNodeId
            });
          }
          
          // 업무일지 업무들을 자식 노드로 추가
          project.diaryTasks?.forEach((task) => {
            const taskNodeId = `diary-${task.id}-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`;
            const brand = BRANDS.find(b => b.id === task.projectId);
            
            updatedNodes.push({
              id: taskNodeId,
              type: 'task',
              taskId: task.id,
              text: task.title,
              x: 0,
              y: 0,
              completed: task.completed,
              color: brand ? brand.color : '#8B95A1',
              isDiaryTask: true,
              brandId: task.projectId || null
            });
            
            updatedConnections.push({
              id: `conn-diary-${taskNodeId}`,
              from: brandNodeId,
              to: taskNodeId
            });
            
            // 하위업무도 함께 추가
            const subtaskList = tasks.filter(t => t.parentTaskId === task.id && t.memberId === currentUser.id);
            subtaskList.forEach((st) => {
              const subtaskNodeId = `subtask-${st.id}-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`;
              updatedNodes.push({
                id: subtaskNodeId,
                type: 'task',
                taskId: st.id,
                text: st.title,
                x: 0,
                y: 0,
                completed: st.completed,
                color: '#10B981',
                isDiaryTask: true,
                isSubtask: true,
                brandId: task.projectId || null
              });
              
              updatedConnections.push({
                id: `conn-subtask-${subtaskNodeId}`,
                from: taskNodeId,
                to: subtaskNodeId
              });
            });
          });
          
          // 자동 레이아웃 적용
          updatedNodes = autoLayoutTree(updatedNodes, updatedConnections);
          
          setNodes(updatedNodes);
          setConnections(updatedConnections);
          saveBoard(updatedNodes, updatedConnections);
          return;
        }
        
        const projectBrand = getProjectBrand(project);
        if (!projectBrand) return;
        
        // 해당 브랜드의 노드가 이미 있는지 확인
        const brandNodeId = `brand-${projectBrand.id}`;
        let existingBrandNode = nodes.find(n => n.id === brandNodeId);
        
        let updatedNodes = [...nodes];
        let updatedConnections = [...connections];
        
        // 브랜드 노드가 없으면 생성
        if (!existingBrandNode) {
          const brandNode = {
            id: brandNodeId,
            type: 'brand',
            text: projectBrand.name,
            x: 0,
            y: 0,
            color: projectBrand.color,
            brandId: projectBrand.id
          };
          
          updatedNodes.push(brandNode);
          updatedConnections.push({
            id: `conn-brand-${brandNodeId}`,
            from: 'center',
            to: brandNodeId
          });
        }
        
        // 완료된 하위업무 중 내가 담당한 업무만 필터링 (부모 업무만)
        const allProjectTasks = getProjectTasks(project.id);
        const projectTasks = allProjectTasks.filter(t => 
          t.completed && !t.parentTaskId && t.memberId === currentUser.id
        );
        
        // 프로젝트 노드 (브랜치로 생성)
        const projectNodeId = `project-${project.id}-${Date.now()}`;
        
        const projectNode = {
          id: projectNodeId,
          type: 'branch',
          projectId: project.id,
          text: project.title,
          x: 0,
          y: 0,
          color: projectBrand?.color || '#6B7684',
          brandId: project.brandId,
          kpiLabel: '',
          kpiValue: ''
        };
        
        // 프로젝트-브랜드 연결 (브랜드 노드 아래에)
        const projectConnection = {
          id: `conn-project-${Date.now()}`,
          from: brandNodeId,
          to: projectNodeId
        };
        
        // 완료된 하위업무 노드들
        const taskNodes = [];
        const taskConnections = [];
        const subtaskNodes = [];
        const subtaskConnections = [];
        
        projectTasks.forEach((task) => {
          const taskNodeId = `task-${task.id}-${Date.now()}`;
          
          taskNodes.push({
            id: taskNodeId,
            type: 'task',
            taskId: task.id,
            text: task.title,
            x: 0,
            y: 0,
            completed: task.completed,
            color: '#00C471'
          });
          
          taskConnections.push({
            id: `conn-task-${taskNodeId}`,
            from: projectNodeId,
            to: taskNodeId
          });
          
          // 서브태스크 추가
          const subtasks = allProjectTasks.filter(st => st.parentTaskId === task.id && st.completed && st.memberId === currentUser.id);
          subtasks.forEach((st) => {
            const subtaskNodeId = `subtask-${st.id}-${Date.now()}`;
            subtaskNodes.push({
              id: subtaskNodeId,
              type: 'task',
              taskId: st.id,
              text: st.title,
              x: 0,
              y: 0,
              completed: st.completed,
              color: '#10B981',
              isSubtask: true
            });
            
            subtaskConnections.push({
              id: `conn-subtask-${subtaskNodeId}`,
              from: taskNodeId,
              to: subtaskNodeId
            });
          });
        });
        
        updatedNodes = [...updatedNodes, projectNode, ...taskNodes, ...subtaskNodes];
        updatedConnections = [...updatedConnections, projectConnection, ...taskConnections, ...subtaskConnections];
        
        // 자동 레이아웃 적용
        updatedNodes = autoLayoutTree(updatedNodes, updatedConnections);
        
        setNodes(updatedNodes);
        setConnections(updatedConnections);
        saveBoard(updatedNodes, updatedConnections);
      };
      
      // 가지(브랜치) 추가
      const addBranch = () => {
        if (!newBranchName.trim()) return;
        
        const newNode = {
          id: `branch-${Date.now()}`,
          type: 'branch',
          text: newBranchName.trim(),
          x: 0,
          y: 0,
          color: '#6B7684',
          kpiLabel: '',
          kpiValue: ''
        };
        
        const newConnection = {
          id: `conn-${Date.now()}`,
          from: 'center',
          to: newNode.id
        };
        
        let updatedNodes = [...nodes, newNode];
        const updatedConnections = [...connections, newConnection];
        
        // 자동 레이아웃 적용
        updatedNodes = autoLayoutTree(updatedNodes, updatedConnections);
        
        setNodes(updatedNodes);
        setConnections(updatedConnections);
        saveBoard(updatedNodes, updatedConnections);
        
        setNewBranchName('');
        setShowAddBranch(false);
      };
      
      // 업무를 브랜치에 추가 (드롭)
      const handleDropOnBranch = (branchId, task) => {
        const branchNode = nodes.find(n => n.id === branchId);
        if (!branchNode) return;
        
        const childCount = connections.filter(c => c.from === branchId).length;
        const offsetY = childCount * 50;
        
        const newNode = {
          id: `task-${Date.now()}`,
          type: 'task',
          taskId: task.id,
          text: task.title,
          x: branchNode.x + 180,
          y: branchNode.y - 50 + offsetY,
          completed: task.completed,
          color: task.completed ? '#00C471' : '#3182F6'
        };
        
        const newConnection = {
          id: `conn-${Date.now()}`,
          from: branchId,
          to: newNode.id
        };
        
        const updatedNodes = [...nodes, newNode];
        const updatedConnections = [...connections, newConnection];
        
        setNodes(updatedNodes);
        setConnections(updatedConnections);
        saveBoard(updatedNodes, updatedConnections);
      };
      
      // 노드 드래그 중인 노드 ID와 겹치는 대상 노드
      const [draggingNodeId, setDraggingNodeId] = useState(null);
      const [dropTargetNodeId, setDropTargetNodeId] = useState(null);
      const dropTargetRef = React.useRef(null); // ref로 실시간 추적
      
      // 노드의 모든 자손 ID 가져오기
      const getAllDescendantIds = (nodeId, connList) => {
        const descendants = [];
        const childConns = connList.filter(c => c.from === nodeId);
        childConns.forEach(conn => {
          descendants.push(conn.to);
          descendants.push(...getAllDescendantIds(conn.to, connList));
        });
        return descendants;
      };
      
      // 노드 드래그 (자식들도 함께 이동)
      const handleNodeDrag = (nodeId, dx, dy) => {
        setDraggingNodeId(nodeId);
        
        // 이동할 노드들 (자신 + 모든 자손)
        const descendantIds = getAllDescendantIds(nodeId, connections);
        const moveIds = [nodeId, ...descendantIds];
        
        // 드래그 노드의 부모 찾기
        const dragParentConn = connections.find(c => c.to === nodeId);
        const dragParentId = dragParentConn?.from;
        
        setNodes(prev => {
          const updated = prev.map(n => 
            // 드래그 중에는 자유롭게 이동
            moveIds.includes(n.id) ? { ...n, x: n.x + dx, y: n.y + dy } : n
          );
          
          // 노드 너비 계산 (연결선용 - 실제 노드 너비와 일치)
          const getNodeWidth = (n) => {
            if (n.type === 'center') return 120;
            if (n.type === 'brand' || n.type === 'other') return 120;
            if (n.type === 'branch') return 150;
            return n.isSubtask ? 130 : 160;
          };
          
          // 노드 중심점 계산 (왼쪽 정렬 노드는 x + width/2)
          const getNodeCenter = (n) => {
            if (n.type === 'center') return { x: n.x, y: n.y };
            return { x: n.x + getNodeWidth(n) / 2, y: n.y };
          };
          
          // 드래그 중인 노드와 겹치는 노드 찾기 (자손 제외)
          const draggingNode = updated.find(n => n.id === nodeId);
          if (draggingNode) {
            const dragCenter = getNodeCenter(draggingNode);
            let foundTarget = null;
            let minDist = Infinity;
            
            for (const otherNode of updated) {
              if (otherNode.id === nodeId) continue;
              if (moveIds.includes(otherNode.id)) continue; // 자손은 드롭 대상에서 제외
              
              // 타겟 노드의 부모 찾기
              const otherParentConn = connections.find(c => c.to === otherNode.id);
              const otherParentId = otherParentConn?.from;
              
              // 같은 부모의 형제가 아닌 task는 드롭 대상에서 제외 (부모가 될 수 없음)
              const isSibling = dragParentId && dragParentId === otherParentId;
              if (otherNode.type === 'task' && !isSibling) continue;
              
              const otherCenter = getNodeCenter(otherNode);
              
              // 겹침 판정 (노드 중심 간 거리)
              const dist = Math.sqrt(
                Math.pow(dragCenter.x - otherCenter.x, 2) + 
                Math.pow(dragCenter.y - otherCenter.y, 2)
              );
              
              if (dist < 100 && dist < minDist) { // 100px 이내 중 가장 가까운 노드
                foundTarget = otherNode.id;
                minDist = dist;
              }
            }
            dropTargetRef.current = foundTarget; // ref도 업데이트
            setDropTargetNodeId(foundTarget);
          }
          
          return updated;
        });
      };
      
      const handleNodeDragEnd = (nodeId) => {
        // 드롭 대상이 있으면 이동 (ref 사용으로 최신 값 보장)
        const targetId = dropTargetRef.current;
        if (targetId && nodeId) {
          handleMoveNodeToParent(nodeId, targetId);
        } else {
          // 드래그만 한 경우 - X좌표를 레벨별로 자동 정렬
          const alignedNodes = alignXPositions(nodes, connections);
          setNodes(alignedNodes);
          saveBoard(alignedNodes, connections);
        }
        setDraggingNodeId(null);
        setDropTargetNodeId(null);
        dropTargetRef.current = null;
      };
      
      // X좌표만 레벨별로 정렬 (Y좌표는 유지)
      const alignXPositions = (nodeList, connList) => {
        const levelX = {
          0: LAYOUT.centerX,
          1: LAYOUT.level1X,
          2: LAYOUT.level2X,
          3: LAYOUT.level3X,
          4: LAYOUT.level4X,
          5: LAYOUT.level4X + 150
        };
        
        // 노드의 레벨 계산
        const getNodeLevel = (nodeId, visited = new Set()) => {
          if (visited.has(nodeId)) return -1;
          visited.add(nodeId);
          
          if (nodeId === 'center') return 0;
          const parentConn = connList.find(c => c.to === nodeId);
          if (!parentConn) return 1; // 연결 없으면 레벨1로 간주
          return getNodeLevel(parentConn.from, visited) + 1;
        };
        
        return nodeList.map(node => {
          if (node.type === 'center') {
            return { ...node, x: LAYOUT.centerX };
          }
          const level = getNodeLevel(node.id);
          const targetX = levelX[level] || (levelX[4] + (level - 4) * 160);
          return { ...node, x: targetX };
        });
      };
      
      // 노드를 다른 노드의 하위로 이동 또는 순서 변경
      const handleMoveNodeToParent = (childNodeId, targetNodeId) => {
        if (childNodeId === targetNodeId) return;
        if (childNodeId === 'center') return;
        
        const childNode = nodes.find(n => n.id === childNodeId);
        const targetNode = nodes.find(n => n.id === targetNodeId);
        if (!childNode || !targetNode) return;
        
        // 드래그 노드의 현재 부모 찾기
        const childParentConn = connections.find(c => c.to === childNodeId);
        const childParentId = childParentConn?.from;
        
        // 타겟 노드의 부모 찾기
        const targetParentConn = connections.find(c => c.to === targetNodeId);
        const targetParentId = targetParentConn?.from;
        
        // 자기 자신의 자식에게 이동하는 것 방지
        const isChildOfDragging = (nodeId) => {
          const childConns = connections.filter(c => c.from === childNodeId);
          for (const conn of childConns) {
            if (conn.to === nodeId) return true;
            if (isChildOfDragging(conn.to)) return true;
          }
          return false;
        };
        if (isChildOfDragging(targetNodeId)) return;
        
        let updatedConnections = [...connections];
        
        // 같은 부모를 가진 형제 노드인 경우 → 순서만 변경 (연결은 그대로)
        if (childParentId === targetParentId && childParentId) {
          // 연결은 변경하지 않고, 순서만 바꾸기 위해 connections 배열 순서 조정
          const parentConns = updatedConnections.filter(c => c.from === childParentId);
          const otherConns = updatedConnections.filter(c => c.from !== childParentId);
          
          // 타겟 노드 위치 찾기
          const targetIdx = parentConns.findIndex(c => c.to === targetNodeId);
          const childIdx = parentConns.findIndex(c => c.to === childNodeId);
          
          if (targetIdx !== -1 && childIdx !== -1) {
            // child를 target 위치로 이동
            const [childConn] = parentConns.splice(childIdx, 1);
            const newTargetIdx = parentConns.findIndex(c => c.to === targetNodeId);
            parentConns.splice(newTargetIdx, 0, childConn);
            updatedConnections = [...otherConns, ...parentConns];
          }
        } else {
          // 다른 부모의 노드 → 하위로 이동
          // 기존 연결 제거
          updatedConnections = connections.filter(c => c.to !== childNodeId);
          
          // 새 연결 추가 (타겟 노드의 하위로)
          updatedConnections.push({
            id: `conn-move-${Date.now()}`,
            from: targetNodeId,
            to: childNodeId
          });
        }
        
        // 자동 레이아웃 적용
        let updatedNodes = autoLayoutTree([...nodes], updatedConnections);
        
        setNodes(updatedNodes);
        setConnections(updatedConnections);
        saveBoard(updatedNodes, updatedConnections);
        setDraggingNodeId(null);
        setDropTargetNodeId(null);
        dropTargetRef.current = null;
      };
      
      // 노드 삭제
      const deleteNode = (nodeId) => {
        if (nodeId === 'center') return;
        
        // 연결된 자식 노드도 함께 삭제
        const childIds = connections.filter(c => c.from === nodeId).map(c => c.to);
        const allDeleteIds = [nodeId, ...childIds];
        
        const updatedNodes = nodes.filter(n => !allDeleteIds.includes(n.id));
        const updatedConnections = connections.filter(c => 
          !allDeleteIds.includes(c.from) && !allDeleteIds.includes(c.to)
        );
        
        setNodes(updatedNodes);
        setConnections(updatedConnections);
        saveBoard(updatedNodes, updatedConnections);
        setSelectedNode(null);
      };
      
      // KPI 업데이트
      const updateNodeKpi = (nodeId, kpiLabel, kpiValue) => {
        const updatedNodes = nodes.map(n => 
          n.id === nodeId ? { ...n, kpiLabel, kpiValue } : n
        );
        setNodes(updatedNodes);
        saveBoard(updatedNodes, connections);
      };
      
      // 노드 텍스트 업데이트
      const updateNodeText = (nodeId, text) => {
        const updatedNodes = nodes.map(n => 
          n.id === nodeId ? { ...n, text } : n
        );
        setNodes(updatedNodes);
        saveBoard(updatedNodes, connections);
        setEditingNode(null);
      };
      
      // 브랜드 정보
      const brand = BRANDS.find(b => b.id === selectedBrand);
      
      // 드래그 중인 프로젝트
      const [draggedProject, setDraggedProject] = useState(null);
      const [dragOverNodeId, setDragOverNodeId] = useState(null);
      
      // 카테고리에 프로젝트 드롭 핸들러
      const handleDropOnCategory = (categoryNodeId, project) => {
        const categoryNode = nodes.find(n => n.id === categoryNodeId);
        if (!categoryNode || categoryNode.projectId) return; // 이미 프로젝트가 연결된 노드면 무시
        
        const projectBrand = getProjectBrand(project);
        
        // 완료된 하위업무 중 내가 담당한 업무만 필터링 (부모 업무만)
        const allProjectTasks = getAllProjectTasks(project.id);
        const projectTasks = allProjectTasks.filter(t => 
          t.completed && !t.parentTaskId && t.memberId === currentUser.id
        );
        
        // 프로젝트 노드 생성 (카테고리 하위에)
        const projectNodeId = `project-${project.id}-${Date.now()}`;
        const projectNode = {
          id: projectNodeId,
          type: 'branch',
          projectId: project.id,
          text: project.title,
          x: 0,
          y: 0,
          color: projectBrand?.color || '#6B7684',
          brandId: project.brandId,
          kpiLabel: '',
          kpiValue: ''
        };
        
        // 프로젝트-카테고리 연결
        const projectConnection = {
          id: `conn-project-${Date.now()}`,
          from: categoryNodeId,
          to: projectNodeId
        };
        
        // 완료된 하위업무 노드들 + 서브태스크
        const taskNodes = [];
        const taskConnections = [];
        const subtaskNodes = [];
        const subtaskConnections = [];
        
        projectTasks.forEach((task) => {
          const taskNodeId = `task-${task.id}-${Date.now()}`;
          
          taskNodes.push({
            id: taskNodeId,
            type: 'task',
            taskId: task.id,
            text: task.title,
            x: 0,
            y: 0,
            completed: task.completed,
            color: '#00C471'
          });
          
          taskConnections.push({
            id: `conn-task-${taskNodeId}`,
            from: projectNodeId,
            to: taskNodeId
          });
          
          // 서브태스크 추가
          const subtasks = allProjectTasks.filter(st => st.parentTaskId === task.id && st.completed && st.memberId === currentUser.id);
          subtasks.forEach((st) => {
            const subtaskNodeId = `subtask-${st.id}-${Date.now()}`;
            subtaskNodes.push({
              id: subtaskNodeId,
              type: 'task',
              taskId: st.id,
              text: st.title,
              x: 0,
              y: 0,
              completed: st.completed,
              color: '#10B981',
              isSubtask: true
            });
            
            subtaskConnections.push({
              id: `conn-subtask-${subtaskNodeId}`,
              from: taskNodeId,
              to: subtaskNodeId
            });
          });
        });
        
        let updatedNodes = [...nodes, projectNode, ...taskNodes, ...subtaskNodes];
        const updatedConnections = [...connections, projectConnection, ...taskConnections, ...subtaskConnections];
        
        // 자동 레이아웃 적용
        updatedNodes = autoLayoutTree(updatedNodes, updatedConnections);
        
        setNodes(updatedNodes);
        setConnections(updatedConnections);
        saveBoard(updatedNodes, updatedConnections);
      };
      
      // 전체 레이아웃 재정렬 함수
      const reLayoutAll = () => {
        const updatedNodes = autoLayoutTree([...nodes], connections);
        setNodes(updatedNodes);
        saveBoard(updatedNodes, connections);
      };

      return (
        <div style={{ display: 'flex', height: '100vh', background: '#F7F8FA' }}>
          {/* 왼쪽: 프로젝트 목록 (브랜드별 그룹화) */}
          <div style={{ width: 320, background: 'white', borderRight: '1px solid #E5E8EB', display: 'flex', flexDirection: 'column' }}>
            <div style={{ padding: 20, borderBottom: '1px solid #E5E8EB' }}>
              <h2 style={{ fontSize: 16, fontWeight: 700, color: '#191F28', marginBottom: 16 }}>📁 프로젝트</h2>
              
              {/* 기간 선택 */}
              <div style={{ display: 'flex', gap: 8 }}>
                <select 
                  value={selectedYear} 
                  onChange={(e) => setSelectedYear(Number(e.target.value))}
                  style={{ flex: 1, padding: '8px 12px', borderRadius: 8, border: '1px solid #E5E8EB', fontSize: 13 }}
                >
                  {[2024, 2025, 2026].map(y => <option key={y} value={y}>{y}년</option>)}
                </select>
                <select 
                  value={selectedWeek} 
                  onChange={(e) => setSelectedWeek(Number(e.target.value))}
                  style={{ flex: 1, padding: '8px 12px', borderRadius: 8, border: '1px solid #E5E8EB', fontSize: 13 }}
                >
                  {Array.from({ length: 52 }, (_, i) => i + 1).map(w => 
                    <option key={w} value={w}>{w}주차</option>
                  )}
                </select>
              </div>
            </div>
            
            {/* 브랜드별 프로젝트 목록 */}
            <div style={{ flex: 1, overflow: 'auto', padding: 12 }}>
              {BRANDS.map(brand => {
                const brandProjects = myProjects.filter(p => p.brandId === brand.id);
                
                if (brandProjects.length === 0) return null;
                
                return (
                  <div key={brand.id} style={{ marginBottom: 20 }}>
                    {/* 브랜드 헤더 */}
                    <div style={{ 
                      display: 'flex', alignItems: 'center', gap: 8, 
                      padding: '8px 12px', marginBottom: 8,
                      background: `${brand.color}10`, borderRadius: 8,
                      borderLeft: `3px solid ${brand.color}`
                    }}>
                      <span style={{ fontSize: 13, fontWeight: 700, color: brand.color }}>{brand.name}</span>
                      <span style={{ fontSize: 11, color: '#8B95A1' }}>({brandProjects.length})</span>
                    </div>
                    
                    {/* 프로젝트 카드들 */}
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                      {brandProjects.map(project => {
                        const isAdded = addedProjectIds.includes(project.id);
                        const projectTasks = getProjectTasks(project.id);
                        const allTasks = getAllProjectTasks(project.id);
                        const completedCount = allTasks.filter(t => t.completed).length;
                        const subtaskCount = allTasks.filter(t => t.parentTaskId).length;
                        const statusColors = { progress: '#3182F6', hold: '#F59E0B', complete: '#00C471' };
                        const statusLabels = { progress: '진행중', hold: '보류', complete: '완료' };
                        
                        return (
                          <div
                            key={project.id}
                            draggable={!isAdded}
                            onDragStart={(e) => {
                              if (isAdded) return;
                              setDraggedProject(project);
                              e.dataTransfer.effectAllowed = 'copy';
                            }}
                            onDragEnd={() => setDraggedProject(null)}
                            style={{
                              padding: '12px 14px', borderRadius: 10,
                              background: isAdded ? '#F7F8FA' : 'white',
                              border: `1px solid ${isAdded ? '#E5E8EB' : '#E5E8EB'}`,

                      onDragEnd={() => setDraggedProject(null)}
                      style={{

                    >
                      <span style={{ fontSize: 13, fontWeight: 700, color: '#6B7684' }}>그 외 업무</span>

                      {isOtherAdded && <span style={{ fontSize: 10, color: '#00C471', fontWeight: 600, marginLeft: 'auto' }}>✓ 추가됨</span>}

                    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>

              {myProjects.length === 0 && (

          {/* 오른쪽: 마인드맵 캔버스 */}

              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>

                </h1>

              </div>
              
              <div style={{ display: 'flex', gap: 8 }}>
                <button
                  onClick={syncWithProjects}
                  style={{

                >

                </button>
                <button
                  onClick={() => setShowAddBranch(true)}
                  style={{
                    display: 'flex', alignItems: 'center', gap: 6,
                    padding: '10px 16px', borderRadius: 8,

              </div>
            </div>
            
            {/* 캔버스 컨테이너 - 무한 캔버스 */}
            <div 
              ref={canvasRef}
              style={{ 
                flex: 1, 
                position: 'relative', 
                overflow: 'hidden',
                background: draggedProject ? '#F0F7FF' : '#FAFBFC',
                cursor: spacePressed ? (isPanning ? 'grabbing' : 'grab') : 'default',
                outline: 'none'
              }}
              onDragOver={(e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; }}
              onDrop={(e) => {
                e.preventDefault();
                if (!draggedProject) return;
                handleDropProject(draggedProject);
                setDraggedProject(null);
              }}
              onWheel={(e) => {
                e.preventDefault();
                if (e.ctrlKey || e.metaKey) {
                  // 줌 (마우스 위치 기준)
                  const rect = canvasRef.current.getBoundingClientRect();
                  const mouseX = e.clientX - rect.left;
                  const mouseY = e.clientY - rect.top;
                  
                  const delta = e.deltaY > 0 ? 0.9 : 1.1;
                  const newZoom = Math.min(3, Math.max(0.2, zoom * delta));
                  
                  // 마우스 위치 기준 줌
                  const zoomRatio = newZoom / zoom;
                  setOffset(prev => ({
                    x: mouseX - (mouseX - prev.x) * zoomRatio,
                    y: mouseY - (mouseY - prev.y) * zoomRatio
                  }));
                  setZoom(newZoom);
                } else {
                  // 일반 스크롤 = 패닝
                  setOffset(prev => ({
                    x: prev.x - e.deltaX,
                    y: prev.y - e.deltaY
                  }));
                }
              }}
              onMouseDown={(e) => {
                // 스페이스바 + 왼쪽 마우스 버튼으로 패닝
                if (e.button === 0 && spacePressed) {
                  e.preventDefault();
                  setIsPanning(true);
                  panStart.current = { 
                    x: e.clientX, 
                    y: e.clientY,
                    offsetX: offset.x,
                    offsetY: offset.y
                  };
                }
              }}
              onMouseMove={(e) => {
                if (isPanning) {
                  e.preventDefault();
                  const dx = e.clientX - panStart.current.x;
                  const dy = e.clientY - panStart.current.y;
                  setOffset({
                    x: panStart.current.offsetX + dx,
                    y: panStart.current.offsetY + dy
                  });
                }
              }}
              onMouseUp={() => setIsPanning(false)}
              onMouseLeave={() => setIsPanning(false)}
            >
              {/* 줌 컨트롤 */}
              <div style={{
                position: 'absolute', bottom: 20, right: 20, zIndex: 100,
                display: 'flex', alignItems: 'center', gap: 8,
                background: 'white', padding: '8px 12px', borderRadius: 8,
                boxShadow: '0 2px 8px rgba(0,0,0,0.1)', border: '1px solid #E5E8EB'
              }}>
                <button
                  onClick={() => setZoom(z => Math.max(0.2, z * 0.9))}
                  style={{ width: 28, height: 28, border: '1px solid #E5E8EB', borderRadius: 4, background: 'white', cursor: 'pointer', fontSize: 16 }}
                >−</button>
                <span style={{ fontSize: 12, color: '#6B7684', minWidth: 45, textAlign: 'center' }}>{Math.round(zoom * 100)}%</span>
                <button
                  onClick={() => setZoom(z => Math.min(3, z * 1.1))}
                  style={{ width: 28, height: 28, border: '1px solid #E5E8EB', borderRadius: 4, background: 'white', cursor: 'pointer', fontSize: 16 }}
                >+</button>
                <button
                  onClick={() => { setZoom(1); setOffset({ x: 0, y: 0 }); }}
                  style={{ padding: '4px 8px', border: '1px solid #E5E8EB', borderRadius: 4, background: 'white', cursor: 'pointer', fontSize: 11, color: '#6B7684' }}
                >리셋</button>
              </div>
              
              {/* 도움말 */}
              <div style={{
                position: 'absolute', bottom: 20, left: 20, zIndex: 100,
                fontSize: 11, color: '#8B95A1', background: 'rgba(255,255,255,0.9)', 
                padding: '6px 10px', borderRadius: 6
              }}>
                스페이스+드래그: 이동 | Ctrl+휠: 줌 | 휠: 스크롤
              </div>
              
              {/* 드래그 중 안내 */}
              {draggedProject && (
                <div style={{
                  position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%, -50%)',
                  background: 'white', padding: '20px 32px', borderRadius: 16,
                  boxShadow: '0 8px 32px rgba(0,0,0,0.15)', textAlign: 'center',
                  border: '2px dashed #3182F6', zIndex: 10
                }}>
                  <p style={{ fontSize: 16, fontWeight: 600, color: '#3182F6', marginBottom: 4 }}>
                    🎯 여기에 놓으세요!
                  </p>
                  <p style={{ fontSize: 13, color: '#6B7684' }}>
                    프로젝트 + 하위업무가 자동으로 추가됩니다
                  </p>
                </div>
              )}
              
              {/* 무한 캔버스 - transform으로 줌/패닝 */}
              <div 
                data-canvas="true"
                style={{
                  position: 'absolute',
                  left: 0,
                  top: 0,
                  transform: `translate(${offset.x}px, ${offset.y}px) scale(${zoom})`,
                  transformOrigin: '0 0'
                }}
              >
              
              {/* SVG 연결선 - EdrawMind 스타일 직각 */}
              <svg style={{ position: 'absolute', left: 0, top: 0, width: 3000, height: 2000, pointerEvents: 'none', overflow: 'visible', zIndex: 0 }}>
                {connections.map(conn => {
                  const fromNode = nodes.find(n => n.id === conn.from);
                  const toNode = nodes.find(n => n.id === conn.to);
                  if (!fromNode || !toNode) return null;
                  
                  // 실제 측정된 너비 사용 (없으면 기본값)
                  const getNodeWidth = (n) => {
                    if (nodeWidths[n.id]) {
                      return nodeWidths[n.id] / zoom; // zoom 보정
                    }
                    // 기본값 (측정 전)
                    return 100;
                  };
                  
                  const fromWidth = getNodeWidth(fromNode);
                  
                  // from 노드 오른쪽 끝
                  let fromX;
                  if (fromNode.type === 'center') {
                    fromX = fromNode.x + fromWidth / 2; // center는 중앙정렬
                  } else {
                    fromX = fromNode.x + fromWidth; // 나머지는 왼쪽정렬
                  }
                  
                  // to 노드 왼쪽 끝
                  const toX = toNode.x;
                  
                  const fromY = fromNode.y;
                  const toY = toNode.y;
                  
                  // 직각 연결선
                  const midX = fromX + 15;
                  const pathD = `M ${fromX} ${fromY} H ${midX} V ${toY} H ${toX}`;
                  
                  // 색상 - 모두 연한 회색
                  const lineColor = '#D1D6DB';
                  
                  return (
                    <path
                      key={conn.id}
                      d={pathD}
                      stroke={lineColor}
                      strokeWidth={1.5}
                      fill="none"
                    />
                  );
                })}
              </svg>
              
              {/* 노드들 */}
              {nodes.map(node => (
                <MindMapNode
                  key={node.id}
                  node={node}
                  isSelected={selectedNode === node.id}
                  isEditing={editingNode === node.id}
                  isDragOver={(dragOverNodeId === node.id && draggedProject) || (dropTargetNodeId === node.id)}
                  onClick={() => setSelectedNode(node.id === selectedNode ? null : node.id)}
                  onDoubleClick={() => setEditingNode(node.id)}
                  onDrag={handleNodeDrag}
                  onDragEnd={() => handleNodeDragEnd(node.id)}
                  onDelete={() => deleteNode(node.id)}
                  onUpdateText={(text) => updateNodeText(node.id, text)}
                  onUpdateKpi={(label, value) => updateNodeKpi(node.id, label, value)}
                  onCancelEdit={() => setEditingNode(null)}
                  onDragOver={() => setDragOverNodeId(node.id)}
                  onDragLeave={() => setDragOverNodeId(null)}
                  onDrop={() => {
                    if (draggedProject && node.type === 'branch' && !node.projectId) {
                      handleDropOnCategory(node.id, draggedProject);
                      setDraggedProject(null);
                      setDragOverNodeId(null);
                    }
                  }}
                  draggingNodeId={draggingNodeId}
                  onMeasure={(id, width) => {
                    setNodeWidths(prev => {
                      if (prev[id] !== width) {
                        return { ...prev, [id]: width };
                      }
                      return prev;
                    });
                  }}
                />
              ))}
              
              {/* 빈 상태 안내 */}
              {nodes.length <= 1 && (
                <div style={{ 
                  position: 'absolute', bottom: 40, left: '50%', transform: 'translateX(-50%)',
                  background: 'white', padding: '16px 24px', borderRadius: 12,
                  boxShadow: '0 4px 20px rgba(0,0,0,0.1)', textAlign: 'center'
                }}>
                  <p style={{ fontSize: 14, color: '#6B7684', marginBottom: 8 }}>
                    💡 <strong>카테고리 추가</strong> 버튼으로 가지를 만들고
                  </p>
                  <p style={{ fontSize: 14, color: '#6B7684' }}>
                    왼쪽 프로젝트를 <strong>드래그</strong>해서 가지에 놓아보세요!
                  </p>
                </div>
              )}
              </div> {/* 줌/패닝 내부 컨테이너 닫기 */}
            </div>
          </div>
          
          {/* 카테고리 추가 모달 */}
          {showAddBranch && (
            <div onClick={() => setShowAddBranch(false)} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.4)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000 }}>
              <div onClick={(e) => e.stopPropagation()} style={{ background: 'white', borderRadius: 16, padding: 24, width: 360 }}>
                <h3 style={{ fontSize: 18, fontWeight: 700, color: '#191F28', marginBottom: 20 }}>카테고리 추가</h3>
                <input
                  type="text"
                  value={newBranchName}
                  onChange={(e) => setNewBranchName(e.target.value)}
                  placeholder="예: 홈페이지 리뉴얼, 블로그 전략..."
                  style={{ width: '100%', padding: '12px 14px', borderRadius: 10, border: '1px solid #E5E8EB', fontSize: 14, marginBottom: 16 }}
                  autoFocus
                  onKeyDown={(e) => e.key === 'Enter' && addBranch()}
                />
                <div style={{ display: 'flex', gap: 12 }}>
                  <button onClick={() => setShowAddBranch(false)} style={{ flex: 1, padding: 12, borderRadius: 10, border: '1px solid #E5E8EB', background: 'white', fontSize: 14, fontWeight: 600, color: '#6B7684', cursor: 'pointer' }}>취소</button>
                  <button onClick={addBranch} style={{ flex: 1, padding: 12, borderRadius: 10, border: 'none', background: '#3182F6', fontSize: 14, fontWeight: 600, color: 'white', cursor: 'pointer' }}>추가</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }
    
    // 마인드맵 노드 컴포넌트
    function MindMapNode({ node, isSelected, isEditing, isDragOver, onClick, onDoubleClick, onDrag, onDragEnd, onDelete, onUpdateText, onUpdateKpi, onCancelEdit, onDragOver, onDragLeave, onDrop, draggingNodeId, onMeasure }) {
      const [isDragging, setIsDragging] = useState(false);
      const [editText, setEditText] = useState(node.text);
      const [editKpiLabel, setEditKpiLabel] = useState(node.kpiLabel || '');
      const [editKpiValue, setEditKpiValue] = useState(node.kpiValue || '');
      const dragStart = React.useRef({ x: 0, y: 0 });
      const nodeRef = React.useRef(null);
      
      // 노드 렌더링 후 실제 너비 측정
      React.useEffect(() => {
        if (nodeRef.current && onMeasure) {
          const rect = nodeRef.current.getBoundingClientRect();
          onMeasure(node.id, rect.width);
        }
      }, [node.text, node.id, isEditing]);
      
      const handleMouseDown = (e) => {
        if (isEditing || node.type === 'center') return; // other 노드도 드래그 가능
        e.preventDefault();
        setIsDragging(true);
        dragStart.current = { x: e.clientX, y: e.clientY };
        
        const handleMouseMove = (e) => {
          const dx = e.clientX - dragStart.current.x;
          const dy = e.clientY - dragStart.current.y;
          dragStart.current = { x: e.clientX, y: e.clientY };
          onDrag(node.id, dx, dy);
        };
        
        const handleMouseUp = (e) => {
          setIsDragging(false);
          onDragEnd();
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
        
        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseup', handleMouseUp);
      };
      
      const handleSave = () => {
        onUpdateText(editText);
        if (node.type === 'branch') {
          onUpdateKpi(editKpiLabel, editKpiValue);
        }
      };
      
      // 노드 스타일 - EdrawMind 스타일 각진 네모
      const getNodeStyle = () => {
        const base = {
          position: 'absolute',
          left: node.x,
          top: node.y,
          transform: 'translateY(-50%)', // 왼쪽 정렬, Y만 중앙
          cursor: isDragging ? 'grabbing' : (node.type === 'center' ? 'default' : 'grab'),
          transition: isDragging ? 'none' : 'box-shadow 0.2s',
          zIndex: isDragging ? 100 : 10, // 연결선 위에 표시
          boxSizing: 'border-box', // padding 포함한 너비 계산
        };
        
        if (node.type === 'center') {
          return {
            ...base,
            transform: 'translate(-50%, -50%)', // 센터만 중앙 정렬
            background: `linear-gradient(135deg, ${node.color}, ${node.color}dd)`,
            color: 'white',
            padding: '12px 20px',
            borderRadius: 8,
            fontSize: 15,
            fontWeight: 700,
            textAlign: 'center',
            boxShadow: isSelected ? `0 0 0 3px ${node.color}50, 0 6px 20px rgba(0,0,0,0.15)` : '0 4px 12px rgba(0,0,0,0.1)',
            whiteSpace: 'nowrap',
          };
        }
        
        if (node.type === 'branch') {
          return {
            ...base,
            background: isDragOver ? '#EBF4FF' : 'white',
            border: isDragOver ? '2px dashed #3182F6' : `1px solid ${isSelected ? '#191F28' : '#E5E8EB'}`,
            padding: '6px 12px',
            borderRadius: 4,
            fontSize: 14,
            fontWeight: 500,
            color: '#191F28',
            boxShadow: isSelected ? '0 2px 8px rgba(0,0,0,0.1)' : 'none',
            whiteSpace: 'nowrap',
          };
        }
        
        // brand - 브랜드 노드 스타일 (색상 유지)
        if (node.type === 'brand') {
          const brandColor = node.color || '#6B7684';
          return {
            ...base,
            background: `linear-gradient(135deg, ${brandColor}15, ${brandColor}08)`,
            border: `2px solid ${brandColor}`,
            padding: '8px 14px',
            borderRadius: 6,
            fontSize: 14,
            fontWeight: 700,
            color: brandColor,
            boxShadow: isSelected ? `0 0 0 3px ${brandColor}30, 0 4px 12px rgba(0,0,0,0.1)` : '0 2px 6px rgba(0,0,0,0.08)',
            whiteSpace: 'nowrap',
          };
        }
        
        // other - 그 외 업무 노드 스타일 (brand와 동일하게)
        if (node.type === 'other') {
          const brandColor = node.color || '#6B7684';
          return {
            ...base,
            background: `linear-gradient(135deg, ${brandColor}15, ${brandColor}08)`,
            border: `2px solid ${brandColor}`,
            padding: '8px 14px',
            borderRadius: 6,
            fontSize: 14,
            fontWeight: 700,
            color: brandColor,
            boxShadow: isSelected ? `0 0 0 3px ${brandColor}30, 0 4px 12px rgba(0,0,0,0.1)` : '0 2px 6px rgba(0,0,0,0.08)',
            whiteSpace: 'nowrap',
          };
        }
        
        // task - 통일된 스타일 (색상 없음)
        return {
          ...base,
          background: 'white',
          border: `1px solid ${isSelected ? '#191F28' : '#E5E8EB'}`,
          padding: '6px 12px',
          borderRadius: 4,
          fontSize: 14,
          fontWeight: 500,
          color: '#191F28',
          whiteSpace: 'nowrap',
          boxShadow: isSelected ? '0 2px 8px rgba(0,0,0,0.1)' : 'none',
        };
      };
      
      return (
        <div
          ref={nodeRef}
          style={getNodeStyle()}
          onMouseDown={handleMouseDown}
          onClick={onClick}
          onDoubleClick={onDoubleClick}
          onDragOver={(e) => { if (node.type === 'branch' && !node.projectId) { e.preventDefault(); onDragOver && onDragOver(); } }}
          onDragLeave={() => onDragLeave && onDragLeave()}
          onDrop={(e) => { e.preventDefault(); onDrop && onDrop(); }}
        >
          {isEditing ? (
            <div onClick={(e) => e.stopPropagation()}>
              <input
                type="text"
                value={editText}
                onChange={(e) => setEditText(e.target.value)}
                style={{ width: '100%', padding: 8, borderRadius: 6, border: '1px solid #3182F6', fontSize: 13, marginBottom: 8 }}
                autoFocus
              />
              {node.type === 'branch' && (
                <div style={{ display: 'flex', gap: 6, marginBottom: 8 }}>
                  <input
                    placeholder="KPI 라벨"
                    value={editKpiLabel}
                    onChange={(e) => setEditKpiLabel(e.target.value)}
                    style={{ flex: 1, padding: 6, borderRadius: 6, border: '1px solid #E5E8EB', fontSize: 11 }}
                  />
                  <input
                    placeholder="목표값"
                    value={editKpiValue}
                    onChange={(e) => setEditKpiValue(e.target.value)}
                    style={{ width: 60, padding: 6, borderRadius: 6, border: '1px solid #E5E8EB', fontSize: 11 }}
                  />
                </div>
              )}
              <div style={{ display: 'flex', gap: 6 }}>
                <button onClick={onCancelEdit} style={{ flex: 1, padding: 6, borderRadius: 6, border: '1px solid #E5E8EB', background: 'white', fontSize: 11, cursor: 'pointer' }}>취소</button>
                <button onClick={handleSave} style={{ flex: 1, padding: 6, borderRadius: 6, border: 'none', background: '#3182F6', color: 'white', fontSize: 11, cursor: 'pointer' }}>저장</button>
              </div>
            </div>
          ) : (
            <>
              <div>{node.text}</div>
              {node.type === 'branch' && node.kpiLabel && (
                <div style={{ marginTop: 8, padding: '6px 10px', background: '#F0FDF4', borderRadius: 6, fontSize: 11, color: '#059669' }}>
                  📊 {node.kpiLabel}: {node.kpiValue}
                </div>
              )}
              {isDragOver && node.type !== 'task' && (
                <div style={{ marginTop: 8, fontSize: 11, color: '#3182F6', fontWeight: 600 }}>
                  🔗 여기에 놓으세요!
                </div>
              )}
            </>
          )}
          
          {/* 삭제 버튼 */}
          {isSelected && node.type !== 'center' && !isEditing && (
            <button
              onClick={(e) => { e.stopPropagation(); onDelete(); }}
              style={{
                position: 'absolute', top: -8, right: -8,
                width: 22, height: 22, borderRadius: '50%',
                background: '#F04452', border: 'none',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                cursor: 'pointer', boxShadow: '0 2px 6px rgba(0,0,0,0.2)'
              }}
            >
              <Icon name="x" size={12} color="white" />
            </button>
          )}
        </div>
      );
    }

    // 렌더링
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TeamWorkApp />);
  </script>
</body>
</html>
