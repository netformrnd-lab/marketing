                                  <span style={{ fontSize: 12, color: '#3182F6' }}>{isExpanded ? '접기 ▲' : '펼치기 ▼'}</span>
                                </div>
                                <div style={{ fontSize: 13, color: '#6B7684', lineHeight: 1.6, whiteSpace: 'pre-wrap', maxHeight: isExpanded ? 'none' : 60, overflow: 'hidden', position: 'relative' }}>
                                  {isExpanded ? meeting.content : contentPreview + (meeting.content.length > 100 ? '...' : '')}
                                </div>
                              </div>
                            )}
                            
                            {/* 액션 아이템 */}
                            {actionItems.length > 0 && (
                              <div style={{ padding: 16, background: '#F7F8FA', borderTop: '1px solid #E5E8EB' }}>
                                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
                                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                                    <span style={{ fontSize: 13, fontWeight: 600, color: '#4E5968' }}>📌 액션 아이템 ({actionItems.length})</span>
                                    <span style={{ fontSize: 12, color: '#8B95A1' }}>완료 {doneCount}/{actionItems.length}</span>
                                  </div>
                                  {unlinkedCount > 0 && (
                                    <button
                                      onClick={(e) => { e.stopPropagation(); convertAllToTasks(meeting); }}
                                      style={{ display: 'flex', alignItems: 'center', gap: 4, padding: '6px 12px', borderRadius: 6, border: '1px solid #3182F6', background: '#EBF4FF', color: '#3182F6', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}
                                    >
                                      전체 하위업무로 추가 ({unlinkedCount})
                                    </button>
                                  )}
                                </div>
                                <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                                  {actionItems.map(ai => {
                                    const assignee = TEAM_MEMBERS.find(m => m.id === ai.assignee);
                                    const isDone = ai.status === 'done';
                                    // 실제로 하위업무가 존재하는지 확인
                                    const linkedTask = ai.linkedTaskId ? tasks.find(t => t.id === ai.linkedTaskId) : null;
                                    const isLinked = !!linkedTask;
                                    
                                    // 연동 해제 함수
                                    const unlinkTask = () => {
                                      const updatedMeeting = {
                                        ...meeting,
                                        actionItems: meeting.actionItems.map(item => 
                                          item.id === ai.id ? { ...item, linkedTaskId: null } : item
                                        )
                                      };
                                      onUpdateMeeting(updatedMeeting);
                                      setToastMessage('🔓 연동이 해제되었습니다');
                                    };
                                    
                                    return (
                                      <div key={ai.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', background: 'white', borderRadius: 8, border: '1px solid #E5E8EB' }}>
                                        <span style={{ color: isDone ? '#00C471' : '#D1D6DB', fontSize: 16 }}>{isDone ? '✅' : '☐'}</span>
                                        <div style={{ flex: 1 }}>
                                          <span style={{ fontSize: 14, color: isDone ? '#8B95A1' : '#191F28', textDecoration: isDone ? 'line-through' : 'none' }}>{ai.title}</span>
                                          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 4 }}>
                                            {assignee && (
                                              <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                                                <div style={{ width: 16, height: 16, borderRadius: '50%', background: assignee.color, color: 'white', fontSize: 8, fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                                                  {assignee.initial}
                                                </div>
                                                <span style={{ fontSize: 11, color: '#8B95A1' }}>{assignee.name}</span>
                                              </div>
                                            )}
                                            {ai.dueDate && (
                                              <span style={{ fontSize: 11, color: '#8B95A1' }}>📅 {new Date(ai.dueDate).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' })}까지</span>
                                            )}
                                          </div>
                                        </div>
                                        {isLinked ? (
                                          <button
                                            onClick={(e) => { e.stopPropagation(); unlinkTask(); }}
                                            style={{ display: 'flex', alignItems: 'center', gap: 4, padding: '4px 8px', borderRadius: 4, background: '#D1FAE5', color: '#059669', fontSize: 11, fontWeight: 600, border: 'none', cursor: 'pointer' }}
                                            title="클릭하여 연동 해제"
                                          >
                                            🔗 연동됨
                                          </button>
                                        ) : (
                                          <button
                                            onClick={(e) => { e.stopPropagation(); convertToTask(meeting, ai); }}
                                            style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', width: 32, height: 32, borderRadius: 6, border: '1px solid #3182F6', background: '#EBF4FF', color: '#3182F6', fontSize: 16, cursor: 'pointer' }}
                                            title="하위업무로 추가"
                                          >
                                            ➕
                                          </button>
                                        )}
                                      </div>
                                    );
                                  })}
                                </div>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}
            </div>

            {activeTab === 'comments' && (
              <div style={{ padding: 16, borderTop: '1px solid #E5E8EB' }}>
                {/* 첨부 파일 미리보기 */}
                {attachedFile && (
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12, padding: '8px 12px', background: '#F0F7FF', borderRadius: 8 }}>
                    <Icon name="fileText" size={16} color="#3182F6" />
                    <span style={{ flex: 1, fontSize: 13, color: '#3182F6', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{attachedFile.name}</span>
                    <button onClick={() => setAttachedFile(null)} style={{ width: 20, height: 20, borderRadius: 4, border: 'none', background: '#E5E8EB', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}><Icon name="x" size={12} color="#6B7684" /></button>
                  </div>
                )}
                <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                  <div style={{ width: 36, height: 36, borderRadius: '50%', background: currentUser.color, color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, fontWeight: 700 }}>{currentUser.initial}</div>
                  <div style={{ flex: 1, display: 'flex', alignItems: 'flex-end', background: '#F7F8FA', borderRadius: 12, padding: '4px 4px 4px 16px' }}>
                    <textarea 
                      value={comment} 
                      onChange={(e) => setComment(e.target.value)} 
                      onKeyDown={(e) => { 
                        if (e.key === 'Enter' && !e.shiftKey && (comment.trim() || attachedFile)) { 
                          e.preventDefault();
                          handleSubmitComment(); 
                        } 
                      }} 
                      placeholder="댓글을 입력하세요... (Shift+Enter: 줄바꿈)" 
                      rows={1}
                      style={{ 
                        flex: 1, 
                        border: 'none', 
                        background: 'transparent', 
                        fontSize: 14, 
                        padding: '10px 0', 
                        resize: 'none',
                        minHeight: 40,
                        maxHeight: 120,
                        lineHeight: 1.4,
                        fontFamily: 'inherit'
                      }} 
                      onInput={(e) => {
                        e.target.style.height = 'auto';
                        e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
                      }}
                    />
                    <input type="file" ref={fileInputRef} onChange={handleFileSelect} style={{ display: 'none' }} />
                    <button onClick={() => fileInputRef.current?.click()} style={{ width: 36, height: 36, borderRadius: 8, border: 'none', background: 'transparent', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}><Icon name="paperclip" size={18} color="#8B95A1" /></button>
                    <button onClick={handleSubmitComment} disabled={!comment.trim() && !attachedFile} style={{ width: 36, height: 36, borderRadius: 8, border: 'none', background: (comment.trim() || attachedFile) ? '#3182F6' : '#E5E8EB', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icon name="send" size={16} color={(comment.trim() || attachedFile) ? 'white' : '#8B95A1'} /></button>
                  </div>
                </div>
              </div>
            )}

            {/* 하위업무 상세 보기 모달 - 인라인 편집 가능 */}
            {selectedSubTask && (
              <SubTaskDetailModal 
                task={selectedSubTask}
                brand={brand}
                project={project}
                onClose={() => setSelectedSubTask(null)}
                onToggle={() => { onToggleTask(selectedSubTask.id); setSelectedSubTask(prev => ({ ...prev, completed: !prev.completed })); }}
                onSave={(updated) => { onUpdateTask(updated); setSelectedSubTask(updated); }}
                onDelete={() => { onDeleteTask(selectedSubTask); setSelectedSubTask(null); }}
                onEdit={() => { setEditingTaskId(selectedSubTask.id); setSelectedSubTask(null); }}
              />
            )}

            {showAddTask && <SubTaskModal parentTaskId={addingSubtaskParentId} currentUser={currentUser} onSave={(t) => { onAddTask({ ...t, parentTaskId: addingSubtaskParentId }); setShowAddTask(false); setAddingSubtaskParentId(null); }} onClose={() => { setShowAddTask(false); setAddingSubtaskParentId(null); }} />}
            
            {/* 하위업무 수정 모달 */}
            {editingTaskId && <SubTaskModal task={sorted.find(t => t.id === editingTaskId)} currentUser={currentUser} onSave={(t) => { onUpdateTask(t); setEditingTaskId(null); }} onClose={() => setEditingTaskId(null)} />}
            
            {/* 프로젝트 수정 모달 */}
            {showEditProject && <ProjectModal project={project} currentUser={currentUser} onSave={(p) => { onUpdateProject(p); setShowEditProject(false); }} onClose={() => setShowEditProject(false)} projectTemplates={projectTemplates} />}
            
            {/* 회의록 추가 모달 */}
            {showMeetingModal && (
              <MeetingModal
                projects={projects}
                currentUser={currentUser}
                defaultProject={project}
                onSave={(newMeeting) => {
                  const meetingWithId = {
                    ...newMeeting,
                    id: `meeting_${Date.now()}`,
                    createdBy: currentUser.id,
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                  };
                  onAddMeeting(meetingWithId);
                  setShowMeetingModal(false);
                  setToastMessage('✅ 회의록이 추가되었습니다');
                }}
                onClose={() => setShowMeetingModal(false)}
              />
            )}
            
            {/* 회의록 수정 모달 */}
            {editingMeeting && (
              <MeetingModal
                meeting={editingMeeting}
                projects={projects}
                currentUser={currentUser}
                onSave={(updatedMeeting) => {
                  const meetingWithUpdate = {
                    ...editingMeeting,
                    ...updatedMeeting,
                    updatedAt: new Date().toISOString()
                  };
                  onUpdateMeeting(meetingWithUpdate);
                  setEditingMeeting(null);
                  setToastMessage('✅ 회의록이 수정되었습니다');
                }}
                onClose={() => setEditingMeeting(null)}
              />
            )}
            
          </div>
        </div>
      );
    }

    // 하위업무 상세 모달 (인라인 편집 가능)
    function SubTaskDetailModal({ task, brand, project, onClose, onToggle, onSave, onDelete, onEdit }) {
      // ESC 키는 부모 컴포넌트(ProjectDetailSlide)에서 처리
      const [title, setTitle] = useState(task.title || '');
      const [note, setNote] = useState(task.note || '');
      const [attachments, setAttachments] = useState(task.attachments || []);
      const [hasChanges, setHasChanges] = useState(false);
      const [isUploading, setIsUploading] = useState(false);
      const fileInputRef = React.useRef(null);
      const m = TEAM_MEMBERS.find(x => x.id === task.memberId);
      
      const handleTitleChange = (e) => {
        setTitle(e.target.value);
        setHasChanges(true);
      };
      
      const handleNoteChange = (e) => {
        setNote(e.target.value);
        setHasChanges(true);
      };
      
      const handleFileSelect = async (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;
        
        setIsUploading(true);
        
        for (const file of files) {
          try {
            // Firebase Storage에 업로드
            const path = `attachments/tasks/${task.id}/${Date.now()}_${file.name}`;
            const result = await FirebaseService.uploadFile(file, path);
            
            if (result) {
              setAttachments(prev => [...prev, {
                id: Date.now() + Math.random(),
                name: result.name,
                size: result.size,
                type: result.type,
                url: result.url,
                path: path
              }]);
              setHasChanges(true);
            }
          } catch (error) {
            console.error('File upload error:', error);
            alert('파일 업로드에 실패했습니다.');
          }
        }
        
        setIsUploading(false);
        e.target.value = '';
      };
      
      const removeAttachment = async (attachment) => {
        // Firebase Storage에서 파일 삭제
        if (attachment.path) {
          await FirebaseService.deleteFile(attachment.path);
        }
        setAttachments(prev => prev.filter(a => a.id !== attachment.id));
        setHasChanges(true);
      };
      
      const handleSave = () => {
        onSave({ ...task, title, note, attachments });
        setHasChanges(false);
      };
      
      return (
        <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.4)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1100 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: 'white', borderRadius: 20, padding: 24, width: '100%', maxWidth: 480, maxHeight: '85vh', overflow: 'auto' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 20 }}>
              <h2 style={{ fontSize: 18, fontWeight: 700, color: '#191F28' }}>📋 하위업무 상세</h2>
              <button onClick={onClose} style={{ width: 32, height: 32, borderRadius: 8, border: 'none', background: '#F7F8FA', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}><Icon name="x" size={18} color="#8B95A1" /></button>
            </div>
            
            {/* 업로드 중 표시 */}
            {isUploading && (
              <div style={{ position: 'absolute', inset: 0, background: 'rgba(255,255,255,0.8)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 10, borderRadius: 20 }}>
                <div style={{ textAlign: 'center' }}>
                  <div className="loading-spinner" style={{ margin: '0 auto 12px' }}></div>
                  <p style={{ fontSize: 14, color: '#6B7684' }}>파일 업로드 중...</p>
                </div>
              </div>
            )}
            
            {/* 업무 정보 */}
            <div style={{ background: '#F7F8FA', borderRadius: 12, padding: 16, marginBottom: 16 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}>
                <span style={{ padding: '4px 10px', borderRadius: 6, background: `${brand.color}15`, color: brand.color, fontSize: 12, fontWeight: 600 }}>{brand.name}</span>
                <span style={{ padding: '4px 10px', borderRadius: 6, background: '#E5E8EB', color: '#6B7684', fontSize: 11, fontWeight: 600 }}>{project.title}</span>
              </div>
              <input 
                type="text"
                value={title}
                onChange={handleTitleChange}
                placeholder="업무명을 입력하세요"
                style={{ 
                  width: '100%', 
                  fontSize: 18, 
                  fontWeight: 700, 
                  color: '#191F28', 
                  marginBottom: 8, 
                  textDecoration: task.completed ? 'line-through' : 'none',
                  border: 'none',
                  background: 'transparent',
                  padding: '4px 0',
                  borderBottom: '2px solid transparent',
                  outline: 'none',
                  transition: 'border-color 0.2s'
                }}
                onFocus={(e) => e.target.style.borderBottomColor = '#3182F6'}
                onBlur={(e) => e.target.style.borderBottomColor = 'transparent'}
              />
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <p style={{ fontSize: 14, color: '#6B7684' }}>📅 {formatShortDate(task.date)}</p>
                {m && <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}><div style={{ width: 20, height: 20, borderRadius: '50%', background: m.color, color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 9, fontWeight: 700 }}>{m.initial}</div><span style={{ fontSize: 12, color: '#6B7684' }}>{m.name}</span></div>}
              </div>
            </div>
            
            {/* 메모 영역 - 편집 가능 */}
            <div style={{ marginBottom: 16 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 8 }}>
                <Icon name="fileText" size={16} color="#F59E0B" />
                <span style={{ fontSize: 13, fontWeight: 600, color: '#92400E' }}>메모</span>
              </div>
              <textarea 
                value={note} 
                onChange={handleNoteChange}
                placeholder="메모를 입력하세요..."
                rows={4}
                style={{ width: '100%', padding: '14px 16px', borderRadius: 12, border: '1px solid #E5E8EB', fontSize: 14, resize: 'none', lineHeight: 1.6, background: '#FFFBEB' }}
              />
            </div>
            
            {/* 첨부파일 영역 - 추가/삭제 가능 */}
            <div style={{ marginBottom: 16 }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                  <Icon name="paperclip" size={16} color="#3182F6" />
                  <span style={{ fontSize: 13, fontWeight: 600, color: '#1E40AF' }}>첨부파일 {attachments.length > 0 && `(${attachments.length})`}</span>
                </div>
                <button onClick={() => fileInputRef.current?.click()} style={{ display: 'flex', alignItems: 'center', gap: 4, padding: '6px 12px', borderRadius: 6, border: 'none', background: '#EBF4FF', color: '#3182F6', fontSize: 12, fontWeight: 500, cursor: 'pointer' }}>
                  <Icon name="plus" size={14} color="#3182F6" /> 파일 추가
                </button>
                <input ref={fileInputRef} type="file" multiple onChange={handleFileSelect} style={{ display: 'none' }} />
              </div>
              
              {attachments.length === 0 ? (
                <div onClick={() => fileInputRef.current?.click()} style={{ padding: 20, borderRadius: 12, background: '#F0F7FF', border: '2px dashed #DBEAFE', textAlign: 'center', cursor: 'pointer' }}>
                  <Icon name="paperclip" size={24} color="#93C5FD" />
                  <p style={{ fontSize: 13, color: '#6B7684', marginTop: 8 }}>클릭하여 파일을 첨부하세요</p>
                </div>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8, background: '#F0F7FF', borderRadius: 12, padding: 12, border: '1px solid #DBEAFE' }}>
                  {attachments.map(file => (
                    <div key={file.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', borderRadius: 8, background: 'white', border: '1px solid #E5E8EB' }}>
                      <Icon name="fileText" size={18} color="#3182F6" />
                      {file.url ? (
                        <a href={file.url} target="_blank" rel="noopener noreferrer" style={{ flex: 1, fontSize: 13, color: '#3182F6', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', textDecoration: 'none' }}>{file.name}</a>
                      ) : (
                        <span style={{ flex: 1, fontSize: 13, color: '#191F28', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{file.name}</span>
                      )}
                      <span style={{ fontSize: 11, color: '#8B95A1' }}>{(file.size / 1024).toFixed(1)}KB</span>
                      <button onClick={() => removeAttachment(file)} style={{ width: 24, height: 24, borderRadius: 6, border: 'none', background: '#FEE4E2', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}>
                        <Icon name="x" size={14} color="#F04452" />
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </div>
            
            {/* 저장 버튼 (변경사항 있을 때만 활성화) */}
            {hasChanges && (
              <button onClick={handleSave} style={{ width: '100%', padding: 14, marginBottom: 12, borderRadius: 12, border: 'none', background: '#00C471', color: 'white', fontSize: 15, fontWeight: 600, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, cursor: 'pointer' }}>
                <Icon name="check" size={18} color="white" /> 변경사항 저장
              </button>
            )}
            
            {/* 버튼 영역 */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              <button onClick={onToggle} style={{ width: '100%', padding: 14, borderRadius: 12, border: 'none', background: task.completed ? '#F7F8FA' : '#3182F6', color: task.completed ? '#6B7684' : 'white', fontSize: 15, fontWeight: 600, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, cursor: 'pointer' }}>
                <Icon name="check" size={18} color={task.completed ? '#6B7684' : 'white'} /> {task.completed ? '완료 취소' : '완료 처리'}
              </button>
              
              <div style={{ display: 'flex', gap: 8 }}>
                <button onClick={onEdit} style={{ flex: 1, padding: 14, borderRadius: 12, border: '1px solid #E5E8EB', background: 'white', color: '#191F28', fontSize: 15, fontWeight: 600, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, cursor: 'pointer' }}>
                  <Icon name="edit" size={18} color="#6B7684" /> 상세 수정
                </button>
                <button onClick={onDelete} style={{ flex: 1, padding: 14, borderRadius: 12, border: 'none', background: '#FEE4E2', color: '#F04452', fontSize: 15, fontWeight: 600, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, cursor: 'pointer' }}>
                  <Icon name="trash" size={18} color="#F04452" /> 삭제
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function SubTaskModal({ task, parentTaskId, currentUser, onSave, onClose }) {
      // ESC 키는 부모 컴포넌트(ProjectDetailSlide)에서 처리
      const isTeamLeader = currentUser?.role === '팀장';
      const [form, setForm] = useState({ 
        title: task?.title || '', 
        memberId: task?.memberId || (isTeamLeader ? null : currentUser?.id), 
        date: task?.date || today,
        note: task?.note || '',
        attachments: task?.attachments || []
      });
      const [pendingFiles, setPendingFiles] = useState([]); // 업로드 대기 중인 파일들
      const [isUploading, setIsUploading] = useState(false);
      const fileInputRef = React.useRef(null);
      const isEdit = !!task;
      const isSubtask = !!parentTaskId;
      
      const handleFileSelect = (e) => {
        const files = Array.from(e.target.files);
        // 파일 정보를 임시로 저장 (실제 업로드는 저장 시 진행)
        const newAttachments = files.map(f => ({
          id: Date.now() + Math.random(),
          name: f.name,
          size: f.size,
          type: f.type,
          file: f  // 실제 파일 객체 보관
        }));
        setForm(prev => ({ ...prev, attachments: [...prev.attachments, ...newAttachments] }));
        setPendingFiles(prev => [...prev, ...files]);
        e.target.value = '';
      };

            try {
              const path = `attachments/subtasks/${taskId}/${Date.now()}_${att.file.name}`;

              if (result) {
                uploadedAttachments.push({
                  id: att.id,
                  name: result.name,
                  size: result.size,
                  type: result.type,
                  url: result.url,
                  path: path
                });
              }
            } catch (error) {
              console.error('Upload error:', error);
            }

            // 기존 파일 - 그대로 유지

          }

    // ============ 전체업무 탭 ============
    function CalendarTab({ tasks, setTasks, projects, currentUser }) {
      const [viewMode, setViewMode] = useState('list'); // 'calendar' or 'list'
      const [currentMonth, setCurrentMonth] = useState({ year: new Date().getFullYear(), month: new Date().getMonth() });
      const [selectedTask, setSelectedTask] = useState(null);
      const [editingTask, setEditingTask] = useState(null);
      const [showEditModal, setShowEditModal] = useState(false);
      
      // 삭제 확인 모달 상태
      const [confirmDelete, setConfirmDelete] = useState(null);
      
      // ESC 키로 모달 닫기
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            if (confirmDelete) setConfirmDelete(null);
            else if (showEditModal) { setShowEditModal(false); setEditingTask(null); }
            else if (selectedTask) setSelectedTask(null);
          }
        };
        document.addEventListener('keydown', handleKeyDown);
        return () => document.removeEventListener('keydown', handleKeyDown);
      }, [confirmDelete, showEditModal, selectedTask]);
      
      // 리스트 뷰 필터 상태
      const [searchQuery, setSearchQuery] = useState('');
      const [dateRange, setDateRange] = useState({ start: '', end: '' });
      const [filterProject, setFilterProject] = useState(null);
      const [filterStatus, setFilterStatus] = useState('all'); // 'all', 'completed', 'incomplete'
      
      // 팀원 필터 (팀장만 사용 가능, 기본값: 내 업무만)
      const [selectedMembers, setSelectedMembers] = useState([currentUser.id]);
      
      // 팀원 필터 토글 (팀장만 사용)
      const toggleMember = (memberId) => {
        if (currentUser.role !== '팀장') return;
        setSelectedMembers(prev => {
          if (prev.includes(memberId)) {
            if (prev.length === 1) return prev;
            return prev.filter(id => id !== memberId);
          }
          return [...prev, memberId];
        });
      };
      
      // 전체 선택/해제 (팀장만 사용)
      const toggleAllMembers = () => {
        if (currentUser.role !== '팀장') return;
        if (selectedMembers.length === TEAM_MEMBERS.length) {
          setSelectedMembers([currentUser.id]);
        } else {
          setSelectedMembers(TEAM_MEMBERS.map(m => m.id));
        }
      };
      
      // 선택된 팀원의 업무만 필터링 (팀장이 아니면 자기 업무만)
      const memberTasks = useMemo(() => {
        if (currentUser.role !== '팀장') {
          return tasks.filter(t => t.memberId === currentUser.id);
        }
        return tasks.filter(t => selectedMembers.includes(t.memberId));
      }, [tasks, selectedMembers, currentUser]);

      const monthDates = useMemo(() => getMonthDates(currentMonth.year, currentMonth.month), [currentMonth]);
      const tasksByDate = useMemo(() => { const g = {}; memberTasks.forEach(t => { if (!g[t.date]) g[t.date] = []; g[t.date].push(t); }); return g; }, [memberTasks]);
      const stats = useMemo(() => { const tm = memberTasks.filter(t => { const d = new Date(t.date); return d.getFullYear() === currentMonth.year && d.getMonth() === currentMonth.month; }); return { total: tm.length, completed: tm.filter(t => t.completed).length }; }, [memberTasks, currentMonth]);
      
      // 리스트 뷰용 필터링된 업무
      const filteredTasks = useMemo(() => {
        return memberTasks
          .filter(t => !searchQuery || t.title.toLowerCase().includes(searchQuery.toLowerCase()) || (t.note && t.note.toLowerCase().includes(searchQuery.toLowerCase())))
          .filter(t => !dateRange.start || t.date >= dateRange.start)
          .filter(t => !dateRange.end || t.date <= dateRange.end)
          .filter(t => filterProject === null || t.projectId === filterProject || (filterProject === 0 && !t.projectId))
          .filter(t => filterStatus === 'all' || (filterStatus === 'completed' && t.completed) || (filterStatus === 'incomplete' && !t.completed))
          .sort((a, b) => b.date.localeCompare(a.date));
      }, [memberTasks, searchQuery, dateRange, filterProject, filterStatus]);
      
      // 부모 업무만 (서브태스크 제외)
      const parentTasks = useMemo(() => {
        return filteredTasks.filter(t => !t.parentTaskId);
      }, [filteredTasks]);
      
      // 서브태스크 가져오기 (부모와 함께 표시하기 위해 memberTasks에서 가져옴)
      const getSubtasks = (parentId) => {
        return memberTasks.filter(t => t.parentTaskId === parentId);
      };

      const moveMonth = (dir) => setCurrentMonth(prev => { let m = prev.month + (dir === 'prev' ? -1 : 1), y = prev.year; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } return { year: y, month: m }; });
      const toggleTaskComplete = (id) => { 
        setTasks(prev => {
          const task = prev.find(t => t.id === id);
          if (!task) return prev;
          
          const newCompleted = !task.completed;
          
          // 하위업무인 경우
          if (!task.parentTaskId) {
            const subtasks = prev.filter(t => t.parentTaskId === id);
            if (subtasks.length > 0) {
              return prev.map(t => {
                if (t.id === id) return { ...t, completed: newCompleted };
                if (t.parentTaskId === id) return { ...t, completed: newCompleted };
                return t;
              });
            }
          }
          
          // 서브태스크인 경우
          if (task.parentTaskId) {
            const updated = prev.map(t => t.id === id ? { ...t, completed: newCompleted } : t);
            const siblings = updated.filter(t => t.parentTaskId === task.parentTaskId);
            const allCompleted = siblings.every(t => t.completed);
            return updated.map(t => t.id === task.parentTaskId ? { ...t, completed: allCompleted } : t);
          }
          
          return prev.map(t => t.id === id ? { ...t, completed: newCompleted } : t);
        }); 
        if (selectedTask?.id === id) setSelectedTask(prev => ({ ...prev, completed: !prev.completed })); 
      };

      const deleteTask = (id) => {

          (t.id === id || t.parentTaskId === id) ? { ...t, deletedAt: Date.now() } : t
        )); 
        setSelectedTask(null); 
      };

              updated = updated.map(t => t.id === st.id ? { ...t, title: st.title } : t);
            });
          }

              parentTaskId: task.id,
              title: st.title,
              projectId: task.projectId,
              date: task.date,
              memberId: currentUser.id,
              order: idx,
              completed: false,
              bookmark: false,
              note: ''
            }));
            updated = [...updated, ...newSubtasksToAdd];
          }
          
          return updated;
        });

    // ============ 휴지통 탭 ============
    function TrashTab({ tasks, setTasks, projects, setProjects, fixedTasks, setFixedTasks, currentUser }) {
      const [confirmAction, setConfirmAction] = useState(null); // { type: 'restore' | 'delete' | 'empty', item?, itemType? }
      
      // ESC 키로 모달 닫기
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape' && confirmAction) {
            setConfirmAction(null);
          }
        };
        document.addEventListener('keydown', handleKeyDown);
        return () => document.removeEventListener('keydown', handleKeyDown);
      }, [confirmAction]);
      
      // 삭제된 항목들
      const trashedTasks = tasks.filter(t => t.deletedAt && !t.parentTaskId && t.memberId === currentUser.id);
      const trashedProjects = projects.filter(p => p.deletedAt);
      const trashedFixedTasks = fixedTasks.filter(t => t.deletedAt && t.memberId === currentUser.id);
      
      // 남은 일수 계산
      const getDaysLeft = (deletedAt) => {
        const days = Math.ceil((deletedAt + 7 * 24 * 60 * 60 * 1000 - Date.now()) / (24 * 60 * 60 * 1000));
        return Math.max(0, days);
      };
      
      // 복원
      const restoreTask = (id) => {
        setTasks(prev => prev.map(t => 
          (t.id === id || t.parentTaskId === id) ? { ...t, deletedAt: undefined } : t
        ));
      };
      
      const restoreProject = (id) => {
        setProjects(prev => prev.map(p => p.id === id ? { ...p, deletedAt: undefined } : p));
        setTasks(prev => prev.map(t => t.projectId === id ? { ...t, deletedAt: undefined } : t));
      };
      
      const restoreFixedTask = (id) => {
        setFixedTasks(prev => prev.map(t => t.id === id ? { ...t, deletedAt: undefined } : t));
      };
      
      // 영구 삭제
      const permanentDeleteTask = (id) => {
        setTasks(prev => prev.filter(t => t.id !== id && t.parentTaskId !== id));
      };
      
      const permanentDeleteProject = (id) => {
        setProjects(prev => prev.filter(p => p.id !== id));
        setTasks(prev => prev.filter(t => t.projectId !== id));
      };
      
      const permanentDeleteFixedTask = (id) => {
        setFixedTasks(prev => prev.filter(t => t.id !== id));
      };
      
      // 휴지통 비우기
      const emptyTrash = () => {
        setTasks(prev => prev.filter(t => !t.deletedAt));
        setProjects(prev => prev.filter(p => !p.deletedAt));
        setFixedTasks(prev => prev.filter(t => !t.deletedAt));
      };
      
      // 확인 처리
      const handleConfirm = () => {
        if (!confirmAction) return;
        
        if (confirmAction.type === 'restore') {
          if (confirmAction.itemType === 'task') restoreTask(confirmAction.item.id);
          else if (confirmAction.itemType === 'project') restoreProject(confirmAction.item.id);
          else if (confirmAction.itemType === 'fixedTask') restoreFixedTask(confirmAction.item.id);
        } else if (confirmAction.type === 'delete') {
          if (confirmAction.itemType === 'task') permanentDeleteTask(confirmAction.item.id);
          else if (confirmAction.itemType === 'project') permanentDeleteProject(confirmAction.item.id);
          else if (confirmAction.itemType === 'fixedTask') permanentDeleteFixedTask(confirmAction.item.id);
        } else if (confirmAction.type === 'empty') {
          emptyTrash();
        }
        
        setConfirmAction(null);
      };
      
      const totalCount = trashedTasks.length + trashedProjects.length + trashedFixedTasks.length;
      
      return (
        <div style={{ minHeight: '100vh', background: '#F7F8FA' }}>
          <header style={{ background: 'white', borderBottom: '1px solid #E5E8EB', padding: '20px 32px' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <h1 style={{ fontSize: 24, fontWeight: 700, color: '#191F28' }}>🗑️ 휴지통</h1>
                <span style={{ fontSize: 14, color: '#6B7684', background: '#F7F8FA', padding: '4px 12px', borderRadius: 20 }}>
                  {totalCount}개 항목
                </span>
              </div>
              {totalCount > 0 && (
                <button 
                  onClick={() => setConfirmAction({ type: 'empty' })}
                  style={{ 
                    display: 'flex', alignItems: 'center', gap: 6,
                    padding: '10px 16px', borderRadius: 10,
                    border: 'none', background: '#F04452', color: 'white',
                    fontSize: 14, fontWeight: 600, cursor: 'pointer'
                  }}
                >
                  <Icon name="trash" size={16} color="white" /> 휴지통 비우기
                </button>
              )}
            </div>
            <p style={{ fontSize: 13, color: '#8B95A1', marginTop: 8 }}>
              삭제된 항목은 7일 후 자동으로 영구 삭제됩니다
            </p>
          </header>
          
          <div style={{ padding: 24, maxWidth: 900, margin: '0 auto' }}>
            {totalCount === 0 ? (
              <div style={{ textAlign: 'center', padding: '80px 20px' }}>
                <div style={{ fontSize: 64, marginBottom: 16 }}>🗑️</div>
                <h3 style={{ fontSize: 18, fontWeight: 600, color: '#191F28', marginBottom: 8 }}>휴지통이 비어있습니다</h3>
                <p style={{ fontSize: 14, color: '#8B95A1' }}>삭제된 항목이 없습니다</p>
              </div>
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                {/* 프로젝트 */}
                {trashedProjects.length > 0 && (
                  <div>
                    <h3 style={{ fontSize: 14, fontWeight: 600, color: '#6B7684', marginBottom: 12, display: 'flex', alignItems: 'center', gap: 8 }}>
                      <Icon name="folder" size={16} color="#6B7684" /> 프로젝트 ({trashedProjects.length})
                    </h3>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                      {trashedProjects.map(project => {
                        const brand = BRANDS.find(b => b.id === project.brandId);
                        const daysLeft = getDaysLeft(project.deletedAt);
                        return (
                          <div key={project.id} style={{ 
                            display: 'flex', alignItems: 'center', gap: 12,
                            padding: 16, background: 'white', borderRadius: 12,
                            border: '1px solid #E5E8EB'
                          }}>
                            <div style={{ width: 4, height: 40, borderRadius: 2, background: brand?.color || '#8B95A1' }} />
                            <div style={{ flex: 1 }}>
                              <p style={{ fontSize: 15, fontWeight: 600, color: '#191F28' }}>{project.title}</p>
                              <p style={{ fontSize: 12, color: '#8B95A1', marginTop: 2 }}>{brand?.name || '브랜드 없음'}</p>
                            </div>
                            <span style={{ 
                              fontSize: 12, color: daysLeft <= 1 ? '#F04452' : '#8B95A1',
                              background: daysLeft <= 1 ? '#FEE4E2' : '#F7F8FA',
                              padding: '4px 10px', borderRadius: 6
                            }}>
                              {daysLeft}일 후 삭제
                            </span>
                            <button 
                              onClick={() => setConfirmAction({ type: 'restore', item: project, itemType: 'project' })}
                              style={{ padding: '8px 14px', borderRadius: 8, border: '1px solid #00C471', background: '#F0FDF4', color: '#00C471', fontSize: 13, fontWeight: 600, cursor: 'pointer' }}
                            >
                              복원
                            </button>
                            <button 
                              onClick={() => setConfirmAction({ type: 'delete', item: project, itemType: 'project' })}
                              style={{ padding: '8px 14px', borderRadius: 8, border: 'none', background: '#FEE4E2', color: '#F04452', fontSize: 13, fontWeight: 600, cursor: 'pointer' }}
                            >
                              영구삭제
                            </button>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
                
                {/* 업무 */}
                {trashedTasks.length > 0 && (
                  <div>
                    <h3 style={{ fontSize: 14, fontWeight: 600, color: '#6B7684', marginBottom: 12, display: 'flex', alignItems: 'center', gap: 8 }}>
                      <Icon name="clipboard" size={16} color="#6B7684" /> 업무 ({trashedTasks.length})
                    </h3>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                      {trashedTasks.map(task => {
                        const project = projects.find(p => p.id === task.projectId);
                        const brand = project ? BRANDS.find(b => b.id === project.brandId) : null;
                        const daysLeft = getDaysLeft(task.deletedAt);
                        const subtaskCount = tasks.filter(t => t.parentTaskId === task.id).length;
                        return (
                          <div key={task.id} style={{

                          }}>

                              <p style={{ fontSize: 15, fontWeight: 500, color: '#191F28' }}>{task.title}</p>
                              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 4 }}>
                                {brand && <span style={{ fontSize: 11, color: brand.color, background: `${brand.color}15`, padding: '2px 8px', borderRadius: 4 }}>{brand.name}</span>}
                                <span style={{ fontSize: 12, color: '#8B95A1' }}>{task.date}</span>

                            <span style={{

                            <button

                            >
                              영구삭제
                            </button>
                          </div>

                      })}
                    </div>
                  </div>
                )}
                
                {/* 루틴 업무 */}
                {trashedFixedTasks.length > 0 && (
                  <div>
                    <h3 style={{ fontSize: 14, fontWeight: 600, color: '#6B7684', marginBottom: 12, display: 'flex', alignItems: 'center', gap: 8 }}>
                      <Icon name="clock" size={16} color="#6B7684" /> 루틴 업무 ({trashedFixedTasks.length})
                    </h3>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                      {trashedFixedTasks.map(task => {
                        const daysLeft = getDaysLeft(task.deletedAt);
                        const typeLabel = { daily: '일일', weekly: '주간', monthly: '월간' }[task.routineType] || '';
                        const typeColor = { daily: '#F59E0B', weekly: '#3B82F6', monthly: '#9333EA' }[task.routineType] || '#8B95A1';

                     confirmAction.type === 'empty' ? '휴지통 비우기' : '영구 삭제'}
                  </h3>
                  <p style={{ fontSize: 14, color: '#6B7684', lineHeight: 1.5 }}>
                    {confirmAction.type === 'restore' 
                      ? `"${confirmAction.item?.title}"을(를) 복원하시겠습니까?`
                      : confirmAction.type === 'empty'
                        ? '휴지통의 모든 항목이 영구 삭제됩니다. 이 작업은 되돌릴 수 없습니다.'
                        : `"${confirmAction.item?.title}"을(를) 영구 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.`

                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ============ 그로스보드 탭 ============
    function GrowthBoardTab({ tasks, projects, currentUser }) {
      // 주차 계산 헬퍼
      const getWeekNumber = (date) => {
        const d = new Date(date);
        const firstDay = new Date(d.getFullYear(), 0, 1);
        const pastDays = (d - firstDay) / 86400000;
        return Math.ceil((pastDays + firstDay.getDay() + 1) / 7);
      };
      
      const getWeekRange = (year, week) => {
        const firstDay = new Date(year, 0, 1);
        const days = (week - 1) * 7;
        const startDate = new Date(firstDay.setDate(firstDay.getDate() + days - firstDay.getDay() + 1));
        const endDate = new Date(startDate);
        endDate.setDate(startDate.getDate() + 6);
        return { start: formatDate(startDate), end: formatDate(endDate) };
      };
      
      const currentYear = new Date().getFullYear();
      const currentWeek = getWeekNumber(new Date());
      
      // 상태
      const [selectedYear, setSelectedYear] = useState(currentYear);
      const [selectedWeek, setSelectedWeek] = useState(currentWeek);
      const [selectedBrand, setSelectedBrand] = useState(1);
      const [nodes, setNodes] = useState([]);
      const [connections, setConnections] = useState([]);
      const [selectedNode, setSelectedNode] = useState(null);
      const [showAddBranch, setShowAddBranch] = useState(false);
      const [newBranchName, setNewBranchName] = useState('');
      const [editingNode, setEditingNode] = useState(null);
      const [boards, setBoards] = useState({});
      const [nodeWidths, setNodeWidths] = useState({}); // 노드 실제 너비 저장
      
      // 줌 & 패닝 상태 (transform 기반 무한 캔버스)
      const [zoom, setZoom] = useState(1);
      const [offset, setOffset] = useState({ x: 100, y: 50 }); // 초기 위치
      const [isPanning, setIsPanning] = useState(false);
      const [spacePressed, setSpacePressed] = useState(false);
      const panStart = React.useRef({ x: 0, y: 0, offsetX: 0, offsetY: 0 });
      const canvasRef = React.useRef(null);
      
      // 스페이스바 & ESC 전역 이벤트 리스너
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
            e.preventDefault();
            setSpacePressed(true);
          }
          if (e.key === 'Escape') {
            if (showAddBranch) setShowAddBranch(false);
            else if (editingNode) setEditingNode(null);
            else if (selectedNode) setSelectedNode(null);
          }
        };
        const handleKeyUp = (e) => {
          if (e.code === 'Space') {
            e.preventDefault();
            setSpacePressed(false);
            setIsPanning(false);
          }
        };
        
        document.addEventListener('keydown', handleKeyDown);
        document.addEventListener('keyup', handleKeyUp);
        
        return () => {
          document.removeEventListener('keydown', handleKeyDown);
          document.removeEventListener('keyup', handleKeyUp);
        };
      }, [showAddBranch, editingNode, selectedNode]);
      
      // 현재 보드 키 (브랜드 통합)
      const boardKey = `${currentUser.id}-${selectedYear}-W${selectedWeek}`;
      
      // Firebase에서 보드 데이터 로드
      useEffect(() => {
        const loadBoard = async () => {
          const data = await FirebaseService.getDoc('growthboards', boardKey);
          if (data) {
            let loadedNodes = data.nodes || [];
            let loadedConnections = data.connections || [];
            
            setNodes(loadedNodes);
            setConnections(loadedConnections);

            // 새 보드 초기화 - 중심 노드만

      }, [boardKey, selectedYear, selectedWeek]);
      
      // 보드 저장
      const saveBoard = async (newNodes, newConnections) => {
        await FirebaseService.saveDoc('growthboards', boardKey, {
          nodes: newNodes,
          connections: newConnections,
          updatedAt: new Date().toISOString()
        });
      };
      
      // 내 프로젝트만 필터링 (내가 만든 프로젝트 + 내가 참여한 프로젝트)
      const myProjects = useMemo(() => {
        // 내가 담당자(memberIds)로 할당된 프로젝트만 표시
        return projects.filter(p => 
          p.memberIds && p.memberIds.includes(currentUser.id)
        );
      }, [projects, currentUser.id]);
      
      // 프로젝트별 하위업무 (내 업무만) - 부모 업무만
      const getProjectTasks = (projectId) => {
        return tasks.filter(t => t.projectId === projectId && t.memberId === currentUser.id && !t.parentTaskId);
      };
      
      // 프로젝트별 전체 업무 (하위업무 포함)
      const getAllProjectTasks = (projectId) => {
        return tasks.filter(t => t.projectId === projectId && t.memberId === currentUser.id);
      };
      
      // 특정 업무의 하위업무 가져오기
      const getSubtasks = (parentTaskId) => {
        return tasks.filter(t => t.parentTaskId === parentTaskId && t.memberId === currentUser.id);
      };
      
      // 프로젝트의 브랜드 정보 가져오기
      const getProjectBrand = (project) => {
        return BRANDS.find(b => b.id === project.brandId);
      };
      
      // 이미 보드에 추가된 프로젝트 ID
      const addedProjectIds = useMemo(() => {
        return nodes.filter(n => n.projectId).map(n => n.projectId);
      }, [nodes]);
      
      // 수동 동기화 함수 - 프로젝트/업무 변경사항 반영
      const syncWithProjects = () => {
        if (nodes.length === 0) return;
        
        let updatedNodes = [...nodes];
        let updatedConnections = [...connections];
        let hasChanges = false;
        let deletedCount = 0;
        
        // 0. 삭제된 프로젝트/업무 동기화 (노드 제거)
        const nodesToRemove = [];
        
        updatedNodes.forEach(node => {
          // 프로젝트 노드 삭제 체크
          if (node.projectId) {
            const project = projects.find(p => p.id === node.projectId);
            // 프로젝트가 없거나 삭제된 경우
            if (!project || project.deletedAt) {
              nodesToRemove.push(node.id);
              deletedCount++;
            }
          }
          // 업무 노드 삭제 체크
          if (node.taskId) {
            const task = tasks.find(t => t.id === node.taskId);
            // 업무가 없거나 삭제된 경우
            if (!task || task.deletedAt) {
              nodesToRemove.push(node.id);
              deletedCount++;
            }
          }
        });
        
        // 삭제할 노드가 있으면 처리
        if (nodesToRemove.length > 0) {
          hasChanges = true;
          // 삭제할 노드의 하위 노드들도 찾기 (재귀적으로)
          const getAllChildNodes = (parentId) => {
            const childIds = updatedConnections
              .filter(c => c.from === parentId)
              .map(c => c.to);
            let allChildIds = [...childIds];
            childIds.forEach(childId => {
              allChildIds = [...allChildIds, ...getAllChildNodes(childId)];
            });
            return allChildIds;
          };
          
          // 삭제할 노드와 그 하위 노드들 모두 수집
          let allNodesToRemove = [...nodesToRemove];
          nodesToRemove.forEach(nodeId => {
            allNodesToRemove = [...allNodesToRemove, ...getAllChildNodes(nodeId)];
          });
          allNodesToRemove = [...new Set(allNodesToRemove)]; // 중복 제거
          
          // 노드 제거
          updatedNodes = updatedNodes.filter(n => !allNodesToRemove.includes(n.id));
          // 연결 제거
          updatedConnections = updatedConnections.filter(c => 
            !allNodesToRemove.includes(c.from) && !allNodesToRemove.includes(c.to)
          );
        }
        
        // 1. 프로젝트/업무 이름 변경 동기화
        updatedNodes = updatedNodes.map(node => {
          // 프로젝트 노드 동기화
          if (node.projectId) {
            const project = projects.find(p => p.id === node.projectId);
            if (project && node.text !== project.title) {
              hasChanges = true;
              return { ...node, text: project.title };
            }
          }
          // 업무 노드 동기화
          if (node.taskId) {
            const task = tasks.find(t => t.id === node.taskId);
            if (task && node.text !== task.title) {
              hasChanges = true;
              return { ...node, text: task.title };
            }
          }
          return node;
        });
        
        // 2. 새로 추가된 완료 업무 동기화 (내가 담당한 업무만)
        updatedNodes.forEach(node => {
          if (node.projectId && node.type === 'branch') {
            const projectTasks = tasks.filter(t => 
              t.projectId === node.projectId && 
              t.completed && 
              !t.parentTaskId &&
              t.memberId === currentUser.id
            );
            
            // 이미 추가된 업무 ID
            const existingTaskIds = updatedNodes
              .filter(n => n.taskId && connections.some(c => c.from === node.id && c.to === n.id))
              .map(n => n.taskId);
            
            // 새로 추가할 업무
            projectTasks.forEach(task => {
              if (!existingTaskIds.includes(task.id)) {
                hasChanges = true;
                const taskNodeId = `task-${task.id}-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`;
                updatedNodes.push({
                  id: taskNodeId,
                  type: 'task',
                  taskId: task.id,
                  text: task.title,
                  x: 0,
                  y: 0,
                  completed: task.completed,
                  color: '#00C471'
                });
                updatedConnections.push({
                  id: `conn-task-${taskNodeId}`,
                  from: node.id,
                  to: taskNodeId
                });
                
                // 서브태스크도 추가 (내가 담당한 것만)
                const subtasks = tasks.filter(st => 
                  st.parentTaskId === task.id && st.completed && st.memberId === currentUser.id
                );
                subtasks.forEach(st => {
                  const subtaskNodeId = `subtask-${st.id}-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`;
                  updatedNodes.push({
                    id: subtaskNodeId,
                    type: 'task',
                    taskId: st.id,
                    text: st.title,
                    x: 0,
                    y: 0,
                    completed: st.completed,
                    color: '#10B981',
                    isSubtask: true
                  });
                  updatedConnections.push({
                    id: `conn-subtask-${subtaskNodeId}`,
                    from: taskNodeId,
                    to: subtaskNodeId
                  });
                });
              }
            });
          }
        });
        
        // 항상 레이아웃 재정렬 (변경사항 없어도)
        const layoutedNodes = autoLayoutTree(updatedNodes, updatedConnections);
        setNodeWidths({}); // 노드 너비 초기화
        setNodes(layoutedNodes);
        setConnections(updatedConnections);
        saveBoard(layoutedNodes, updatedConnections);
        
        // 노드 측정 후 연결선 다시 그리도록 강제 리렌더링
        setTimeout(() => {
          setNodes([...layoutedNodes]);
        }, 50);
        
        if (hasChanges) {
          const deleteMsg = deletedCount > 0 ? `\n삭제된 항목: ${deletedCount}개` : '';
          alert(`✅ 동기화 완료!\n프로젝트/업무 변경사항이 반영되었습니다.${deleteMsg}`);
        } else {
          alert('✅ 레이아웃 정렬 완료!');
        }
      };
      
      // 레이아웃 상수 - EdrawMind 스타일
      const LAYOUT = {
        centerX: 200,
        centerY: 300,
        level1X: 330,   // 브랜드 노드
        level2X: 480,   // 프로젝트 노드 (브랜드+간격)
        level3X: 660,   // 하위업무 노드
        level4X: 840,   // 서브태스크 노드
        nodeGapY: 25,   // 브랜드 노드 간 여백
        taskGapY: 38,   // 프로젝트 노드 간 간격
        subtaskGapY: 18, // 하위업무 노드 간 간격
        nodeHeight: 36   // 노드 높이
      };
      
      // 트리 자동 정렬 함수 - 서브트리 높이 계산 후 겹치지 않게 배치
      const autoLayoutTree = (nodeList, connList) => {
        const centerNode = nodeList.find(n => n.id === 'center');
        if (!centerNode) return nodeList;
        
        // 레벨별 X 좌표
        const levelX = {
          0: LAYOUT.centerX,
          1: LAYOUT.level1X,
          2: LAYOUT.level2X,
          3: LAYOUT.level3X,
          4: LAYOUT.level4X,
          5: LAYOUT.level4X + 150
        };
        
        // 자식 노드 가져오기
        const getChildren = (parentId) => {
          return connList.filter(c => c.from === parentId).map(c => nodeList.find(n => n.id === c.to)).filter(Boolean);
        };
        
        // 서브트리 높이 계산 (재귀) - 해당 노드와 모든 자손이 차지하는 총 높이
        const getSubtreeHeight = (node, level) => {
          const children = getChildren(node.id);
          if (children.length === 0) {
            return LAYOUT.nodeHeight;
          }
          
          // level 1 = 브랜드의 자식(프로젝트)들 간격 → taskGapY
          // level 2+ = 프로젝트의 자식(하위업무)들 간격 → subtaskGapY
          const gap = level === 1 ? LAYOUT.taskGapY : LAYOUT.subtaskGapY;
          let totalHeight = 0;
          children.forEach((child, idx) => {
            totalHeight += getSubtreeHeight(child, level + 1);
            if (idx < children.length - 1) totalHeight += gap;
          });
          
          return Math.max(LAYOUT.nodeHeight, totalHeight);
        };
        
        // 레벨1 자식들 (중심에서 직접 연결된 노드들)
        const level1Children = getChildren('center');
        
        // 각 레벨1 노드의 서브트리 높이 계산
        const subtreeHeights = level1Children.map(child => getSubtreeHeight(child, 1));
        
        // 레벨1 노드들을 서브트리 높이 고려해서 배치
        let currentY = 80;
        level1Children.forEach((child, idx) => {
          const height = subtreeHeights[idx];
          child.x = levelX[1];
          child.y = currentY + height / 2;
          currentY += height + LAYOUT.nodeGapY;
        });
        
        // 중심 노드는 레벨1 자식들의 중앙에 배치
        centerNode.x = LAYOUT.centerX;
        if (level1Children.length > 0) {
          const ys = level1Children.map(c => c.y);
          centerNode.y = (Math.min(...ys) + Math.max(...ys)) / 2;
        } else {
          centerNode.y = LAYOUT.centerY;
        }
        
        // 레벨2 이상 노드 배치 (각 부모 노드를 중심으로, 서브트리 높이 고려)
        const positionChildren = (parentNode, level) => {
          const children = getChildren(parentNode.id);
          if (children.length === 0) return;
          
          const gap = level === 2 ? LAYOUT.taskGapY : LAYOUT.subtaskGapY;
          
          // 각 자식의 서브트리 높이 계산
          const childHeights = children.map(child => getSubtreeHeight(child, level));
          const totalHeight = childHeights.reduce((sum, h) => sum + h, 0) + (children.length - 1) * gap;
          
          let currentY = parentNode.y - totalHeight / 2;
          children.forEach((child, idx) => {
            const height = childHeights[idx];
            child.x = levelX[level] || (levelX[4] + (level - 4) * 160);
            child.y = currentY + height / 2;
            currentY += height + gap;
            
            // 재귀적으로 자식의 자식들도 배치
            positionChildren(child, level + 1);
          });
        };
        
        // 각 레벨1 노드의 자식들 배치
        level1Children.forEach(child => {
          positionChildren(child, 2);
        });
        
        return nodeList;
      };
      
      // 프로젝트 드롭 핸들러 - 프로젝트 + 하위업무 추가
      const handleDropProject = (project) => {
        const centerNode = nodes.find(n => n.id === 'center');
        if (!centerNode) return;
        
        // 개별 업무일지 업무 드래그 처리

          const task = project.task;
          const brand = BRANDS.find(b => b.id === task.projectId);
          
          // 해당 브랜드의 노드가 이미 있는지 확인 (그 외 업무 또는 실제 브랜드)
          let parentNodeId;
          
          if (brand) {
            // 실제 브랜드가 있으면 그 브랜드 노드 아래에 추가

            let existingBrandNode = nodes.find(n => n.id === brandNodeId);
            
            if (!existingBrandNode) {
              const brandNode = {

              updatedNodes.push(brandNode);
              updatedConnections.push({

            parentNodeId = brandNodeId;
          } else {

            if (!existingOtherNode) {
              const otherNode = {
                id: otherNodeId,

                y: 0,
