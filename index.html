    // ============ 타팀요청 업무 탭 ============
    function TeamRequestTab({ teamRequests, setTeamRequests, currentUser }) {
      const [filterTeam, setFilterTeam] = useState(null);
      const [filterStatus, setFilterStatus] = useState('pending'); // 기본값: 대기중
      const [filterAssignee, setFilterAssignee] = useState(null);
      const [showAddModal, setShowAddModal] = useState(false);
      const [editingRequest, setEditingRequest] = useState(null);
      const [selectedRequest, setSelectedRequest] = useState(null);
      const [confirmDelete, setConfirmDelete] = useState(null);
      const hasMigrated = useRef(false);
      
      // 담당자가 지정되어 있는데 대기중인 항목은 자동으로 진행중으로 변경 (최초 1회)
      useEffect(() => {
        if (hasMigrated.current || teamRequests.length === 0) return;
        
        const needsUpdate = teamRequests.filter(r => 
          r.assigneeId && r.status === 'pending' && !r.deletedAt
        );
        if (needsUpdate.length > 0) {
          console.log('[Auto] 담당자 있는 대기중 항목 → 진행중 변경:', needsUpdate.length, '개');
          setTeamRequests(prev => prev.map(r => 
            r.assigneeId && r.status === 'pending' && !r.deletedAt
              ? { ...r, status: 'progress' }
              : r
          ));
        }
        hasMigrated.current = true;
      }, [teamRequests.length]); // teamRequests가 로드된 후 실행
      
      // ESC 키로 모달 닫기
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            if (confirmDelete) setConfirmDelete(null);
            else if (selectedRequest) setSelectedRequest(null);
            else if (showAddModal) { setShowAddModal(false); setEditingRequest(null); }
          }
        };
        document.addEventListener('keydown', handleKeyDown);
        return () => document.removeEventListener('keydown', handleKeyDown);
      }, [confirmDelete, selectedRequest, showAddModal]);
      
      // 전체 요청 (삭제되지 않은 것)
      const allRequests = useMemo(() => {
        let r = teamRequests.filter(t => !t.deletedAt);
        if (filterTeam) r = r.filter(t => t.requestTeam === filterTeam);
        if (filterStatus) r = r.filter(t => t.status === filterStatus);
        if (filterAssignee === 'unassigned') {
          r = r.filter(t => !t.assigneeId);
        } else if (filterAssignee) {
          r = r.filter(t => t.assigneeId === filterAssignee);
        }
        // 미배정 우선 → 우선순위 → 마감일순
        return r.sort((a, b) => {
          // 미배정이 먼저
          if (!a.assigneeId && b.assigneeId) return -1;
          if (a.assigneeId && !b.assigneeId) return 1;
          // 우선순위
          const priorityA = PRIORITY_OPTIONS.find(p => p.id === a.priority)?.order ?? 3;
          const priorityB = PRIORITY_OPTIONS.find(p => p.id === b.priority)?.order ?? 3;
          if (priorityA !== priorityB) return priorityA - priorityB;
          return (a.dueDate || '').localeCompare(b.dueDate || '');
        });
      }, [teamRequests, filterTeam, filterStatus, filterAssignee]);
      
      const currentRequests = allRequests;
      
      // 마감 임박 요청 (D-7 이내, 대기/진행중만) - 필터와 관계없이 항상 표시
      const urgentRequests = useMemo(() => {
        const sevenDaysLater = new Date();
        sevenDaysLater.setDate(sevenDaysLater.getDate() + 7);
        return teamRequests.filter(r => 
          !r.deletedAt &&
          r.dueDate && 
          new Date(r.dueDate) <= sevenDaysLater && 
          (r.status === 'pending' || r.status === 'progress')
        ).sort((a, b) => (a.dueDate || '').localeCompare(b.dueDate || ''));
      }, [teamRequests]);
      
      // D-day 계산
      const getDday = (dueDate) => {
        if (!dueDate) return null;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const due = new Date(dueDate);
        due.setHours(0, 0, 0, 0);
        const diff = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
        if (diff < 0) return `D+${Math.abs(diff)}`;
        if (diff === 0) return 'D-Day';
        return `D-${diff}`;
      };
      
      // D-day 색상
      const getDdayColor = (dueDate) => {
        if (!dueDate) return '#8B95A1';
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const due = new Date(dueDate);
        due.setHours(0, 0, 0, 0);
        const diff = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
        if (diff < 0) return '#F04452'; // 지남
        if (diff <= 2) return '#F04452'; // D-2 이내
        if (diff <= 5) return '#F59E0B'; // D-5 이내
        return '#00C471';
      };
      
      // 요청 추가
      const addRequest = (request) => {
        const newRequest = {
          ...request,
          id: Date.now(),
          creatorId: currentUser.id,
          assigneeId: null, // 미배정 상태로 시작
          status: 'pending',
          createdAt: formatDate(new Date()),
          completedAt: null,
          rejectReason: null,
        };
        setTeamRequests(prev => [...prev, newRequest]);
      };
      
      // 담당자 배정 (배정 시 자동으로 진행중으로 변경)
      const assignRequest = (id, memberId) => {
        setTeamRequests(prev => prev.map(r => 
          r.id === id ? { 
            ...r, 
            assigneeId: memberId,
            // 담당자가 지정되면 대기중 → 진행중으로 자동 변경
            status: memberId && r.status === 'pending' ? 'progress' : r.status
          } : r
        ));
      };
      
      // 요청 수정
      const updateRequest = (request) => {
        setTeamRequests(prev => prev.map(r => r.id === request.id ? { ...r, ...request } : r));
      };
      
      // 요청 삭제
      const deleteRequest = (id) => {
        setTeamRequests(prev => prev.map(r => r.id === id ? { ...r, deletedAt: Date.now() } : r));
        setConfirmDelete(null);
      };
      
      // 상태 변경
      const changeStatus = (id, status, rejectReason = null) => {
        setTeamRequests(prev => prev.map(r => {
          if (r.id === id) {
            return {
              ...r,
              status,
              completedAt: status === 'complete' ? formatDate(new Date()) : null,
              rejectReason: status === 'rejected' ? rejectReason : null,
            };
          }
          return r;
        }));
      };
      
      // 요청 추가/수정 모달
      const RequestModal = ({ request, onSave, onClose }) => {
        const [form, setForm] = useState(request || {
          requestTeam: '',
          requester: '',
          title: '',
          description: '',
          dueDate: '',

        });
        
        return (
          <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000 }}>
            <div style={{ background: 'white', borderRadius: 16, width: 480, maxHeight: '90vh', overflow: 'auto' }}>
              <div style={{ padding: '20px 24px', borderBottom: '1px solid #E5E8EB', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>

                  {request ? '요청 수정' : '📥 타팀 요청 등록'}
                </h2>
                <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 4 }}>
                  <Icon name="x" size={24} color="#6B7684" />
                </button>
              </div>
              
              <div style={{ padding: 24, display: 'flex', flexDirection: 'column', gap: 20 }}>
                {/* 요청팀 */}
                <div>
                  <label style={{ display: 'block', fontSize: 14, fontWeight: 600, color: '#191F28', marginBottom: 8 }}>
                    요청팀 <span style={{ color: '#F04452' }}>*</span>
                  </label>
                  <select
                    value={form.requestTeam}
                    onChange={(e) => setForm({ ...form, requestTeam: e.target.value })}
                    style={{ width: '100%', padding: '12px 14px', borderRadius: 10, border: '1px solid #E5E8EB', fontSize: 14, background: 'white' }}
                  >
                    <option value="">선택하세요</option>
                    {REQUEST_TEAMS.map(t => (
                      <option key={t.id} value={t.id}>{t.name}</option>
                    ))}
                  </select>
                </div>
                
                {/* 요청자 */}
                <div>
                  <label style={{ display: 'block', fontSize: 14, fontWeight: 600, color: '#191F28', marginBottom: 8 }}>요청자</label>
                  <input
                    type="text"

                {/* 요청 내용 */}
                <div>
                  <label style={{ display: 'block', fontSize: 14, fontWeight: 600, color: '#191F28', marginBottom: 8 }}>
                    요청 내용 <span style={{ color: '#F04452' }}>*</span>
                  </label>
                  <input
                    type="text"
                    value={form.title}
                    onChange={(e) => setForm({ ...form, title: e.target.value })}
                    placeholder="요청 내용을 입력하세요"
                    style={{ width: '100%', padding: '12px 14px', borderRadius: 10, border: '1px solid #E5E8EB', fontSize: 14, boxSizing: 'border-box' }}
                  />
                </div>
                
                {/* 상세 설명 */}
                <div>
                  <label style={{ display: 'block', fontSize: 14, fontWeight: 600, color: '#191F28', marginBottom: 8 }}>상세 설명</label>
                  <textarea
                    value={form.description}
                    onChange={(e) => setForm({ ...form, description: e.target.value })}
                    placeholder="상세 내용을 입력하세요"
                    rows={4}
                    style={{ width: '100%', padding: '12px 14px', borderRadius: 10, border: '1px solid #E5E8EB', fontSize: 14, resize: 'vertical', boxSizing: 'border-box' }}
                  />
                </div>
                
                {/* 마감일 & 우선순위 */}
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
                  <div>
                    <label style={{ display: 'block', fontSize: 14, fontWeight: 600, color: '#191F28', marginBottom: 8 }}>
                      마감일 <span style={{ color: '#F04452' }}>*</span>
                    </label>
                    <input
                      type="date"
                      value={form.dueDate}
                      onChange={(e) => setForm({ ...form, dueDate: e.target.value })}
                      style={{ width: '100%', padding: '12px 14px', borderRadius: 10, border: '1px solid #E5E8EB', fontSize: 14, boxSizing: 'border-box' }}
                    />
                  </div>
                  <div>
                    <label style={{ display: 'block', fontSize: 14, fontWeight: 600, color: '#191F28', marginBottom: 8 }}>우선순위</label>
                    <select
                      value={form.priority}
                      onChange={(e) => setForm({ ...form, priority: e.target.value })}
                      style={{ width: '100%', padding: '12px 14px', borderRadius: 10, border: '1px solid #E5E8EB', fontSize: 14, background: 'white' }}
                    >
                      {PRIORITY_OPTIONS.map(p => (
                        <option key={p.id} value={p.id}>{p.icon} {p.label}</option>
                      ))}
                    </select>
                  </div>
                </div>
                
                {/* 관련 브랜드 */}
                <div>
                  <label style={{ display: 'block', fontSize: 14, fontWeight: 600, color: '#191F28', marginBottom: 8 }}>관련 브랜드</label>
                  <select
                    value={form.brandId || ''}
                    onChange={(e) => setForm({ ...form, brandId: e.target.value || null })}
                    style={{ width: '100%', padding: '12px 14px', borderRadius: 10, border: '1px solid #E5E8EB', fontSize: 14, background: 'white' }}
                  >
                    <option value="">선택 안함</option>
                    {BRANDS.map(b => (
                      <option key={b.id} value={b.id}>{b.name}</option>
                    ))}
                  </select>
                </div>
              </div>
              
              <div style={{ padding: '16px 24px', borderTop: '1px solid #E5E8EB', display: 'flex', gap: 12, justifyContent: 'flex-end' }}>
                <button onClick={onClose} style={{ padding: '12px 24px', borderRadius: 10, border: '1px solid #E5E8EB', background: 'white', fontSize: 14, fontWeight: 600, color: '#6B7684', cursor: 'pointer' }}>
                  취소
                </button>
                <button
                  onClick={() => {
                    if (!form.requestTeam || !form.title || !form.dueDate) {
                      alert('필수 항목을 입력해주세요.');
                      return;
                    }
                    onSave(form);
                    onClose();
                  }}
                  style={{ padding: '12px 24px', borderRadius: 10, border: 'none', background: '#3182F6', fontSize: 14, fontWeight: 600, color: 'white', cursor: 'pointer' }}
                >
                  {request ? '수정하기' : '등록하기'}
                </button>
              </div>
            </div>
          </div>
        );
      };
      
      // 요청 상세 모달
      const RequestDetailModal = ({ request, onClose }) => {
        const [showRejectInput, setShowRejectInput] = useState(false);
        const [rejectReason, setRejectReason] = useState('');
        const [note, setNote] = useState(request.note || '');
        
        const team = REQUEST_TEAMS.find(t => t.id === request.requestTeam);
        const status = REQUEST_STATUS.find(s => s.id === request.status);
        const priority = PRIORITY_OPTIONS.find(p => p.id === request.priority) || PRIORITY_OPTIONS[3];
        const brand = BRANDS.find(b => b.id === request.brandId);
        const dday = getDday(request.dueDate);
        const ddayColor = getDdayColor(request.dueDate);
        
        return (
          <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000 }}>
            <div style={{ background: 'white', borderRadius: 16, width: 560, maxHeight: '90vh', overflow: 'auto' }}>
              <div style={{ padding: '20px 24px', borderBottom: '1px solid #E5E8EB', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                  <span style={{ padding: '6px 12px', borderRadius: 8, background: team?.color + '20', color: team?.color, fontSize: 13, fontWeight: 600 }}>
                    {team?.name}
                  </span>
                  <span style={{ padding: '6px 12px', borderRadius: 8, background: status?.bg, color: status?.color, fontSize: 13, fontWeight: 600 }}>
                    {status?.label}
                  </span>
                </div>
                <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 4 }}>
                  <Icon name="x" size={24} color="#6B7684" />
                </button>
              </div>
              
              <div style={{ padding: 24 }}>
                {/* 제목 & 우선순위 */}
                <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: 20 }}>
                  <h2 style={{ fontSize: 20, fontWeight: 700, color: '#191F28', flex: 1 }}>{request.title}</h2>
                  <span style={{ fontSize: 20 }}>{priority.icon}</span>
                </div>
                
                {/* 담당자 배정 */}
                <div style={{ marginBottom: 24, padding: 20, background: request.assigneeId ? '#F7F8FA' : '#FFFBEB', borderRadius: 12, border: request.assigneeId ? 'none' : '2px dashed #F59E0B' }}>
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                    <div>
                      <p style={{ fontSize: 12, color: '#8B95A1', marginBottom: 6 }}>담당자</p>
                      {request.assigneeId ? (
                        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                          {(() => {
                            const assignee = TEAM_MEMBERS.find(m => m.id === request.assigneeId);
                            return assignee ? (
                              <>
                                <div style={{ width: 32, height: 32, borderRadius: '50%', background: assignee.color, color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontWeight: 700 }}>
                                  {assignee.initial}
                                </div>
                                <span style={{ fontSize: 15, fontWeight: 600, color: '#191F28' }}>{assignee.name}</span>
                              </>
                            ) : <span style={{ fontSize: 15, fontWeight: 600, color: '#8B95A1' }}>알 수 없음</span>;
                          })()}
                        </div>
                      ) : (
                        <p style={{ fontSize: 15, fontWeight: 600, color: '#F59E0B' }}>⚠️ 미배정</p>
                      )}
                    </div>
                    <div style={{ display: 'flex', gap: 8 }}>
                      {!request.assigneeId && (
                        <button
                          onClick={() => { assignRequest(request.id, currentUser.id); onClose(); }}
                          style={{ padding: '10px 16px', borderRadius: 8, border: 'none', background: '#3182F6', fontSize: 13, fontWeight: 600, color: 'white', cursor: 'pointer' }}
                        >
                          내가 가져가기
                        </button>
                      )}
                      {currentUser.role === '팀장' && (
                        <select
                          value={request.assigneeId || ''}
                          onChange={(e) => { assignRequest(request.id, e.target.value || null); }}
                          style={{ padding: '10px 14px', borderRadius: 8, border: '1px solid #E5E8EB', fontSize: 13, background: 'white', cursor: 'pointer' }}
                        >
                          <option value="">담당자 지정</option>
                          {TEAM_MEMBERS.map(m => (
                            <option key={m.id} value={m.id}>{m.name}</option>
                          ))}
                        </select>
                      )}
                      {request.assigneeId && request.assigneeId === currentUser.id && (
                        <button
                          onClick={() => { assignRequest(request.id, null); }}
                          style={{ padding: '10px 16px', borderRadius: 8, border: '1px solid #E5E8EB', background: 'white', fontSize: 13, fontWeight: 600, color: '#6B7684', cursor: 'pointer' }}
                        >
                          배정 취소
                        </button>
                      )}
                    </div>
                  </div>
                </div>
                
                {/* 정보 그리드 */}
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginBottom: 24 }}>
                  <div style={{ padding: 16, background: '#F7F8FA', borderRadius: 12 }}>
                    <p style={{ fontSize: 12, color: '#8B95A1', marginBottom: 4 }}>요청자</p>
                    <p style={{ fontSize: 15, fontWeight: 600, color: '#191F28' }}>{request.requester || '-'}</p>
                  </div>
                  <div style={{ padding: 16, background: '#F7F8FA', borderRadius: 12 }}>
                    <p style={{ fontSize: 12, color: '#8B95A1', marginBottom: 4 }}>마감일</p>
                    <p style={{ fontSize: 15, fontWeight: 600, color: ddayColor }}>
                      {request.dueDate ? formatShortDate(request.dueDate) : '-'}
                      {dday && <span style={{ marginLeft: 8, fontSize: 13, fontWeight: 700 }}>({dday})</span>}
                    </p>
                  </div>
                  <div style={{ padding: 16, background: '#F7F8FA', borderRadius: 12 }}>
                    <p style={{ fontSize: 12, color: '#8B95A1', marginBottom: 4 }}>등록일</p>
                    <p style={{ fontSize: 15, fontWeight: 600, color: '#191F28' }}>{request.createdAt ? formatShortDate(request.createdAt) : '-'}</p>
                  </div>
                  <div style={{ padding: 16, background: '#F7F8FA', borderRadius: 12 }}>
                    <p style={{ fontSize: 12, color: '#8B95A1', marginBottom: 4 }}>관련 브랜드</p>
                    <p style={{ fontSize: 15, fontWeight: 600, color: brand?.color || '#191F28' }}>{brand?.name || '-'}</p>
                  </div>
                </div>
                
                {/* 상세 설명 */}
                {request.description && (
                  <div style={{ marginBottom: 24 }}>
                    <h4 style={{ fontSize: 14, fontWeight: 600, color: '#191F28', marginBottom: 8 }}>상세 설명</h4>
                    <div style={{ padding: 16, background: '#F7F8FA', borderRadius: 12 }}>
                      <p style={{ fontSize: 14, color: '#4B5563', whiteSpace: 'pre-wrap', lineHeight: 1.6 }}>{request.description}</p>
                    </div>
                  </div>
                )}
                
                {/* 반려 사유 */}
                {request.status === 'rejected' && request.rejectReason && (
                  <div style={{ marginBottom: 24, padding: 16, background: '#FEE4E2', borderRadius: 12 }}>
                    <h4 style={{ fontSize: 14, fontWeight: 600, color: '#F04452', marginBottom: 8 }}>반려 사유</h4>
                    <p style={{ fontSize: 14, color: '#991B1B' }}>{request.rejectReason}</p>
                  </div>
                )}
                
                {/* 메모 */}
                <div style={{ marginBottom: 24 }}>
                  <h4 style={{ fontSize: 14, fontWeight: 600, color: '#191F28', marginBottom: 8 }}>메모</h4>
                  <textarea
                    value={note}
                    onChange={(e) => setNote(e.target.value)}
                    onBlur={() => updateRequest({ ...request, note })}
                    placeholder="메모를 입력하세요..."
                    rows={3}
                    style={{ width: '100%', padding: '12px 14px', borderRadius: 10, border: '1px solid #E5E8EB', fontSize: 14, resize: 'vertical', boxSizing: 'border-box' }}
                  />
                </div>
                
                {/* 반려 입력 */}
                {showRejectInput && (
                  <div style={{ marginBottom: 24, padding: 16, background: '#FEF3C7', borderRadius: 12 }}>
                    <h4 style={{ fontSize: 14, fontWeight: 600, color: '#92400E', marginBottom: 8 }}>반려 사유 입력</h4>
                    <textarea
                      value={rejectReason}
                      onChange={(e) => setRejectReason(e.target.value)}
                      placeholder="반려 사유를 입력하세요..."
                      rows={2}
                      style={{ width: '100%', padding: '12px 14px', borderRadius: 10, border: '1px solid #FDE68A', fontSize: 14, resize: 'vertical', boxSizing: 'border-box', marginBottom: 12 }}
                    />
                    <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
                      <button onClick={() => setShowRejectInput(false)} style={{ padding: '8px 16px', borderRadius: 8, border: '1px solid #E5E8EB', background: 'white', fontSize: 13, fontWeight: 600, color: '#6B7684', cursor: 'pointer' }}>
                        취소
                      </button>
                      <button
                        onClick={() => {
                          if (!rejectReason.trim()) {
                            alert('반려 사유를 입력해주세요.');
                            return;
                          }
                          changeStatus(request.id, 'rejected', rejectReason);
                          onClose();
                        }}
                        style={{ padding: '8px 16px', borderRadius: 8, border: 'none', background: '#F04452', fontSize: 13, fontWeight: 600, color: 'white', cursor: 'pointer' }}
                      >
                        반려 처리
                      </button>
                    </div>
                  </div>
                )}
              </div>
              
              {/* 하단 액션 버튼 - 대기/진행중 */}
              {(request.status === 'pending' || request.status === 'progress') && !showRejectInput && (
                <div style={{ padding: '16px 24px', borderTop: '1px solid #E5E8EB', display: 'flex', gap: 12, justifyContent: 'space-between' }}>
                  <div style={{ display: 'flex', gap: 8 }}>
                    <button
                      onClick={() => { setEditingRequest(request); setShowAddModal(true); onClose(); }}
                      style={{ padding: '12px 20px', borderRadius: 10, border: '1px solid #E5E8EB', background: 'white', fontSize: 14, fontWeight: 600, color: '#6B7684', cursor: 'pointer' }}
                    >
                      ✏️ 수정
                    </button>
                    <button
                      onClick={() => setShowRejectInput(true)}
                      style={{ padding: '12px 20px', borderRadius: 10, border: '1px solid #F04452', background: '#FEE4E2', fontSize: 14, fontWeight: 600, color: '#F04452', cursor: 'pointer' }}
                    >
                      반려
                    </button>
                  </div>
                  <div style={{ display: 'flex', gap: 8 }}>
                    {request.status === 'pending' && (
                      <button
                        onClick={() => { changeStatus(request.id, 'progress'); }}
                        style={{ padding: '12px 20px', borderRadius: 10, border: 'none', background: '#3182F6', fontSize: 14, fontWeight: 600, color: 'white', cursor: 'pointer' }}
                      >
                        진행 시작
                      </button>
                    )}
                    <button
                      onClick={() => { changeStatus(request.id, 'complete'); onClose(); }}
                      style={{ padding: '12px 20px', borderRadius: 10, border: 'none', background: '#00C471', fontSize: 14, fontWeight: 600, color: 'white', cursor: 'pointer' }}
                    >
                      ✓ 완료 처리
                    </button>
                  </div>
                </div>
              )}
              
              {/* 하단 액션 버튼 - 완료/반려 상태 */}
              {(request.status === 'complete' || request.status === 'rejected') && (
                <div style={{ padding: '16px 24px', borderTop: '1px solid #E5E8EB', display: 'flex', gap: 12, justifyContent: 'space-between' }}>
                  <button
                    onClick={() => { setEditingRequest(request); setShowAddModal(true); onClose(); }}
                    style={{ padding: '12px 20px', borderRadius: 10, border: '1px solid #E5E8EB', background: 'white', fontSize: 14, fontWeight: 600, color: '#6B7684', cursor: 'pointer' }}
                  >
                    ✏️ 수정
                  </button>
                  <button
                    onClick={() => { changeStatus(request.id, 'progress'); }}
                    style={{ padding: '12px 20px', borderRadius: 10, border: 'none', background: '#3182F6', fontSize: 14, fontWeight: 600, color: 'white', cursor: 'pointer' }}
                  >
                    🔄 진행중으로 변경
                  </button>
                </div>
              )}
            </div>
          </div>
        );
      };
      
      // 통계 (필터와 관계없이 전체 기준)
      const stats = useMemo(() => {
        const all = teamRequests.filter(r => !r.deletedAt);
        const pending = all.filter(r => r.status === 'pending').length;
        const progress = all.filter(r => r.status === 'progress').length;
        const complete = all.filter(r => r.status === 'complete').length;
        const unassigned = all.filter(r => !r.assigneeId && r.status !== 'complete' && r.status !== 'rejected').length;
        return { pending, progress, complete, unassigned, total: all.length };
      }, [teamRequests]);

      return (
        <div style={{ minHeight: '100vh', background: '#F7F8FA' }}>
          {/* 헤더 */}
          <header style={{ background: 'white', borderBottom: '1px solid #E5E8EB', padding: '20px 32px' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <h1 style={{ fontSize: 24, fontWeight: 700, color: '#191F28' }}>타팀요청 업무</h1>
              <button
                onClick={() => { setEditingRequest(null); setShowAddModal(true); }}
                style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '12px 20px', borderRadius: 10, border: 'none', background: '#3182F6', fontSize: 14, fontWeight: 600, color: 'white', cursor: 'pointer' }}
              >
                <Icon name="plus" size={18} color="white" /> 요청 등록
              </button>
            </div>
          </header>
          
          <div style={{ padding: 32 }}>
            {/* 마감 임박 섹션 */}
            {urgentRequests.length > 0 && (
              <div style={{ marginBottom: 32 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 16 }}>
                  <span style={{ fontSize: 20 }}>⏰</span>
                  <h2 style={{ fontSize: 18, fontWeight: 700, color: '#191F28' }}>마감 임박</h2>
                  <span style={{ padding: '4px 10px', borderRadius: 20, background: '#FEE4E2', color: '#F04452', fontSize: 13, fontWeight: 600 }}>{urgentRequests.length}</span>
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(300px, 1fr))', gap: 16 }}>
                  {urgentRequests.slice(0, 6).map(req => {
                    const team = REQUEST_TEAMS.find(t => t.id === req.requestTeam);
                    const priority = PRIORITY_OPTIONS.find(p => p.id === req.priority) || PRIORITY_OPTIONS[3];
                    const dday = getDday(req.dueDate);
                    const ddayColor = getDdayColor(req.dueDate);
                    const status = REQUEST_STATUS.find(s => s.id === req.status);
                    const assignee = TEAM_MEMBERS.find(m => m.id === req.assigneeId);
                    return (
                      <div
                        key={req.id}
                        onClick={() => setSelectedRequest(req)}
                        style={{ background: req.assigneeId ? 'white' : '#FFFBEB', borderRadius: 12, padding: 16, border: req.assigneeId ? `2px solid ${ddayColor}20` : '2px dashed #F59E0B', cursor: 'pointer', transition: 'transform 0.2s' }}
                      >
                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
                          <span style={{ fontSize: 14, fontWeight: 700, color: ddayColor }}>{dday}</span>
                          <span style={{ fontSize: 16 }}>{priority.icon}</span>
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
                          <span style={{ padding: '3px 8px', borderRadius: 6, background: team?.color + '20', color: team?.color, fontSize: 11, fontWeight: 600 }}>{team?.name}</span>
                          <span style={{ padding: '3px 8px', borderRadius: 6, background: status?.bg, color: status?.color, fontSize: 11, fontWeight: 600 }}>{status?.label}</span>
                        </div>
                        <h3 style={{ fontSize: 15, fontWeight: 600, color: '#191F28', marginBottom: 8 }}>{req.title}</h3>
                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                          {assignee ? (
                            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                              <div style={{ width: 24, height: 24, borderRadius: '50%', background: assignee.color, color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 10, fontWeight: 700 }}>
                                {assignee.initial}
                              </div>
                              <span style={{ fontSize: 12, color: '#6B7684' }}>{assignee.name}</span>
                            </div>
                          ) : (
                            <button
                              onClick={(e) => { e.stopPropagation(); assignRequest(req.id, currentUser.id); }}
                              style={{ padding: '5px 10px', borderRadius: 6, border: '1px solid #3182F6', background: '#EBF4FF', fontSize: 11, fontWeight: 600, color: '#3182F6', cursor: 'pointer' }}
                            >
                              가져가기
                            </button>
                          )}
                          <span style={{ fontSize: 12, color: '#8B95A1' }}>{req.dueDate ? formatShortDate(req.dueDate) : '-'}</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
            
            {/* 통계 카드 - 필터 버튼 역할 */}
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: 16, marginBottom: 32 }}>
                <button
                  onClick={() => setFilterStatus('pending')}
                  style={{ background: '#F2F3F5', borderRadius: 12, padding: 20, border: filterStatus === 'pending' ? '3px solid #6B7684' : 'none', cursor: 'pointer', textAlign: 'left', transition: 'all 0.2s', transform: filterStatus === 'pending' ? 'scale(1.02)' : 'scale(1)' }}
                >
                  <p style={{ fontSize: 13, color: '#6B7684', marginBottom: 8 }}>대기중</p>
                  <p style={{ fontSize: 28, fontWeight: 700, color: '#6B7684' }}>{stats.pending}</p>
                </button>
                <button
                  onClick={() => setFilterStatus('progress')}
                  style={{ background: '#EBF4FF', borderRadius: 12, padding: 20, border: filterStatus === 'progress' ? '3px solid #3182F6' : 'none', cursor: 'pointer', textAlign: 'left', transition: 'all 0.2s', transform: filterStatus === 'progress' ? 'scale(1.02)' : 'scale(1)' }}
                >
                  <p style={{ fontSize: 13, color: '#3182F6', marginBottom: 8 }}>진행중</p>
                  <p style={{ fontSize: 28, fontWeight: 700, color: '#3182F6' }}>{stats.progress}</p>
                </button>
                <button
                  onClick={() => setFilterStatus('complete')}
                  style={{ background: '#D1FAE5', borderRadius: 12, padding: 20, border: filterStatus === 'complete' ? '3px solid #00C471' : 'none', cursor: 'pointer', textAlign: 'left', transition: 'all 0.2s', transform: filterStatus === 'complete' ? 'scale(1.02)' : 'scale(1)' }}
                >
                  <p style={{ fontSize: 13, color: '#00C471', marginBottom: 8 }}>완료</p>

                    취소
                  </button>
                  <button onClick={() => deleteRequest(confirmDelete.id)} style={{ padding: '12px 20px', borderRadius: 10, border: 'none', background: '#F04452', fontSize: 14, fontWeight: 600, color: 'white', cursor: 'pointer' }}>

    }

    // ============ 업무일지 탭 ============
    function WorkLogTab({ tasks, setTasks, currentUser, fixedTasks, setFixedTasks, projects, setProjects, teamRequests, setTeamRequests }) {
      const [viewMode, setViewMode] = useState('worklog'); // 'worklog' | 'calendar'
      const [selectedDate, setSelectedDate] = useState(today);
      const [currentMonth, setCurrentMonth] = useState({ year: new Date().getFullYear(), month: new Date().getMonth() });
      const [selectedProject, setSelectedProject] = useState(null);
      const [showAddModal, setShowAddModal] = useState(false);
      const [editingTask, setEditingTask] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedTaskForNote, setSelectedTaskForNote] = useState(null);
      const [draggedTask, setDraggedTask] = useState(null);
      const [dragOverId, setDragOverId] = useState(null);
      
      // 우선순위 드롭다운 상태
      const [openPriorityTaskId, setOpenPriorityTaskId] = useState(null);
      
      // 삭제 확인 모달 상태
      const [confirmDelete, setConfirmDelete] = useState(null); // { type: 'task' | 'fixedTask', id, title }
      
      // 캘린더 드래그 상태
      const [calendarDragTask, setCalendarDragTask] = useState(null);
      const [calendarDragOverDate, setCalendarDragOverDate] = useState(null);
      const [calendarDragRoutine, setCalendarDragRoutine] = useState(null); // 루틴 드래그용
      const [calendarHoverDate, setCalendarHoverDate] = useState(null); // 마우스 hover 날짜
      const [calendarAddTaskDate, setCalendarAddTaskDate] = useState(null); // 업무 추가할 날짜
      
      // 루틴 필터 상태 (캘린더 뷰에서 표시/숨김)
      const [showDailyRoutine, setShowDailyRoutine] = useState(true);
      const [showWeeklyRoutine, setShowWeeklyRoutine] = useState(true);
      const [showMonthlyRoutine, setShowMonthlyRoutine] = useState(true);
      
      // 캘린더 뷰 선택된 업무 (상세 모달용)
      const [calendarSelectedTask, setCalendarSelectedTask] = useState(null);
      const [calendarSelectedRoutine, setCalendarSelectedRoutine] = useState(null);
      
      // 루틴 업무 UI 상태
      const [showAddFixedModal, setShowAddFixedModal] = useState(false);
      const [addRoutineType, setAddRoutineType] = useState('daily');

      // ESC 키로 모달 닫기
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            if (openPriorityTaskId) setOpenPriorityTaskId(null);
            else if (confirmDelete) setConfirmDelete(null);
            else if (calendarAddTaskDate) setCalendarAddTaskDate(null);
            else if (calendarSelectedTask) setCalendarSelectedTask(null);
            else if (calendarSelectedRoutine) setCalendarSelectedRoutine(null);
            else if (showAddFixedModal) setShowAddFixedModal(false);
            else if (showAddModal) { setShowAddModal(false); setEditingTask(null); }
            else if (selectedTaskForNote) setSelectedTaskForNote(null);
          }
        };
        document.addEventListener('keydown', handleKeyDown);
        return () => document.removeEventListener('keydown', handleKeyDown);
      }, [openPriorityTaskId, confirmDelete, calendarAddTaskDate, calendarSelectedTask, calendarSelectedRoutine, showAddFixedModal, showAddModal, selectedTaskForNote]);
      
      // 문서 클릭 시 우선순위 드롭다운 닫기
      useEffect(() => {
        const handleClickOutside = () => {
          if (openPriorityTaskId) setOpenPriorityTaskId(null);
        };
        document.addEventListener('click', handleClickOutside);
        return () => document.removeEventListener('click', handleClickOutside);
      }, [openPriorityTaskId]);

      const myTasks = useMemo(() => tasks.filter(t => t.memberId === currentUser.id), [tasks, currentUser]);
      const monthDates = useMemo(() => getMonthDates(currentMonth.year, currentMonth.month), [currentMonth]);
      
      // 캘린더 뷰용 날짜 배열 (일요일 시작)
      const calendarDates = useMemo(() => {
        const year = currentMonth.year;
        const month = currentMonth.month;
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const startPadding = firstDay.getDay(); // 일요일 = 0
        const dates = [];
        for (let i = startPadding - 1; i >= 0; i--) {
          const d = new Date(year, month, -i);
          dates.push({ date: formatDate(d), isCurrentMonth: false, day: d.getDate() });
        }
        for (let i = 1; i <= lastDay.getDate(); i++) {
          const d = new Date(year, month, i);
          dates.push({ date: formatDate(d), isCurrentMonth: true, day: d.getDate() });
        }
        const remaining = Math.ceil(dates.length / 7) * 7 - dates.length;
        for (let i = 1; i <= remaining; i++) {
          const d = new Date(year, month + 1, i);
          dates.push({ date: formatDate(d), isCurrentMonth: false, day: d.getDate() });
        }
        return dates;
      }, [currentMonth]);
      
      // 해당 날짜에 서브태스크가 있는 부모 업무 ID들
      const parentIdsWithSubtasksToday = useMemo(() => {
        return [...new Set(myTasks.filter(t => t.parentTaskId && t.date === selectedDate).map(t => t.parentTaskId))];
      }, [myTasks, selectedDate]);
      
      // 부모 업무만 필터링 (해당 날짜 업무 OR 해당 날짜에 서브태스크가 있는 업무)
      const parentTasks = useMemo(() => {
        return myTasks
          .filter(t => !t.parentTaskId && (t.date === selectedDate || parentIdsWithSubtasksToday.includes(t.id)))
          .filter(t => !searchQuery || t.title.toLowerCase().includes(searchQuery.toLowerCase()))
          .filter(t => selectedProject === null || t.projectId === selectedProject || (selectedProject === 0 && !t.projectId))
          .sort((a, b) => {
            // 우선순위 정렬 (프로젝트 우선순위 기준)
            const projA = projects.find(p => p.id === a.projectId);
            const projB = projects.find(p => p.id === b.projectId);
            const priorityA = PRIORITY_OPTIONS.find(p => p.id === projA?.priority)?.order ?? 3;
            const priorityB = PRIORITY_OPTIONS.find(p => p.id === projB?.priority)?.order ?? 3;
            if (priorityA !== priorityB) return priorityA - priorityB;
            // 같은 우선순위면 기존 order로
            return a.order - b.order;
          });
      }, [myTasks, selectedDate, searchQuery, selectedProject, parentIdsWithSubtasksToday, projects]);
      
      // 서브태스크 가져오기 - 해당 날짜만 (표시용)
      const getSubtasks = (parentId) => {
        return myTasks.filter(t => t.parentTaskId === parentId && t.date === selectedDate);
      };
      
      // 전체 서브태스크 가져오기 (진행률 계산용)
      const getAllSubtasks = (parentId) => {
        return myTasks.filter(t => t.parentTaskId === parentId);
      };
      
      // 전체 업무 (이전 호환성)
      const filteredTasks = useMemo(() => {
        return myTasks
          .filter(t => t.date === selectedDate)
          .filter(t => !searchQuery || t.title.toLowerCase().includes(searchQuery.toLowerCase()))
          .filter(t => selectedProject === null || t.projectId === selectedProject || (selectedProject === 0 && !t.projectId))
          .sort((a, b) => a.order - b.order);
      }, [myTasks, selectedDate, searchQuery, selectedProject]);
      const taskCountByDate = useMemo(() => { const c = {}; myTasks.forEach(t => { c[t.date] = (c[t.date] || 0) + 1; }); return c; }, [myTasks]);
      
      // 주/월 시작일 계산 헬퍼
      const getWeekStart = (dateStr) => {
        const d = new Date(dateStr);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        return formatDate(new Date(d.setDate(diff)));
      };
      const getMonthStart = (dateStr) => dateStr.slice(0, 7) + '-01';
      const getCompletionKey = (routineType, dateStr) => {
        if (routineType === 'weekly') return getWeekStart(dateStr);
        if (routineType === 'monthly') return getMonthStart(dateStr);
        return dateStr;
      };
      
      const stats = useMemo(() => { 
        const dt = myTasks.filter(t => t.date === selectedDate); 
        const comp = dt.filter(t => t.completed).length;
        // 일일 루틴만 진행률에 포함
        const dailyRoutines = fixedTasks.filter(t => t.routineType === 'daily');
        const dailyComp = dailyRoutines.filter(t => (t.completedDates || []).includes(selectedDate)).length;
        const total = dt.length + dailyRoutines.length;
        const totalComp = comp + dailyComp;
        return { total, completed: totalComp, rate: total > 0 ? Math.round((totalComp / total) * 100) : 0 }; 
      }, [myTasks, selectedDate, fixedTasks]);

      const moveMonth = (dir) => setCurrentMonth(prev => { let m = prev.month + (dir === 'prev' ? -1 : 1), y = prev.year; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } return { year: y, month: m }; });
      const toggleComplete = (id) => {
        setTasks(prev => {
          const task = prev.find(t => t.id === id);
          if (!task) return prev;
          
          const newCompleted = !task.completed;
          
          // 하위업무인 경우 (parentTaskId가 없는 업무)
          if (!task.parentTaskId) {
            // 서브태스크들 찾기
            const subtasks = prev.filter(t => t.parentTaskId === id);
            
            if (subtasks.length > 0) {
              // 하위업무 체크 → 모든 서브태스크도 같이 체크/해제
              return prev.map(t => {
                if (t.id === id) return { ...t, completed: newCompleted };
                if (t.parentTaskId === id) return { ...t, completed: newCompleted };
                return t;
              });
            }
          }
          
          // 서브태스크인 경우 (parentTaskId가 있는 업무)
          if (task.parentTaskId) {
            const updated = prev.map(t => t.id === id ? { ...t, completed: newCompleted } : t);
            
            // 모든 서브태스크가 완료되었는지 확인
            const siblings = updated.filter(t => t.parentTaskId === task.parentTaskId);
            const allCompleted = siblings.every(t => t.completed);
            
            // 부모 하위업무도 업데이트
            return updated.map(t => {
              if (t.id === task.parentTaskId) {
                return { ...t, completed: allCompleted };
              }
              return t;
            });
          }
          
          // 일반 업무 (서브태스크 없는 하위업무)
          return prev.map(t => t.id === id ? { ...t, completed: newCompleted } : t);
        });
      };
      const toggleBookmark = (id) => setTasks(prev => prev.map(t => t.id === id ? { ...t, bookmark: !t.bookmark } : t));
      // 휴지통으로 이동 (deletedAt 추가)
      const deleteTask = (id) => setTasks(prev => prev.map(t => 
        (t.id === id || t.parentTaskId === id) ? { ...t, deletedAt: Date.now() } : t
      ));
      const requestDeleteTask = (task) => setConfirmDelete({ type: 'task', id: task.id, title: task.title });
      const addTask = (task) => { 
        const dt = tasks.filter(t => t.date === task.date && t.memberId === currentUser.id); 
        const mx = Math.max(...dt.map(t => t.order), -1); 
        const parentId = Date.now();
        const { newSubtasks, updatedSubtasks, ...taskData } = task;
        
        // 메인 업무 추가
        const newTask = { ...taskData, id: parentId, memberId: currentUser.id, order: mx + 1, completed: false, bookmark: task.bookmark || false, note: task.note || '' };
        
        // 하위업무가 있으면 함께 추가
        if (newSubtasks && newSubtasks.length > 0) {
          const subtasksToAdd = newSubtasks.map((st, idx) => ({
            id: parentId + idx + 1,
            parentTaskId: parentId,
            title: st.title,
            projectId: task.projectId,
            date: task.date,
            memberId: currentUser.id,
            order: idx,
            completed: false,
            bookmark: false,
            note: ''
          }));
          setTasks(prev => [...prev, newTask, ...subtasksToAdd]);
        } else {
          setTasks(prev => [...prev, newTask]);
        }
      };
      const updateTask = (task) => {
        const { newSubtasks, updatedSubtasks, ...taskData } = task;
        
        setTasks(prev => {
          let updated = prev.map(t => t.id === task.id ? { ...t, ...taskData } : t);
          
          // 기존 하위업무 업데이트
          if (updatedSubtasks && updatedSubtasks.length > 0) {
            updatedSubtasks.forEach(st => {
              updated = updated.map(t => t.id === st.id ? { ...t, title: st.title } : t);
            });
          }
          
          // 새 하위업무 추가
          if (newSubtasks && newSubtasks.length > 0) {
            const newSubtasksToAdd = newSubtasks.map((st, idx) => ({
              id: Date.now() + idx + 1,
              parentTaskId: task.id,
              title: st.title,
              projectId: task.projectId,
              date: task.date,
              memberId: currentUser.id,
              order: idx,
              completed: false,
              bookmark: false,
              note: ''
            }));
            updated = [...updated, ...newSubtasksToAdd];
          }
          
          return updated;
        });
      };
      const updateTaskFields = (id, fields) => {
        setTasks(prev => prev.map(t => t.id === id ? { ...t, ...fields } : t));
        setSelectedTaskForNote(prev => prev ? { ...prev, ...fields } : null);
      };
      
      // 고정업무 핸들러
      const addFixedTask = (task) => {
        setFixedTasks(prev => [...prev, { ...task, id: Date.now(), completedDates: [], memberId: currentUser.id }]);
      };
      const toggleFixedComplete = (id, routineType) => {
        const completionKey = getCompletionKey(routineType, selectedDate);
        setFixedTasks(prev => prev.map(t => {
          if (t.id !== id) return t;
          const isCompleted = (t.completedDates || []).includes(completionKey);
          return {
            ...t,
            completedDates: isCompleted 
              ? (t.completedDates || []).filter(d => d !== completionKey)
              : [...(t.completedDates || []), completionKey]
          };
        }));
      };
      // 휴지통으로 이동 (deletedAt 추가)
      const deleteFixedTask = (id) => {
        setFixedTasks(prev => prev.map(t => t.id === id ? { ...t, deletedAt: Date.now() } : t));
      };
      const requestDeleteFixedTask = (task) => setConfirmDelete({ type: 'fixedTask', id: task.id, title: task.title });
      
      // 삭제 확인 처리
      const handleConfirmDelete = () => {
        if (confirmDelete) {
          if (confirmDelete.type === 'task') {
            deleteTask(confirmDelete.id);
          } else if (confirmDelete.type === 'fixedTask') {
            deleteFixedTask(confirmDelete.id);
          }
          setConfirmDelete(null);
        }
      };
      
      // 루틴 타입별 필터링
      const getFilteredRoutineTasks = (type) => {
        return fixedTasks.filter(t => 
          t.routineType === type &&
          (!searchQuery || t.title.toLowerCase().includes(searchQuery.toLowerCase())) &&
          (selectedProject === null || t.projectId === selectedProject || (selectedProject === 0 && !t.projectId))
        );
      };
      const dailyTasks = useMemo(() => getFilteredRoutineTasks('daily'), [fixedTasks, searchQuery, selectedProject]);
      const weeklyTasks = useMemo(() => getFilteredRoutineTasks('weekly'), [fixedTasks, searchQuery, selectedProject]);
      const monthlyTasks = useMemo(() => getFilteredRoutineTasks('monthly'), [fixedTasks, searchQuery, selectedProject]);
      
      // 루틴 타입별 완료 카운트
      const getRoutineStats = (type) => {
        const tasks = fixedTasks.filter(t => t.routineType === type);
        const completionKey = getCompletionKey(type, selectedDate);
        const comp = tasks.filter(t => (t.completedDates || []).includes(completionKey)).length;
        return { total: tasks.length, completed: comp };
      };
      const isRoutineCompleted = (task) => {
        const completionKey = getCompletionKey(task.routineType, selectedDate);
        return (task.completedDates || []).includes(completionKey);
      };

      // 드래그 앤 드롭 핸들러
      const handleDragStart = (e, task) => {
        setDraggedTask(task);
        e.dataTransfer.effectAllowed = 'move';
      };
      const handleDragOver = (e, task) => {
        e.preventDefault();
        if (!draggedTask || draggedTask.id === task.id) return;
        setDragOverId(task.id);
      };
      const handleDragLeave = () => setDragOverId(null);
      const handleDrop = (e, targetTask) => {
        e.preventDefault();
        setDragOverId(null);
        if (!draggedTask || draggedTask.id === targetTask.id) return;
        
        const newTasks = [...filteredTasks];
        const dragIdx = newTasks.findIndex(t => t.id === draggedTask.id);
        const targetIdx = newTasks.findIndex(t => t.id === targetTask.id);
        
        newTasks.splice(dragIdx, 1);
        newTasks.splice(targetIdx, 0, draggedTask);
        
        const updates = newTasks.map((t, i) => ({ id: t.id, order: i }));
        setTasks(prev => prev.map(t => {
          const update = updates.find(u => u.id === t.id);
          return update ? { ...t, order: update.order } : t;
        }));
        setDraggedTask(null);
      };
      const handleDragEnd = () => { setDraggedTask(null); setDragOverId(null); };

      const PROJECT_FILTERS = [
        { id: null, name: '전체' },
        ...BRANDS,
        { id: 0, name: '기타 업무', color: '#8B95A1' },
      ];

      return (
        <div style={{ display: 'flex', flexDirection: 'column', height: '100vh' }}>
          {/* 상단 헤더 - 탭 버튼 */}
          <header style={{ background: 'white', borderBottom: '1px solid #E5E8EB', padding: '20px 32px', display: 'flex', alignItems: 'center', gap: 20 }}>
            <h1 style={{ fontSize: 24, fontWeight: 700, color: '#191F28' }}>업무일지</h1>
            <div style={{ display: 'flex', gap: 8 }}>
              <button 
                onClick={() => setViewMode('worklog')}
                style={{ 
                  display: 'flex', alignItems: 'center', gap: 6,
                  padding: '10px 18px', borderRadius: 10, 
                  border: viewMode === 'worklog' ? '2px solid #3182F6' : '1px solid #E5E8EB',
                  background: viewMode === 'worklog' ? '#EBF4FF' : 'white', 
                  color: viewMode === 'worklog' ? '#3182F6' : '#6B7684',
                  fontSize: 14, fontWeight: 600, cursor: 'pointer'
                }}
              >
                <Icon name="clipboard" size={18} color={viewMode === 'worklog' ? '#3182F6' : '#8B95A1'} />
                업무일지
              </button>
              <button 
                onClick={() => setViewMode('calendar')}
                style={{ 
                  display: 'flex', alignItems: 'center', gap: 6,
                  padding: '10px 18px', borderRadius: 10, 
                  border: viewMode === 'calendar' ? '2px solid #3182F6' : '1px solid #E5E8EB',
                  background: viewMode === 'calendar' ? '#EBF4FF' : 'white', 
                  color: viewMode === 'calendar' ? '#3182F6' : '#6B7684',
                  fontSize: 14, fontWeight: 600, cursor: 'pointer'
                }}
              >
                <Icon name="calendar" size={18} color={viewMode === 'calendar' ? '#3182F6' : '#8B95A1'} />
                캘린더
              </button>
            </div>
          </header>
          
          {/* 업무일지 뷰 */}
          {viewMode === 'worklog' && (
          <div style={{ display: 'flex', flex: 1, overflow: 'hidden' }}>
          {/* 왼쪽 사이드바 - 캘린더 + 진행률 */}
          <div style={{ width: 320, background: 'white', borderRight: '1px solid #E5E8EB', padding: 20, overflow: 'auto' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
              <button onClick={() => moveMonth('prev')} style={{ width: 32, height: 32, borderRadius: 8, border: '1px solid #E5E8EB', background: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icon name="chevronLeft" size={18} color="#6B7684" /></button>
              <h3 style={{ fontSize: 16, fontWeight: 700, color: '#191F28' }}>{currentMonth.year}년 {currentMonth.month + 1}월</h3>
              <button onClick={() => moveMonth('next')} style={{ width: 32, height: 32, borderRadius: 8, border: '1px solid #E5E8EB', background: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icon name="chevronRight" size={18} color="#6B7684" /></button>
            </div>

            <div style={{ marginBottom: 24 }}>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 2, marginBottom: 8 }}>
                {['일', '월', '화', '수', '목', '금', '토'].map((d, i) => <div key={d} style={{ textAlign: 'center', fontSize: 12, fontWeight: 500, color: i === 0 || i === 6 ? '#F04452' : '#8B95A1', padding: '4px 0' }}>{d}</div>)}
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 2 }}>
                {monthDates.map(({ date, isCurrentMonth, day }, idx) => {
                  const isSelected = date === selectedDate, isToday = date === today, hasTask = taskCountByDate[date] > 0, dow = idx % 7;
                  return (
                    <button key={date} onClick={() => setSelectedDate(date)} style={{ aspectRatio: '1', borderRadius: 8, border: 'none', background: isSelected ? '#3182F6' : isToday ? '#EBF4FF' : 'transparent', color: isSelected ? 'white' : !isCurrentMonth ? '#D1D6DB' : (dow === 0 || dow === 6) ? '#F04452' : '#191F28', fontSize: 14, fontWeight: isSelected || isToday ? 600 : 400, position: 'relative', cursor: 'pointer' }}>
                      {day}
                      {hasTask && !isSelected && <div style={{ position: 'absolute', bottom: 4, left: '50%', transform: 'translateX(-50%)', width: 4, height: 4, borderRadius: '50%', background: '#3182F6' }} />}
                    </button>
                  );
                })}
              </div>
            </div>

            <div style={{ background: '#F7F8FA', borderRadius: 12, padding: 16 }}>
              <h4 style={{ fontSize: 13, fontWeight: 600, color: '#6B7684', marginBottom: 12 }}>오늘의 진행률</h4>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
                <span style={{ fontSize: 24, fontWeight: 700, color: '#191F28' }}>{stats.rate}%</span>
                <span style={{ fontSize: 14, color: '#6B7684' }}>{stats.completed}/{stats.total} 완료</span>
              </div>
              <div style={{ height: 8, background: '#E5E8EB', borderRadius: 4, overflow: 'hidden' }}>
                <div style={{ height: '100%', background: stats.rate === 100 ? '#00C471' : '#3182F6', width: `${stats.rate}%`, transition: 'width 0.3s' }} />
              </div>
            </div>

            {/* 오늘의 한마디 메모 */}
            <DailyMemo selectedDate={selectedDate} currentUser={currentUser} />

            {/* 고정 메모 */}
            <FixedMemo currentUser={currentUser} />
          </div>

          {/* 오른쪽 - 업무 리스트 */}
          <div style={{ flex: 1, overflow: 'auto', background: '#F7F8FA' }}>
            {/* 상단 날짜 + 필터 바 */}
            <div style={{ background: 'white', borderBottom: '1px solid #E5E8EB', padding: '16px 24px' }}>
              {/* 날짜 표시 */}
              <div style={{ marginBottom: 16 }}>
                <h2 style={{ fontSize: 22, fontWeight: 700, color: '#191F28' }}>
                  {(() => {
                    const d = new Date(selectedDate);
                    const days = ['일', '월', '화', '수', '목', '금', '토'];
                    const isToday = selectedDate === today;
                    return (
                      <>
                        {d.getMonth() + 1}월 {d.getDate()}일 ({days[d.getDay()]})
                        {isToday && <span style={{ marginLeft: 8, padding: '4px 10px', borderRadius: 6, background: '#3182F6', color: 'white', fontSize: 12, fontWeight: 600 }}>오늘</span>}
                      </>
                    );
                  })()}
                </h2>
              </div>
              
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, background: '#F7F8FA', borderRadius: 10, padding: '0 14px', width: 240 }}>
                  <Icon name="search" size={18} color="#8B95A1" />
                  <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="업무 검색" style={{ flex: 1, border: 'none', background: 'transparent', padding: '10px 0', fontSize: 14, color: '#191F28' }} />
                </div>
              </div>
            </div>

            {/* 루틴 업무 섹션 - 가로 3열 배치 */}
            <div style={{ padding: '24px 24px 0 24px' }}>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 16 }}>
                {/* 일일 루틴 */}
                <RoutineSection 
                  title="일일 루틴" 
                  type="daily"
                  icon="☀️"
                  bgColor="#FEF3C7"
                  borderColor="#FDE68A"
                  textColor="#92400E"
                  buttonColor="#F59E0B"
                  tasks={dailyTasks}
                  stats={getRoutineStats('daily')}
                  isCompleted={isRoutineCompleted}
                  onToggle={(id) => toggleFixedComplete(id, 'daily')}
                  onDelete={requestDeleteFixedTask}
                  onAdd={() => { setAddRoutineType('daily'); setShowAddFixedModal(true); }}
                  onItemClick={(task) => setCalendarSelectedRoutine({ ...task, date: selectedDate })}
                />
                
                {/* 주간 루틴 */}
                <RoutineSection 
                  title="주간 루틴" 
                  type="weekly"
                  icon="📅"
                  bgColor="#DBEAFE"
                  borderColor="#93C5FD"
                  textColor="#1E40AF"
                  buttonColor="#3B82F6"
                  tasks={weeklyTasks}
                  stats={getRoutineStats('weekly')}
                  isCompleted={isRoutineCompleted}
                  onToggle={(id) => toggleFixedComplete(id, 'weekly')}
                  onDelete={requestDeleteFixedTask}
                  onAdd={() => { setAddRoutineType('weekly'); setShowAddFixedModal(true); }}
                  onItemClick={(task) => setCalendarSelectedRoutine({ ...task, date: selectedDate })}
                />
                
                {/* 월간 루틴 */}
                <RoutineSection 
                  title="월간 루틴" 
                  type="monthly"
                  icon="📆"
                  bgColor="#F3E8FF"
                  borderColor="#D8B4FE"
                  textColor="#6B21A8"
                  buttonColor="#9333EA"
                  tasks={monthlyTasks}
                  stats={getRoutineStats('monthly')}
                  isCompleted={isRoutineCompleted}
                  onToggle={(id) => toggleFixedComplete(id, 'monthly')}
                  onDelete={requestDeleteFixedTask}
                  onAdd={() => { setAddRoutineType('monthly'); setShowAddFixedModal(true); }}
                  onItemClick={(task) => setCalendarSelectedRoutine({ ...task, date: selectedDate })}
                />
              </div>
            </div>

            {/* 타팀요청 업무 섹션 */}
            {(() => {
              const myTeamRequests = teamRequests.filter(r => 
                r.assigneeId === currentUser.id && 
                (r.status === 'pending' || r.status === 'progress')
              );
              if (myTeamRequests.length === 0) return null;
              
              return (
                <div style={{ padding: '0 24px 24px 24px' }}>
                  <div style={{ background: '#FFF7ED', border: '1px solid #FDBA74', borderRadius: 12, padding: 16 }}>
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <span style={{ fontSize: 18 }}>📨</span>
                        <h3 style={{ fontSize: 15, fontWeight: 700, color: '#9A3412' }}>타팀요청 업무</h3>
                        <span style={{ padding: '2px 8px', borderRadius: 10, background: '#FB923C', color: 'white', fontSize: 12, fontWeight: 700 }}>{myTeamRequests.length}</span>
                      </div>
                    </div>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                      {myTeamRequests.map(req => {
                        const team = REQUEST_TEAMS.find(t => t.id === req.requestTeam);
                        const dday = (() => {
                          if (!req.dueDate) return null;
                          const today = new Date(); today.setHours(0,0,0,0);
                          const due = new Date(req.dueDate); due.setHours(0,0,0,0);
                          const diff = Math.ceil((due - today) / (1000*60*60*24));
                          if (diff < 0) return `D+${Math.abs(diff)}`;
                          if (diff === 0) return 'D-Day';
                          return `D-${diff}`;
                        })();
                        const isUrgent = req.dueDate && (() => {
                          const today = new Date(); today.setHours(0,0,0,0);
                          const due = new Date(req.dueDate); due.setHours(0,0,0,0);
                          return Math.ceil((due - today) / (1000*60*60*24)) <= 2;
                        })();
                        return (
                          <div 
                            key={req.id} 
                            style={{ 
                              display: 'flex', alignItems: 'center', gap: 12, padding: '12px 14px', 
                              background: 'white', borderRadius: 10, 
                              border: isUrgent ? '2px solid #F04452' : '1px solid #FED7AA'
                            }}
                          >
                            <button
                              onClick={() => {
                                setTeamRequests(prev => prev.map(r => 
                                  r.id === req.id ? { ...r, status: 'complete', completedAt: formatDate(new Date()) } : r
                                ));
                              }}
                              style={{ 
                                width: 24, height: 24, borderRadius: 6, 
                                border: '2px solid #FB923C', background: 'white',
                                cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
                                flexShrink: 0
                              }}
                            >
                              <Icon name="check" size={14} color="#FB923C" />
                            </button>
                            <div style={{ flex: 1, minWidth: 0 }}>
                              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
                                <span style={{ padding: '2px 8px', borderRadius: 4, background: team?.color + '20', color: team?.color, fontSize: 11, fontWeight: 600 }}>
                                  {team?.name}
                                </span>
                                <span style={{ 
                                  padding: '2px 8px', borderRadius: 4, fontSize: 11, fontWeight: 600,
                                  background: req.status === 'progress' ? '#EBF4FF' : '#F2F3F5',
                                  color: req.status === 'progress' ? '#3182F6' : '#6B7684'
                                }}>
                                  {req.status === 'progress' ? '진행중' : '대기중'}
                                </span>
                              </div>
                              <p style={{ fontSize: 14, fontWeight: 500, color: '#191F28', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                                {req.title}
                              </p>
                            </div>
                            {dday && (
                              <span style={{ 
                                fontSize: 12, fontWeight: 700, 
                                color: isUrgent ? '#F04452' : '#FB923C',
                                flexShrink: 0
                              }}>
                                {dday}
                              </span>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              );
            })()}

            {/* 테이블 */}
            <div style={{ padding: 24 }}>
              <div style={{ background: 'white', borderRadius: 16, border: '1px solid #E5E8EB', overflow: 'hidden' }}>
                <div style={{ display: 'grid', gridTemplateColumns: '32px 44px 1fr 50px 120px 44px 44px 44px', alignItems: 'center', padding: '12px 20px', borderBottom: '1px solid #E5E8EB', background: '#FAFBFC' }}>
                  <div></div>
                  <div></div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: '#6B7684' }}>업무</div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: '#6B7684', textAlign: 'center' }}>우선</div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: '#6B7684', textAlign: 'center' }}>브랜드</div>
                  <div style={{ gridColumn: 'span 3', display: 'flex', justifyContent: 'flex-end' }}>
                    <button onClick={() => { setEditingTask(null); setShowAddModal(true); }} style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '8px 16px', borderRadius: 8, background: '#3182F6', border: 'none', color: 'white', fontSize: 14, fontWeight: 600, cursor: 'pointer' }}>
                      <Icon name="plus" size={16} color="white" /> 업무 추가
                    </button>
                  </div>
                </div>

                {parentTasks.length === 0 ? (
                  <div style={{ padding: '60px 20px', textAlign: 'center' }}>
                    <Icon name="clipboard" size={48} color="#D1D6DB" />
                    <p style={{ fontSize: 16, color: '#8B95A1', marginTop: 16 }}>등록된 업무가 없습니다</p>
                  </div>
                ) : (
                  parentTasks.map((task, idx) => {
                    const project = projects.find(p => p.id === task.projectId);
                    const proj = project ? BRANDS.find(b => b.id === project.brandId) : BRANDS.find(p => p.id === task.projectId);
                    const isDragging = draggedTask?.id === task.id;
                    const isDragOver = dragOverId === task.id;
                    const subtasks = getSubtasks(task.id); // 해당 날짜 서브태스크 (표시용)
                    const allSubtasks = getAllSubtasks(task.id); // 전체 서브태스크 (진행률용)
                    const hasSubtasks = subtasks.length > 0; // 오늘 표시할 서브태스크가 있는지
                    const hasAnySubtasks = allSubtasks.length > 0; // 전체 서브태스크가 있는지
                    return (
                      <div key={task.id}>
                        {/* 부모 업무 */}
                        <div
                          className="task-row"
                          draggable
                          onDragStart={(e) => handleDragStart(e, task)}
                          onDragOver={(e) => handleDragOver(e, task)}
                          onDragLeave={handleDragLeave}
                          onDrop={(e) => handleDrop(e, task)}
                          onDragEnd={handleDragEnd}
                          style={{
                            display: 'grid',
                            gridTemplateColumns: '32px 44px 1fr 50px 120px 44px 44px 44px',
                            alignItems: 'center',
                            padding: '14px 20px',
                            borderBottom: !hasSubtasks && idx < parentTasks.length - 1 ? '1px solid #F2F3F5' : 'none',
                            background: isDragOver ? '#EBF4FF' : isDragging ? '#F7F8FA' : 'white',
                            opacity: isDragging ? 0.6 : 1,
                            borderTop: isDragOver ? '2px solid #3182F6' : 'none',
                          }}
                        >
                          <div style={{ display: 'flex', justifyContent: 'center', cursor: 'grab' }}>
                            <Icon name="grip" size={16} color="#D1D6DB" />
                          </div>

                          {/* 하위업무 체크박스 */}
                          <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', gap: 4 }}>
                            <button onClick={(e) => { e.stopPropagation(); toggleComplete(task.id); }} style={{ width: 22, height: 22, borderRadius: 6, border: task.completed ? 'none' : '2px solid #D1D6DB', background: task.completed ? '#3182F6' : 'white', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                              {task.completed && <Icon name="check" size={14} color="white" />}
                            </button>
                          </div>

                          <div onClick={() => setSelectedTaskForNote(task)} style={{ cursor: 'pointer', padding: '4px 0' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                              {project && <span style={{ fontSize: 13, color: '#8B95A1' }}>{project.title}_</span>}
                              <span style={{ fontSize: 15, fontWeight: 500, color: task.completed ? '#8B95A1' : '#191F28', textDecoration: task.completed ? 'line-through' : 'none' }}>{task.title}</span>
                              {hasAnySubtasks && <span style={{ fontSize: 11, padding: '2px 6px', borderRadius: 4, background: '#F0F7FF', color: '#3182F6', fontWeight: 600 }}>{allSubtasks.filter(s => s.completed).length}/{allSubtasks.length}</span>}
                              {task.bookmark && <Icon name="bookmarkFill" size={14} color="#F59E0B" />}
                              {task.note && <Icon name="fileText" size={14} color="#3182F6" />}
                              {task.note && <span style={{ fontSize: 13, color: '#8B95A1', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: 200 }}>{task.note.split('\n')[0]}</span>}
                            </div>
                          </div>

                          {/* 우선순위 */}
                          <div style={{ display: 'flex', justifyContent: 'center', position: 'relative' }}>
                            {project ? (() => {
                              const priority = PRIORITY_OPTIONS.find(p => p.id === project.priority) || PRIORITY_OPTIONS.find(p => p.id === 'none');
                              return (
                                <>
                                  <button
