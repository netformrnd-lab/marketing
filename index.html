    const formatDate = (date) => {
      const d = new Date(date);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    const formatShortDate = (dateStr) => {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      return `${d.getMonth() + 1}월 ${d.getDate()}일`;
    };

    const formatDateTime = (dateStr) => {
      const d = new Date(dateStr);
      const now = new Date();
      const diffMs = now - d;
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMs / 3600000);
      const diffDays = Math.floor(diffMs / 86400000);
      if (diffMins < 1) return '방금 전';
      if (diffMins < 60) return `${diffMins}분 전`;
      if (diffHours < 24) return `${diffHours}시간 전`;
      if (diffDays < 7) return `${diffDays}일 전`;
      return `${d.getMonth() + 1}/${d.getDate()}`;
    };

    const getMonthDates = (year, month) => {
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const startPadding = firstDay.getDay(); // 일요일 시작 (0=일, 1=월, ...)
      const dates = [];
      for (let i = startPadding - 1; i >= 0; i--) {
        const d = new Date(year, month, -i);
        dates.push({ date: formatDate(d), isCurrentMonth: false, day: d.getDate() });
      }
      for (let i = 1; i <= lastDay.getDate(); i++) {
        const d = new Date(year, month, i);
        dates.push({ date: formatDate(d), isCurrentMonth: true, day: d.getDate() });
      }
      const remaining = 42 - dates.length;
      for (let i = 1; i <= remaining; i++) {
        const d = new Date(year, month + 1, i);
        dates.push({ date: formatDate(d), isCurrentMonth: false, day: d.getDate() });
      }
      return dates;
    };

    const FirebaseService = {
      // 컬렉션에서 모든 데이터 가져오기
      async getAll(collection) {
        try {
          const snapshot = await database.ref(collection).once('value');
          const data = snapshot.val();
          if (!data) return []; // 데이터가 없는 경우만 빈 배열
          // 객체를 배열로 변환
          return Object.keys(data).map(key => ({
            id: Number(key) || key,
            ...data[key]
          }));
        } catch (error) {
          console.error(`Error getting ${collection}:`, error);
          return null; // 에러 시 null 반환 (빈 배열과 구분)
        }
      },
      
      // 문서 저장 (upsert)
      async save(collection, id, data) {
        try {
          await database.ref(`${collection}/${id}`).set(data);
        } catch (error) {
          console.error(`Error saving to ${collection}:`, error);
        }
      },

        try {
          await database.ref(`${collection}/${id}`).remove();
        } catch (error) {
          console.error(`Error deleting from ${collection}:`, error);
        }
      },

      async syncCollection(collection, items) {
        try {
          const dataObj = {};
          items.forEach(item => {
            dataObj[item.id] = item;
          });
          await database.ref(collection).set(dataObj);

          console.error(`Error syncing ${collection}:`, error);
        }
      },
      
      // 단일 문서 저장 (settings 등)
      async saveDoc(collection, docId, data) {
        try {
          await database.ref(`${collection}/${docId}`).set(data);
        } catch (error) {
          console.error(`Error saving doc:`, error);
        }
      },
      
      // 단일 문서 가져오기
      async getDoc(collection, docId) {
        try {
          const snapshot = await database.ref(`${collection}/${docId}`).once('value');
          return snapshot.val();
        } catch (error) {
          console.error(`Error getting doc:`, error);
          return null;
        }
      },
      
      // 실시간 리스너 등록
      onDataChange(collection, callback) {
        const ref = database.ref(collection);
        ref.on('value', (snapshot) => {
          const data = snapshot.val();
          if (!data) {
            callback([]);
            return;
          }
          const items = Object.keys(data).map(key => ({
            id: Number(key) || key,
            ...data[key]
          }));
          callback(items);
        });
        // 리스너 해제 함수 반환
        return () => ref.off('value');
      },
      
      // 파일 업로드
      async uploadFile(file, path, onProgress) {
        try {
          const ref = storage.ref().child(path);
          const uploadTask = ref.put(file);
          
          return new Promise((resolve, reject) => {
            // 30초 타임아웃
            const timeout = setTimeout(() => {
              uploadTask.cancel();
              reject(new Error('업로드 시간 초과'));
            }, 30000);
            
            uploadTask.on('state_changed',
              (snapshot) => {
                const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                if (onProgress) onProgress(progress);
                console.log('Upload progress:', progress.toFixed(1) + '%');
              },
              (error) => {
                clearTimeout(timeout);
                console.error('Upload error:', error);
                reject(error);
              },
              async () => {
                clearTimeout(timeout);
                const url = await uploadTask.snapshot.ref.getDownloadURL();
                resolve({ url, name: file.name, size: file.size, type: file.type });
              }
            );
          });
        } catch (error) {
          console.error('Error uploading file:', error);
          return null;
        }
      },
      
      // 파일 삭제
      async deleteFile(path) {
        try {
          await storage.ref().child(path).delete();
        } catch (error) {
          console.error('Error deleting file:', error);
        }
      }
    };

                <div style={{ flex: 1 }}>
                  <p style={{ fontSize: 14, fontWeight: 600, color: 'white' }}>{currentUser.name}</p>

            </div>
            <div style={{ flex: 1, display: activeTab === 'project' ? 'flex' : 'none', flexDirection: 'column' }}>

            <div style={{ flex: 1, display: activeTab === 'calendar' ? 'flex' : 'none', flexDirection: 'column' }}>
              <CalendarTab tasks={tasks.filter(t => !t.deletedAt)} setTasks={setTasks} projects={projects.filter(p => !p.deletedAt)} currentUser={currentUser} />

            <div style={{ flex: 1, display: activeTab === 'growthboard' ? 'flex' : 'none', flexDirection: 'column' }}>
              <GrowthBoardTab tasks={tasks.filter(t => !t.deletedAt)} projects={projects.filter(p => !p.deletedAt)} currentUser={currentUser} />

            <div style={{ flex: 1, display: activeTab === 'kpi' ? 'flex' : 'none', flexDirection: 'column' }}>
              <PlaceholderTab title="팀 KPI/목표" icon="🎯" description="팀의 KPI와 목표를 설정하고 관리합니다" />

            </div>
            <div style={{ flex: 1, display: activeTab === 'onboarding' ? 'flex' : 'none', flexDirection: 'column' }}>
              <PlaceholderTab title="온보딩/매뉴얼" icon="📚" description="신입사원 온보딩 자료와 업무 매뉴얼을 관리합니다" />
            </div>
            <div style={{ flex: 1, display: activeTab === 'meeting' ? 'flex' : 'none', flexDirection: 'column' }}>

                setMeetings={setMeetings}
                projects={projects}
                currentUser={currentUser}

            <div style={{ flex: 1, display: activeTab === 'drive' ? 'flex' : 'none', flexDirection: 'column' }}>

            <div style={{ flex: 1, display: activeTab === 'payment' ? 'flex' : 'none', flexDirection: 'column' }}>
              <PlaceholderTab title="결제 주기 체크" icon="💳" description="정기 결제 일정을 관리합니다" />
            </div>
            <div style={{ flex: 1, display: activeTab === 'vendor' ? 'flex' : 'none', flexDirection: 'column' }}>
              <PlaceholderTab title="업체 관리" icon="🏢" description="협력 업체 정보를 관리합니다" />

              <TrashTab 
                tasks={tasks} setTasks={setTasks} 
                projects={projects} setProjects={setProjects}

              />
            </div>
          </main>
        </div>
      );
    }

    // ============ 템플릿 관리 탭 ============
    function TemplateManageTab({ templates, onSave, lastModified, currentUser }) {
      const [editingTemplate, setEditingTemplate] = useState(null);
      const [showAddModal, setShowAddModal] = useState(false);
      const [confirmDelete, setConfirmDelete] = useState(null);
      
      // 새 템플릿 추가
      const handleAddTemplate = (template) => {
        const newTemplate = {
          id: `template_${Date.now()}`,
          name: template.name,
          color: template.color || '#3182F6',
          brandId: template.brandId || null,
          tasks: template.tasks || []
        };
        onSave([...templates, newTemplate]);
        setShowAddModal(false);
      };
      
      // 템플릿 수정
      const handleUpdateTemplate = (updatedTemplate) => {
        onSave(templates.map(t => t.id === updatedTemplate.id ? updatedTemplate : t));
        setEditingTemplate(null);
      };
      
      // 템플릿 삭제
      const handleDeleteTemplate = (templateId) => {
        onSave(templates.filter(t => t.id !== templateId));
        setConfirmDelete(null);
      };
      
      const lastModifiedUser = lastModified.by ? TEAM_MEMBERS.find(m => m.id === lastModified.by) : null;
      
      return (
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', background: '#F7F8FA' }}>
          {/* 헤더 */}
          <header style={{ background: 'white', padding: '20px 32px', borderBottom: '1px solid #E5E8EB' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <div>
                <h1 style={{ fontSize: 20, fontWeight: 700, color: '#191F28', marginBottom: 4 }}>📋 업무 템플릿 관리</h1>
                {lastModifiedUser && (
                  <p style={{ fontSize: 13, color: '#8B95A1' }}>
                    마지막 수정: {lastModifiedUser.name} ({new Date(lastModified.at).toLocaleDateString('ko-KR')} {new Date(lastModified.at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })})
                  </p>
                )}
              </div>
              <button 
                onClick={() => setShowAddModal(true)}
                style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '10px 16px', borderRadius: 8, background: '#3182F6', border: 'none', color: 'white', fontSize: 14, fontWeight: 600, cursor: 'pointer' }}
              >
                <Icon name="plus" size={18} color="white" /> 새 템플릿
              </button>
            </div>
          </header>
          
          {/* 템플릿 목록 */}
          <div style={{ flex: 1, padding: 32, overflowY: 'auto' }}>
            {templates.length === 0 ? (
              <div style={{ background: 'white', borderRadius: 16, padding: '60px 40px', textAlign: 'center', border: '1px dashed #D1D6DB' }}>
                <Icon name="file" size={48} color="#D1D6DB" />
                <p style={{ fontSize: 15, color: '#8B95A1', marginTop: 16 }}>등록된 템플릿이 없습니다</p>
                <button 
                  onClick={() => setShowAddModal(true)}
                  style={{ marginTop: 16, padding: '10px 20px', borderRadius: 8, background: '#3182F6', border: 'none', color: 'white', fontSize: 14, fontWeight: 600, cursor: 'pointer' }}
                >
                  첫 템플릿 만들기
                </button>
              </div>
            ) : (
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(350px, 1fr))', gap: 20 }}>
                {templates.map(template => {
                  const templateBrand = template.brandId ? BRANDS.find(b => b.id === template.brandId) : null;
                  return (
                  <div key={template.id} style={{ background: 'white', borderRadius: 16, border: '1px solid #E5E8EB', overflow: 'hidden' }}>
                    {/* 템플릿 헤더 */}
                    <div style={{ padding: '16px 20px', borderBottom: '1px solid #F2F3F5', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                        <div style={{ width: 36, height: 36, borderRadius: 10, background: template.color + '20', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                          <span style={{ fontSize: 18 }}>📋</span>
                        </div>
                        <div>
                          <span style={{ fontSize: 16, fontWeight: 700, color: '#191F28' }}>{template.name}</span>
                          <div style={{ fontSize: 11, color: templateBrand ? templateBrand.color : '#8B95A1', marginTop: 2 }}>
                            {templateBrand ? templateBrand.name : '전체 브랜드'}
                          </div>
                        </div>
                      </div>
                      <div style={{ display: 'flex', gap: 8 }}>
                        <button 
                          onClick={() => setEditingTemplate(template)}
                          style={{ padding: '6px 12px', borderRadius: 6, border: '1px solid #E5E8EB', background: 'white', fontSize: 13, color: '#4E5968', cursor: 'pointer' }}
                        >
                          수정
                        </button>
                        <button 
                          onClick={() => setConfirmDelete(template)}
                          style={{ padding: '6px 12px', borderRadius: 6, border: '1px solid #FEE2E2', background: '#FEF2F2', fontSize: 13, color: '#DC2626', cursor: 'pointer' }}
                        >
                          삭제
                        </button>
                      </div>
                    </div>
                    {/* 업무 목록 */}
                    <div style={{ padding: '12px 20px' }}>
                      {template.tasks.length === 0 ? (
                        <p style={{ fontSize: 13, color: '#8B95A1', textAlign: 'center', padding: 12 }}>등록된 업무가 없습니다</p>
                      ) : (
                        template.tasks.map((task, idx) => (
                          <div key={idx} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 0', borderBottom: idx < template.tasks.length - 1 ? '1px solid #F2F3F5' : 'none' }}>
                            <div style={{ width: 20, height: 20, borderRadius: 4, border: '2px solid #D1D6DB', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                              <span style={{ fontSize: 11, color: '#8B95A1' }}>{idx + 1}</span>
                            </div>
                            <span style={{ fontSize: 14, color: '#191F28' }}>{task.title}</span>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                  );
                })}
              </div>
            )}
          </div>
          
          {/* 추가/수정 모달 */}
          {(showAddModal || editingTemplate) && (
            <TemplateEditModal
              template={editingTemplate}
              onSave={editingTemplate ? handleUpdateTemplate : handleAddTemplate}
              onClose={() => { setShowAddModal(false); setEditingTemplate(null); }}
            />
          )}
          
          {/* 삭제 확인 모달 */}
          {confirmDelete && (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000 }}>
              <div style={{ background: 'white', borderRadius: 16, padding: 24, width: 400, maxWidth: '90vw' }}>
                <h3 style={{ fontSize: 18, fontWeight: 700, color: '#191F28', marginBottom: 12 }}>⚠️ 템플릿 삭제</h3>
                <p style={{ fontSize: 14, color: '#4E5968', marginBottom: 20 }}>
                  "<strong>{confirmDelete.name}</strong>" 템플릿을 삭제하시겠습니까?<br/>
                  삭제하면 복구할 수 없습니다.
                </p>
                <div style={{ display: 'flex', gap: 12, justifyContent: 'flex-end' }}>
                  <button onClick={() => setConfirmDelete(null)} style={{ padding: '10px 20px', borderRadius: 8, border: '1px solid #E5E8EB', background: 'white', fontSize: 14, fontWeight: 600, color: '#4E5968', cursor: 'pointer' }}>취소</button>
                  <button onClick={() => handleDeleteTemplate(confirmDelete.id)} style={{ padding: '10px 20px', borderRadius: 8, border: 'none', background: '#DC2626', fontSize: 14, fontWeight: 600, color: 'white', cursor: 'pointer' }}>삭제</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }
    
    // 템플릿 수정 모달
    function TemplateEditModal({ template, onSave, onClose }) {
      const [form, setForm] = useState({
        id: template?.id || '',
        name: template?.name || '',
        color: template?.color || '#3182F6',
        brandId: template?.brandId || null,
        tasks: template?.tasks || []
      });
      const [newTaskTitle, setNewTaskTitle] = useState('');
      
      const handleAddTask = () => {
        if (!newTaskTitle.trim()) return;
        setForm(prev => ({
          ...prev,
          tasks: [...prev.tasks, { title: newTaskTitle.trim(), order: prev.tasks.length }]
        }));
        setNewTaskTitle('');
      };
      
      const handleRemoveTask = (index) => {
        setForm(prev => ({
          ...prev,
          tasks: prev.tasks.filter((_, i) => i !== index).map((t, i) => ({ ...t, order: i }))
        }));
      };
      
      const handleSave = () => {
        if (!form.name.trim()) return alert('템플릿명을 입력해주세요.');
        onSave(form);
      };
      
      const TEMPLATE_COLORS = ['#3182F6', '#00C471', '#F59E0B', '#8B5CF6', '#EC4899', '#6B7684'];
      
      return (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000 }}>
          <div style={{ background: 'white', borderRadius: 16, width: 480, maxWidth: '90vw', maxHeight: '80vh', display: 'flex', flexDirection: 'column' }}>
            {/* 헤더 */}
            <div style={{ padding: '20px 24px', borderBottom: '1px solid #E5E8EB', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <h3 style={{ fontSize: 18, fontWeight: 700, color: '#191F28' }}>{template ? '템플릿 수정' : '새 템플릿'}</h3>
              <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 4 }}>
                <Icon name="x" size={20} color="#6B7684" />
              </button>
            </div>
            
            {/* 본문 */}
            <div style={{ flex: 1, padding: 24, overflowY: 'auto' }}>
              {/* 템플릿명 */}
              <div style={{ marginBottom: 20 }}>
                <label style={{ display: 'block', fontSize: 14, fontWeight: 600, color: '#191F28', marginBottom: 8 }}>템플릿명 *</label>
                <input
                  type="text"
                  value={form.name}
                  onChange={(e) => setForm({ ...form, name: e.target.value })}
                  placeholder="예: 신기술, 신공법"
                  style={{ width: '100%', padding: '12px 14px', borderRadius: 8, border: '1px solid #E5E8EB', fontSize: 14, boxSizing: 'border-box' }}
                />
              </div>
              
              {/* 적용 브랜드 */}
              <div style={{ marginBottom: 20 }}>
                <label style={{ display: 'block', fontSize: 14, fontWeight: 600, color: '#191F28', marginBottom: 8 }}>
                  적용 브랜드 <span style={{ fontSize: 12, fontWeight: 400, color: '#8B95A1' }}>(선택 안하면 전체 브랜드에 적용)</span>
                </label>
                <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                  <button
                    onClick={() => setForm({ ...form, brandId: null })}
                    style={{
                      padding: '8px 12px', borderRadius: 8,
                      border: form.brandId === null ? '2px solid #3182F6' : '1px solid #E5E8EB',
                      background: form.brandId === null ? '#EBF4FF' : 'white',
                      color: form.brandId === null ? '#3182F6' : '#6B7684',
                      fontSize: 13, fontWeight: 500, cursor: 'pointer'
                    }}
                  >
                    전체
                  </button>
                  {BRANDS.map(b => (
                    <button
                      key={b.id}
                      onClick={() => setForm({ ...form, brandId: b.id })}
                      style={{
                        padding: '8px 12px', borderRadius: 8,
                        border: form.brandId === b.id ? `2px solid ${b.color}` : '1px solid #E5E8EB',
                        background: form.brandId === b.id ? `${b.color}15` : 'white',
                        color: form.brandId === b.id ? b.color : '#6B7684',
                        fontSize: 13, fontWeight: 500, cursor: 'pointer'
                      }}
                    >
                      {b.name}
                    </button>
                  ))}
                </div>
              </div>
              
              
              {/* 업무 목록 */}
              <div>
                <label style={{ display: 'block', fontSize: 14, fontWeight: 600, color: '#191F28', marginBottom: 8 }}>업무 목록</label>
                <div style={{ background: '#F7F8FA', borderRadius: 12, padding: 12, marginBottom: 12 }}>
                  {form.tasks.length === 0 ? (
                    <p style={{ fontSize: 13, color: '#8B95A1', textAlign: 'center', padding: 12 }}>등록된 업무가 없습니다</p>
                  ) : (
                    form.tasks.map((task, idx) => (
                      <div key={idx} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', background: 'white', borderRadius: 8, marginBottom: idx < form.tasks.length - 1 ? 8 : 0 }}>
                        <span style={{ fontSize: 12, color: '#8B95A1', width: 20 }}>{idx + 1}</span>
                        <span style={{ flex: 1, fontSize: 14, color: '#191F28' }}>{task.title}</span>
                        <button 
                          onClick={() => handleRemoveTask(idx)}
                          style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 4 }}
                        >
                          <Icon name="trash" size={16} color="#DC2626" />
                        </button>
                      </div>
                    ))
                  )}
                </div>
                
                {/* 업무 추가 */}
                <div style={{ display: 'flex', gap: 8 }}>
                  <input
                    type="text"
                    value={newTaskTitle}
                    onChange={(e) => setNewTaskTitle(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && handleAddTask()}
                    placeholder="새 업무 입력 후 Enter"
                    style={{ flex: 1, padding: '10px 14px', borderRadius: 8, border: '1px solid #E5E8EB', fontSize: 14 }}
                  />
                  <button 
                    onClick={handleAddTask}
                    style={{ padding: '10px 16px', borderRadius: 8, background: '#F2F3F5', border: 'none', fontSize: 14, fontWeight: 600, color: '#4E5968', cursor: 'pointer' }}
                  >
                    추가
                  </button>
                </div>
              </div>
            </div>
            
            {/* 푸터 */}
            <div style={{ padding: '16px 24px', borderTop: '1px solid #E5E8EB', display: 'flex', gap: 12, justifyContent: 'flex-end' }}>
              <button onClick={onClose} style={{ padding: '10px 20px', borderRadius: 8, border: '1px solid #E5E8EB', background: 'white', fontSize: 14, fontWeight: 600, color: '#4E5968', cursor: 'pointer' }}>취소</button>
              <button onClick={handleSave} style={{ padding: '10px 20px', borderRadius: 8, border: 'none', background: '#3182F6', fontSize: 14, fontWeight: 600, color: 'white', cursor: 'pointer' }}>저장</button>
            </div>
          </div>
        </div>
      );
    }

    // ============ 회의록 탭 ============
    const MEETING_TYPES = [
      { id: 'brand', label: '브랜드마케팅팀 회의', color: '#00C471', icon: '🟢' },
      { id: 'townhall', label: 'PM타운홀미팅', color: '#F59E0B', icon: '🟡' },
      { id: 'project', label: '프로젝트미팅', color: '#3182F6', icon: '🔵' },
      { id: 'external', label: '외부미팅', color: '#8B5CF6', icon: '🟣' },
    ];
    
    const MEETING_TEMPLATES = [
      { id: 'default', name: '기본', content: '' },
      { id: 'brand', name: '📋 브랜드팀 회의', content: '## 지난 주 리뷰\n- \n\n## 이번 주 목표\n- \n\n## 캠페인 진행상황\n- \n\n## 논의사항\n- ' },
      { id: 'townhall', name: '📋 타운홀미팅', content: '## 공지사항\n- \n\n## 프로젝트 현황\n- \n\n## Q&A\n- \n\n## 액션 아이템\n- ' },
      { id: 'project', name: '📋 프로젝트미팅', content: '## 프로젝트 현황\n- \n\n## 이슈 및 리스크\n- \n\n## 다음 단계\n- \n\n## 담당자별 할일\n- ' },
    ];

    function MeetingTab({ meetings, setMeetings, projects, currentUser, tasks, setTasks }) {
      const [showAddModal, setShowAddModal] = useState(false);
      const [selectedMeeting, setSelectedMeeting] = useState(null);
      const [filterType, setFilterType] = useState('all');
      const [filterPeriod, setFilterPeriod] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      
      // 회의록 필터링
      const filteredMeetings = meetings.filter(m => {
        if (filterType !== 'all' && m.type !== filterType) return false;
        if (searchQuery && !m.title.toLowerCase().includes(searchQuery.toLowerCase())) return false;
        
        if (filterPeriod === 'week') {
          const weekAgo = new Date();
          weekAgo.setDate(weekAgo.getDate() - 7);
          if (new Date(m.date) < weekAgo) return false;
        } else if (filterPeriod === 'month') {
          const monthAgo = new Date();
          monthAgo.setMonth(monthAgo.getMonth() - 1);
          if (new Date(m.date) < monthAgo) return false;
        }
        
        return true;
      }).sort((a, b) => new Date(b.date) - new Date(a.date));
      
      // 월별 그룹핑
      const groupedMeetings = filteredMeetings.reduce((groups, meeting) => {
        const date = new Date(meeting.date);
        const key = `${date.getFullYear()}년 ${date.getMonth() + 1}월`;
        if (!groups[key]) groups[key] = [];
        groups[key].push(meeting);
        return groups;
      }, {});
      
      // 회의록 추가
      const addMeeting = (meeting) => {
        const newMeeting = {
          ...meeting,
          id: `meeting_${Date.now()}`,
          createdBy: currentUser.id,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
        setMeetings(prev => [...prev, newMeeting]);
        setShowAddModal(false);
        setSelectedMeeting(newMeeting);
      };
      
      // 회의록 수정
      const updateMeeting = (updatedMeeting) => {
        setMeetings(prev => prev.map(m => 
          m.id === updatedMeeting.id 
            ? { ...updatedMeeting, updatedAt: new Date().toISOString() }
            : m
        ));
        setSelectedMeeting(updatedMeeting);
      };
      
      // 회의록 삭제
      const deleteMeeting = (meetingId) => {
        if (!confirm('회의록을 삭제하시겠습니까?')) return;
        setMeetings(prev => prev.filter(m => m.id !== meetingId));
        setSelectedMeeting(null);
      };
      
      // 액션 아이템 상태 변경
      const toggleActionItem = (meetingId, actionItemId) => {
        // meetings 상태 업데이트
        setMeetings(prev => {
          const updated = prev.map(m => {
            if (m.id !== meetingId) return m;
            return {
              ...m,
              actionItems: m.actionItems.map(ai => 
                ai.id === actionItemId 
                  ? { ...ai, status: ai.status === 'done' ? 'pending' : 'done' }
                  : ai
              ),
              updatedAt: new Date().toISOString()
            };
          });
          // Firebase에도 저장
          const updatedMeeting = updated.find(m => m.id === meetingId);
          if (updatedMeeting) {
            FirebaseService.saveDoc('meetings', meetingId, updatedMeeting);
            // selectedMeeting도 업데이트
            if (selectedMeeting && selectedMeeting.id === meetingId) {
              setSelectedMeeting(updatedMeeting);
            }
          }
          return updated;
        });
      };
      
      return (
        <div style={{ flex: 1, display: 'flex', background: '#F7F8FA' }}>
          {/* 왼쪽: 회의록 목록 */}
          <div style={{ width: selectedMeeting ? 380 : '100%', maxWidth: selectedMeeting ? 380 : 900, margin: selectedMeeting ? 0 : '0 auto', borderRight: selectedMeeting ? '1px solid #E5E8EB' : 'none', background: 'white', display: 'flex', flexDirection: 'column', transition: 'width 0.3s' }}>
            {/* 헤더 */}
            <header style={{ padding: '20px 24px', borderBottom: '1px solid #E5E8EB' }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
                <h1 style={{ fontSize: 20, fontWeight: 700, color: '#191F28' }}>📝 회의록</h1>
                <button 
                  onClick={() => setShowAddModal(true)}
                  style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '10px 16px', borderRadius: 8, background: '#3182F6', border: 'none', color: 'white', fontSize: 14, fontWeight: 600, cursor: 'pointer' }}
                >
                  <Icon name="plus" size={18} color="white" /> 새 회의록
                </button>
              </div>
              
              {/* 필터 */}
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
                <select 
                  value={filterType} 
                  onChange={(e) => setFilterType(e.target.value)}
                  style={{ padding: '8px 12px', borderRadius: 8, border: '1px solid #E5E8EB', fontSize: 13, color: '#4E5968', cursor: 'pointer' }}
                >
                  <option value="all">전체 유형</option>
                  {MEETING_TYPES.map(t => <option key={t.id} value={t.id}>{t.icon} {t.label}</option>)}
                </select>
                
                <select 
                  value={filterPeriod} 
                  onChange={(e) => setFilterPeriod(e.target.value)}
                  style={{ padding: '8px 12px', borderRadius: 8, border: '1px solid #E5E8EB', fontSize: 13, color: '#4E5968', cursor: 'pointer' }}
                >
                  <option value="all">전체 기간</option>
                  <option value="week">이번 주</option>
                  <option value="month">이번 달</option>
                </select>
                
                <div style={{ flex: 1, minWidth: 150 }}>
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="🔍 검색..."
                    style={{ width: '100%', padding: '8px 12px', borderRadius: 8, border: '1px solid #E5E8EB', fontSize: 13 }}
                  />
                </div>
              </div>
            </header>
            
            {/* 회의록 목록 */}
            <div style={{ flex: 1, overflowY: 'auto', padding: 16 }}>
              {filteredMeetings.length === 0 ? (
                <div style={{ textAlign: 'center', padding: '60px 20px' }}>
                  <div style={{ fontSize: 48, marginBottom: 16 }}>📝</div>
                  <p style={{ fontSize: 15, color: '#8B95A1', marginBottom: 20 }}>
                    {meetings.length === 0 ? '아직 작성된 회의록이 없습니다' : '검색 결과가 없습니다'}
                  </p>
                  {meetings.length === 0 && (
                    <button 
                      onClick={() => setShowAddModal(true)}
                      style={{ padding: '10px 20px', borderRadius: 8, background: '#3182F6', border: 'none', color: 'white', fontSize: 14, fontWeight: 600, cursor: 'pointer' }}
                    >
                      첫 회의록 작성하기
                    </button>
                  )}
                </div>
              ) : (
                Object.entries(groupedMeetings).map(([month, monthMeetings]) => (
                  <div key={month} style={{ marginBottom: 24 }}>
                    <h3 style={{ fontSize: 13, fontWeight: 600, color: '#8B95A1', marginBottom: 12, padding: '0 4px' }}>📅 {month}</h3>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                      {monthMeetings.map(meeting => {
                        const meetingType = MEETING_TYPES.find(t => t.id === meeting.type) || MEETING_TYPES[0];
                        const actionItems = meeting.actionItems || [];
                        const doneCount = actionItems.filter(ai => ai.status === 'done').length;
                        const linkedProjects = (meeting.linkedProjects || []).map(pid => projects.find(p => p.id === pid)).filter(Boolean);
                        const creator = TEAM_MEMBERS.find(m => m.id === meeting.createdBy);
                        
                        return (
                          <div 
                            key={meeting.id}
                            onClick={() => setSelectedMeeting(meeting)}
                            style={{ 
                              padding: 16, 
                              borderRadius: 12, 
                              border: selectedMeeting?.id === meeting.id ? `2px solid ${meetingType.color}` : '1px solid #E5E8EB',
                              background: selectedMeeting?.id === meeting.id ? `${meetingType.color}08` : 'white',
                              cursor: 'pointer',
                              transition: 'all 0.15s'
                            }}
                          >
                            <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: 8 }}>
                              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                                <span style={{ fontSize: 16 }}>{meetingType.icon}</span>
                                <span style={{ fontSize: 15, fontWeight: 600, color: '#191F28' }}>{meeting.title}</span>
                              </div>
                              <span style={{ fontSize: 12, color: '#8B95A1' }}>
                                {new Date(meeting.date).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric', weekday: 'short' })} {meeting.startTime}
                              </span>
                            </div>
                            
                            <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 8 }}>
                              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                                <span style={{ fontSize: 12, color: '#8B95A1' }}>참석:</span>
                                <div style={{ display: 'flex' }}>
                                  {(meeting.attendees || []).slice(0, 3).map((aid, idx) => {
                                    const member = TEAM_MEMBERS.find(m => m.id === aid);
                                    if (!member) return null;
                                    return (
                                      <div key={aid} style={{ width: 22, height: 22, borderRadius: '50%', background: member.color, color: 'white', fontSize: 9, fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center', border: '2px solid white', marginLeft: idx > 0 ? -6 : 0 }}>
                                        {member.initial}
                                      </div>
                                    );
                                  })}
                                </div>
                                <span style={{ fontSize: 12, color: '#8B95A1' }}>{(meeting.attendees || []).length}명</span>
                              </div>
                              {creator && (
                                <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                                  <span style={{ fontSize: 11, color: '#ADB5BD' }}>✍️</span>
                                  <span style={{ fontSize: 11, color: '#ADB5BD' }}>{creator.name}</span>
                                </div>
                              )}
                            </div>
                            
                            {actionItems.length > 0 && (
                              <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, color: '#6B7684' }}>
                                <span>📌</span>
                                <span>액션 아이템 {actionItems.length}개</span>
                                <span style={{ color: '#00C471' }}>(완료 {doneCount})</span>
                                <span style={{ color: '#F59E0B' }}>(진행 {actionItems.length - doneCount})</span>
                              </div>
                            )}
                            
                            {linkedProjects.length > 0 && (
                              <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, color: '#8B95A1', marginTop: 6 }}>
                                <span>🔗</span>
                                <span>{linkedProjects.map(p => p.title).join(', ')}</span>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>
          
          {/* 오른쪽: 회의록 상세 */}
          {selectedMeeting && (
            <MeetingDetailPanel
              meeting={selectedMeeting}
              projects={projects}
              currentUser={currentUser}
              onUpdate={updateMeeting}
              onDelete={deleteMeeting}
              onClose={() => setSelectedMeeting(null)}
              onToggleActionItem={toggleActionItem}
              onAddToPersonalTask={(actionItem) => {
                const newTask = {
                  id: Date.now(),
                  title: actionItem.title,
                  memberId: actionItem.assignee || currentUser.id,
                  date: actionItem.dueDate || new Date().toISOString().split('T')[0],
                  completed: actionItem.status === 'done',
                  createdAt: new Date().toISOString(),
                  fromMeeting: selectedMeeting.id
                };
                setTasks(prev => [...prev, newTask]);
              }}
            />
          )}
          
          {/* 새 회의록 모달 */}
          {showAddModal && (
            <MeetingModal
              meeting={null}
              projects={projects}
              currentUser={currentUser}
              onSave={addMeeting}
              onClose={() => setShowAddModal(false)}
            />
          )}
        </div>
      );
    }
    
    // 회의록 상세 패널
    function MeetingDetailPanel({ meeting, projects, currentUser, onUpdate, onDelete, onClose, onToggleActionItem, onAddToPersonalTask }) {
      const [isEditing, setIsEditing] = useState(false);
      const [editForm, setEditForm] = useState(meeting);
      const [newActionItem, setNewActionItem] = useState({ title: '', assignee: currentUser.id, dueDate: '' });
      const [showAddAction, setShowAddAction] = useState(false);
      const [editingActionItem, setEditingActionItem] = useState(null); // 수정 중인 액션 아이템
      
      useEffect(() => {
        setEditForm(meeting);
        setIsEditing(false);
        setEditingActionItem(null);
      }, [meeting.id]);
      
      const meetingType = MEETING_TYPES.find(t => t.id === meeting.type) || MEETING_TYPES[0];
      const linkedProjects = (meeting.linkedProjects || []).map(pid => projects.find(p => p.id === pid)).filter(Boolean);
      const creator = TEAM_MEMBERS.find(m => m.id === meeting.createdBy);
      
      // 액션 아이템 추가
      const addActionItem = () => {
        if (!newActionItem.title.trim()) return;
        const actionItem = {
          id: `ai_${Date.now()}`,
          title: newActionItem.title,
          assignee: newActionItem.assignee,
          dueDate: newActionItem.dueDate,
          status: 'pending'
        };
        onUpdate({
          ...meeting,
          actionItems: [...(meeting.actionItems || []), actionItem]
        });
        setNewActionItem({ title: '', assignee: currentUser.id, dueDate: '' });
        setShowAddAction(false);
      };
      
      // 액션 아이템 삭제
      const deleteActionItem = (actionItemId) => {
        onUpdate({
          ...meeting,
          actionItems: (meeting.actionItems || []).filter(ai => ai.id !== actionItemId)
        });
      };
      
      // 액션 아이템 수정
      const updateActionItem = (actionItemId, updates) => {
        onUpdate({
          ...meeting,
          actionItems: (meeting.actionItems || []).map(ai => 
            ai.id === actionItemId ? { ...ai, ...updates } : ai
          )
        });
        setEditingActionItem(null);
      };
      
      // 내용 저장
      const saveContent = () => {
        onUpdate(editForm);
        setIsEditing(false);
      };
      
      return (
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', background: '#F7F8FA' }}>
          {/* 상세 헤더 */}
          <header style={{ padding: '16px 24px', background: 'white', borderBottom: '1px solid #E5E8EB', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <button onClick={onClose} style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '8px 12px', borderRadius: 8, border: '1px solid #E5E8EB', background: 'white', fontSize: 13, color: '#6B7684', cursor: 'pointer' }}>
              <Icon name="arrowLeft" size={16} color="#6B7684" /> 목록
            </button>
            <div style={{ display: 'flex', gap: 8 }}>
              {isEditing ? (
                <>
                  <button onClick={() => setIsEditing(false)} style={{ padding: '8px 16px', borderRadius: 8, border: '1px solid #E5E8EB', background: 'white', fontSize: 13, color: '#6B7684', cursor: 'pointer' }}>취소</button>
                  <button onClick={saveContent} style={{ padding: '8px 16px', borderRadius: 8, border: 'none', background: '#3182F6', fontSize: 13, color: 'white', fontWeight: 600, cursor: 'pointer' }}>저장</button>
                </>
              ) : (
                <>
                  <button onClick={() => setIsEditing(true)} style={{ padding: '8px 16px', borderRadius: 8, border: '1px solid #E5E8EB', background: 'white', fontSize: 13, color: '#6B7684', cursor: 'pointer' }}>수정</button>
                  <button onClick={() => onDelete(meeting.id)} style={{ padding: '8px 16px', borderRadius: 8, border: '1px solid #FEE2E2', background: '#FEF2F2', fontSize: 13, color: '#DC2626', cursor: 'pointer' }}>삭제</button>
                </>
              )}
            </div>
          </header>
          
          {/* 상세 내용 */}
          <div style={{ flex: 1, overflowY: 'auto', padding: 24 }}>
            {/* 기본 정보 카드 */}
            <div style={{ background: 'white', borderRadius: 16, border: '1px solid #E5E8EB', padding: 24, marginBottom: 20 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
                <span style={{ fontSize: 24 }}>{meetingType.icon}</span>
                {isEditing ? (
                  <input
                    type="text"
                    value={editForm.title}
                    onChange={(e) => setEditForm({ ...editForm, title: e.target.value })}
                    style={{ flex: 1, fontSize: 20, fontWeight: 700, color: '#191F28', border: '1px solid #E5E8EB', borderRadius: 8, padding: '8px 12px' }}
                  />
                ) : (
                  <h2 style={{ fontSize: 20, fontWeight: 700, color: '#191F28' }}>{meeting.title}</h2>
                )}
                <span style={{ padding: '4px 10px', borderRadius: 6, background: `${meetingType.color}15`, color: meetingType.color, fontSize: 12, fontWeight: 600 }}>{meetingType.label}</span>
              </div>
              
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 16, fontSize: 14, color: '#4E5968' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                  <span>📅</span>
                  <span>{new Date(meeting.date).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' })}</span>
                  <span>{meeting.startTime} - {meeting.endTime || ''}</span>
                </div>
                {meeting.location && (
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                    <span>📍</span>
                    <span>{meeting.location}</span>
                  </div>
                )}
              </div>
              
              {/* 참석자 */}
              <div style={{ marginTop: 20 }}>
                <p style={{ fontSize: 13, color: '#8B95A1', marginBottom: 10 }}>참석자</p>
                <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
                  {(meeting.attendees || []).map(aid => {
                    const member = TEAM_MEMBERS.find(m => m.id === aid);
                    if (!member) return null;
                    return (
                      <div key={aid} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
                        <div style={{ width: 40, height: 40, borderRadius: '50%', background: member.color, color: 'white', fontSize: 14, fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                          {member.initial}
                        </div>
                        <span style={{ fontSize: 12, color: '#4E5968' }}>{member.name}</span>
                        {meeting.createdBy === aid && <span style={{ fontSize: 10, color: '#8B95A1' }}>작성자</span>}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
            
            {/* 안건 */}
            {(meeting.agenda || []).length > 0 && (
              <div style={{ background: 'white', borderRadius: 16, border: '1px solid #E5E8EB', padding: 20, marginBottom: 20 }}>
                <h3 style={{ fontSize: 15, fontWeight: 700, color: '#191F28', marginBottom: 12, display: 'flex', alignItems: 'center', gap: 8 }}>
                  📋 안건 (Agenda)
                </h3>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                  {meeting.agenda.map((item, idx) => (
                    <div key={idx} style={{ display: 'flex', alignItems: 'flex-start', gap: 8, fontSize: 14, color: '#4E5968' }}>
                      <span style={{ color: '#8B95A1' }}>{idx + 1}.</span>
                      <span>{item}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
            
            {/* 회의 내용 */}
            <div style={{ background: 'white', borderRadius: 16, border: '1px solid #E5E8EB', padding: 20, marginBottom: 20 }}>
              <h3 style={{ fontSize: 15, fontWeight: 700, color: '#191F28', marginBottom: 12, display: 'flex', alignItems: 'center', gap: 8 }}>
                📝 회의 내용
              </h3>
              {isEditing ? (
                <textarea
                  value={editForm.content || ''}
                  onChange={(e) => setEditForm({ ...editForm, content: e.target.value })}
                  placeholder="회의 내용을 작성하세요..."
                  style={{ width: '100%', minHeight: 300, padding: 16, borderRadius: 12, border: '1px solid #E5E8EB', fontSize: 14, lineHeight: 1.8, resize: 'vertical', fontFamily: 'inherit' }}
                />
              ) : (
                <div style={{ fontSize: 14, color: '#4E5968', lineHeight: 1.8, whiteSpace: 'pre-wrap' }}>
                  {meeting.content || '작성된 내용이 없습니다.'}
                </div>
              )}
            </div>
            
            {/* 액션 아이템 */}
            <div style={{ background: 'white', borderRadius: 16, border: '1px solid #E5E8EB', padding: 20, marginBottom: 20 }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
                <h3 style={{ fontSize: 15, fontWeight: 700, color: '#191F28', display: 'flex', alignItems: 'center', gap: 8 }}>
                  ✅ 액션 아이템
                </h3>
                <button 
                  onClick={() => setShowAddAction(true)}
                  style={{ display: 'flex', alignItems: 'center', gap: 4, padding: '6px 12px', borderRadius: 6, border: '1px solid #E5E8EB', background: 'white', fontSize: 12, color: '#6B7684', cursor: 'pointer' }}

                  <Icon name="plus" size={14} color="#6B7684" /> 추가

                    type="text"
                    value={newActionItem.title}
                    onChange={(e) => setNewActionItem({ ...newActionItem, title: e.target.value })}

                    <select
                      value={newActionItem.assignee}
                      onChange={(e) => setNewActionItem({ ...newActionItem, assignee: Number(e.target.value) })}
                      style={{ flex: 1, padding: '8px 12px', borderRadius: 8, border: '1px solid #E5E8EB', fontSize: 13 }}

                    <input
                      type="date"
                      value={newActionItem.dueDate}
                      onChange={(e) => setNewActionItem({ ...newActionItem, dueDate: e.target.value })}

                  <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>

                    <button onClick={addActionItem} style={{ padding: '8px 16px', borderRadius: 6, border: 'none', background: '#3182F6', fontSize: 13, color: 'white', fontWeight: 600, cursor: 'pointer' }}>추가</button>
                  </div>
                </div>
              )}
              
              {/* 액션 아이템 목록 */}
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                {(meeting.actionItems || []).length === 0 ? (
                  <p style={{ fontSize: 13, color: '#8B95A1', textAlign: 'center', padding: 20 }}>등록된 액션 아이템이 없습니다</p>
                ) : (
                  (meeting.actionItems || []).map(ai => {
                    const assignee = TEAM_MEMBERS.find(m => m.id === ai.assignee);
                    const isDone = ai.status === 'done';
                    const isOverdue = ai.dueDate && new Date(ai.dueDate) < new Date() && !isDone;
                    const hasNoProject = linkedProjects.length === 0;
                    const isEditingThis = editingActionItem?.id === ai.id;
                    
                    // 수정 모드
                    if (isEditingThis) {
                      return (
                        <div key={ai.id} style={{ padding: '12px 16px', background: '#FFF8E6', borderRadius: 10, border: '2px solid #F59E0B' }}>
                          <div style={{ display: 'flex', gap: 8, marginBottom: 8 }}>
                            <input
                              type="text"
                              value={editingActionItem.title}
                              onChange={(e) => setEditingActionItem({ ...editingActionItem, title: e.target.value })}

                              autoFocus
                            />
                          </div>
                          <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                            <select
                              value={editingActionItem.assignee}
                              onChange={(e) => setEditingActionItem({ ...editingActionItem, assignee: Number(e.target.value) })}
                              style={{ padding: '6px 10px', borderRadius: 6, border: '1px solid #E5E8EB', fontSize: 13 }}
                            >
                              {TEAM_MEMBERS.map(m => (
                                <option key={m.id} value={m.id}>{m.name}</option>
                              ))}
                            </select>
                            <input
                              type="date"
                              value={editingActionItem.dueDate || ''}
                              onChange={(e) => setEditingActionItem({ ...editingActionItem, dueDate: e.target.value })}
                              style={{ padding: '6px 10px', borderRadius: 6, border: '1px solid #E5E8EB', fontSize: 13 }}
                            />
                            <div style={{ flex: 1 }} />
                            <button
                              onClick={() => setEditingActionItem(null)}
                              style={{ padding: '6px 12px', borderRadius: 6, border: '1px solid #E5E8EB', background: 'white', fontSize: 12, color: '#6B7684', cursor: 'pointer' }}
                            >
                              취소
                            </button>
                            <button
                              onClick={() => updateActionItem(ai.id, editingActionItem)}
                              style={{ padding: '6px 12px', borderRadius: 6, border: 'none', background: '#3182F6', fontSize: 12, color: 'white', fontWeight: 600, cursor: 'pointer' }}
                            >
                              저장
                            </button>
                          </div>
                        </div>
                      );
                    }
                    
                    // 일반 모드
                    return (
                      <div key={ai.id} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 16px', background: isDone ? '#F7F8FA' : 'white', borderRadius: 10, border: '1px solid #E5E8EB' }}>
                        <button
                          onClick={() => onToggleActionItem(meeting.id, ai.id)}
                          style={{ width: 22, height: 22, borderRadius: 6, border: isDone ? 'none' : '2px solid #D1D6DB', background: isDone ? '#00C471' : 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}
                        >
                          {isDone && <Icon name="check" size={14} color="white" />}
                        </button>
                        <span style={{ flex: 1, fontSize: 14, color: isDone ? '#8B95A1' : '#191F28', textDecoration: isDone ? 'line-through' : 'none' }}>{ai.title}</span>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                          {assignee && (
                            <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                              <div style={{ width: 20, height: 20, borderRadius: '50%', background: assignee.color, color: 'white', fontSize: 9, fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                                {assignee.initial}
                              </div>
                            </div>
                          )}
                          {ai.dueDate && (
                            <span style={{ fontSize: 12, color: isOverdue ? '#DC2626' : '#8B95A1' }}>
                              📅 {new Date(ai.dueDate).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' })}까지
                            </span>
                          )}
                          <span style={{ fontSize: 11, padding: '2px 6px', borderRadius: 4, background: isDone ? '#D1FAE5' : isOverdue ? '#FEE2E2' : '#EBF4FF', color: isDone ? '#059669' : isOverdue ? '#DC2626' : '#3182F6' }}>
                            {isDone ? '완료' : isOverdue ? '지연' : '진행중'}
                          </span>
                          {/* 프로젝트 연동 없으면 개인 업무일지 추가 버튼 */}
                          {hasNoProject && (
                            <button
                              onClick={() => {
                                onAddToPersonalTask(ai);
                                alert('✅ 개인 업무일지에 추가되었습니다!');
                              }}
                              style={{ padding: '4px 8px', background: '#EBF4FF', border: '1px solid #3182F6', borderRadius: 4, fontSize: 11, color: '#3182F6', fontWeight: 600, cursor: 'pointer', whiteSpace: 'nowrap' }}
                              title="개인 업무일지로 추가"
                            >
                              📋 업무추가
                            </button>
                          )}
                          {/* 수정 버튼 */}
                          <button
                            onClick={() => setEditingActionItem({ ...ai })}
                            style={{ padding: 4, background: 'none', border: 'none', cursor: 'pointer', opacity: 0.5 }}
                            title="수정"
                          >
                            <Icon name="edit" size={14} color="#3182F6" />
                          </button>
                          {/* 삭제 버튼 */}
                          <button
                            onClick={() => deleteActionItem(ai.id)}
                            style={{ padding: 4, background: 'none', border: 'none', cursor: 'pointer', opacity: 0.5 }}
                            title="삭제"
                          >
                            <Icon name="trash" size={14} color="#DC2626" />
                          </button>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            </div>
            
            {/* 연결된 프로젝트 */}
            {linkedProjects.length > 0 && (
              <div style={{ background: 'white', borderRadius: 16, border: '1px solid #E5E8EB', padding: 20 }}>
                <h3 style={{ fontSize: 15, fontWeight: 700, color: '#191F28', marginBottom: 12, display: 'flex', alignItems: 'center', gap: 8 }}>
                  🔗 연결된 프로젝트
                </h3>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                  {linkedProjects.map(project => (
                    <div key={project.id} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '10px 12px', background: '#F7F8FA', borderRadius: 8 }}>
                      <span>📁</span>
                      <span style={{ fontSize: 14, color: '#191F28' }}>{project.title}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }
    
    // 새 회의록 모달
    function MeetingModal({ meeting, projects, currentUser, onSave, onClose, defaultProject }) {
      const isEdit = !!meeting;
      const today = new Date().toISOString().split('T')[0];
      
      const [form, setForm] = useState({
        title: meeting?.title || '',
        type: meeting?.type || 'brand',
        date: meeting?.date || today,
        startTime: meeting?.startTime || '10:00',
        endTime: meeting?.endTime || '11:00',
        location: meeting?.location || '',
        attendees: meeting?.attendees || [currentUser.id],
        linkedProjects: meeting?.linkedProjects || (defaultProject ? [defaultProject.id] : []),
        agenda: meeting?.agenda || [],
        content: meeting?.content || '',
        actionItems: meeting?.actionItems || []
      });
      
      const [newAgendaItem, setNewAgendaItem] = useState('');
      const [selectedTemplate, setSelectedTemplate] = useState('default');
      const [newActionItem, setNewActionItem] = useState({ title: '', assignee: currentUser.id, dueDate: '' });
      
      // 액션 아이템 추가
      const addActionItem = () => {
        if (!newActionItem.title.trim()) return;
        const actionItem = {
          id: `ai_${Date.now()}`,
          title: newActionItem.title.trim(),
          assignee: newActionItem.assignee,
          dueDate: newActionItem.dueDate || null,
          status: 'pending'
        };
        setForm(prev => ({ ...prev, actionItems: [...prev.actionItems, actionItem] }));
        setNewActionItem({ title: '', assignee: currentUser.id, dueDate: '' });
      };
      
      // 액션 아이템 삭제
      const removeActionItem = (id) => {
        setForm(prev => ({ ...prev, actionItems: prev.actionItems.filter(ai => ai.id !== id) }));
      };
      
      const toggleAttendee = (memberId) => {
        setForm(prev => ({
          ...prev,
          attendees: prev.attendees.includes(memberId)
            ? prev.attendees.filter(id => id !== memberId)
            : [...prev.attendees, memberId]
        }));
      };
      
      const toggleProject = (projectId) => {
        setForm(prev => ({
          ...prev,
          linkedProjects: prev.linkedProjects.includes(projectId)
            ? prev.linkedProjects.filter(id => id !== projectId)
            : [...prev.linkedProjects, projectId]
        }));
      };
      
      const addAgendaItem = () => {
        if (!newAgendaItem.trim()) return;
        setForm(prev => ({ ...prev, agenda: [...prev.agenda, newAgendaItem.trim()] }));
        setNewAgendaItem('');
      };
      
      const removeAgendaItem = (index) => {
        setForm(prev => ({ ...prev, agenda: prev.agenda.filter((_, i) => i !== index) }));
      };
      
      const applyTemplate = (templateId) => {
        const template = MEETING_TEMPLATES.find(t => t.id === templateId);
        if (template) {
          setForm(prev => ({ ...prev, content: template.content }));
          setSelectedTemplate(templateId);
        }
      };
      
      const handleSave = () => {
        if (!form.title.trim()) return alert('회의 제목을 입력해주세요.');
        if (form.attendees.length === 0) return alert('참석자를 선택해주세요.');
        onSave(form);
      };
      
      return (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000 }}>
          <div style={{ background: 'white', borderRadius: 20, width: 560, maxWidth: '95vw', maxHeight: '90vh', display: 'flex', flexDirection: 'column' }}>
            {/* 헤더 */}
            <div style={{ padding: '20px 24px', borderBottom: '1px solid #E5E8EB', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <h2 style={{ fontSize: 20, fontWeight: 700, color: '#191F28' }}>{isEdit ? '회의록 수정' : '새 회의록'}</h2>
              <button onClick={onClose} style={{ width: 36, height: 36, borderRadius: 10, border: 'none', background: '#F7F8FA', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}>
                <Icon name="x" size={20} color="#8B95A1" />
              </button>
            </div>
            
            {/* 본문 */}
            <div style={{ flex: 1, overflowY: 'auto', padding: 24 }}>
              {/* 회의 제목 */}
              <div style={{ marginBottom: 20 }}>
                <label style={{ display: 'block', fontSize: 14, fontWeight: 600, marginBottom: 8 }}>회의 제목 *</label>
                <input
                  type="text"
                  value={form.title}
                  onChange={(e) => setForm({ ...form, title: e.target.value })}
                  placeholder="예: 주간 정기회의"
                  style={{ width: '100%', padding: '12px 16px', borderRadius: 10, border: '1px solid #E5E8EB', fontSize: 15 }}
                />
              </div>
              
              {/* 회의 유형 */}
              <div style={{ marginBottom: 20 }}>
                <label style={{ display: 'block', fontSize: 14, fontWeight: 600, marginBottom: 8 }}>회의 유형</label>
                <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                  {MEETING_TYPES.map(t => (
                    <button
                      key={t.id}
                      onClick={() => setForm({ ...form, type: t.id })}
                      style={{
                        display: 'flex', alignItems: 'center', gap: 6,
                        padding: '8px 14px', borderRadius: 8,
                        border: form.type === t.id ? `2px solid ${t.color}` : '1px solid #E5E8EB',
                        background: form.type === t.id ? `${t.color}15` : 'white',
                        color: form.type === t.id ? t.color : '#6B7684',
                        fontSize: 13, fontWeight: 500, cursor: 'pointer'
                      }}
                    >
                      {t.icon} {t.label}
                    </button>
                  ))}
                </div>
              </div>
              
              {/* 일시 */}
              <div style={{ marginBottom: 20 }}>
                <label style={{ display: 'block', fontSize: 14, fontWeight: 600, marginBottom: 8 }}>일시</label>
                <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                  <input
                    type="date"
                    value={form.date}
                    onChange={(e) => setForm({ ...form, date: e.target.value })}
                    style={{ padding: '10px 12px', borderRadius: 8, border: '1px solid #E5E8EB', fontSize: 14 }}
                  />
                  <input
                    type="time"
                    value={form.startTime}
                    onChange={(e) => setForm({ ...form, startTime: e.target.value })}
                    style={{ padding: '10px 12px', borderRadius: 8, border: '1px solid #E5E8EB', fontSize: 14 }}
                  />
                  <span style={{ color: '#8B95A1' }}>~</span>
                  <input
                    type="time"
                    value={form.endTime}
                    onChange={(e) => setForm({ ...form, endTime: e.target.value })}
                    style={{ padding: '10px 12px', borderRadius: 8, border: '1px solid #E5E8EB', fontSize: 14 }}
                  />
                </div>
              </div>
              
              {/* 참석자 */}
              <div style={{ marginBottom: 20 }}>
                <label style={{ display: 'block', fontSize: 14, fontWeight: 600, marginBottom: 8 }}>참석자 *</label>
                <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                  {TEAM_MEMBERS.map(m => (
                    <button
                      key={m.id}
                      onClick={() => toggleAttendee(m.id)}
                      style={{
                        display: 'flex', alignItems: 'center', gap: 6,
                        padding: '8px 12px', borderRadius: 8,
                        border: form.attendees.includes(m.id) ? `2px solid ${m.color}` : '1px solid #E5E8EB',
                        background: form.attendees.includes(m.id) ? `${m.color}15` : 'white',
                        cursor: 'pointer'
                      }}
                    >
                      <div style={{ width: 24, height: 24, borderRadius: '50%', background: m.color, color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 10, fontWeight: 700 }}>
                        {m.initial}
                      </div>
                      <span style={{ fontSize: 13, fontWeight: 500, color: form.attendees.includes(m.id) ? '#191F28' : '#6B7684' }}>{m.name}</span>
                    </button>
                  ))}
                </div>
              </div>
              
              {/* 연결할 프로젝트 */}
              <div style={{ marginBottom: 20 }}>
                <label style={{ display: 'block', fontSize: 14, fontWeight: 600, marginBottom: 8 }}>
                  연결할 프로젝트 <span style={{ fontSize: 12, fontWeight: 400, color: '#8B95A1' }}>(선택)</span>
                </label>
                <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                  {projects.filter(p => !p.deletedAt).slice(0, 10).map(p => (
                    <button
                      key={p.id}
                      onClick={() => toggleProject(p.id)}
                      style={{
                        padding: '6px 12px', borderRadius: 6,
                        border: form.linkedProjects.includes(p.id) ? '2px solid #3182F6' : '1px solid #E5E8EB',
                        background: form.linkedProjects.includes(p.id) ? '#EBF4FF' : 'white',
                        color: form.linkedProjects.includes(p.id) ? '#3182F6' : '#6B7684',
                        fontSize: 12, cursor: 'pointer'
                      }}
                    >
                      📁 {p.title}
                    </button>
                  ))}
                </div>
              </div>
              
              {/* 템플릿 선택 (새 회의록일 때만) */}
              {!isEdit && (
                <div style={{ marginBottom: 20 }}>
                  <label style={{ display: 'block', fontSize: 14, fontWeight: 600, marginBottom: 8 }}>템플릿 사용</label>
                  <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                    {MEETING_TEMPLATES.map(t => (
                      <button
                        key={t.id}
                        onClick={() => applyTemplate(t.id)}
                        style={{
                          padding: '8px 14px', borderRadius: 8,
                          border: selectedTemplate === t.id ? '2px solid #3182F6' : '1px solid #E5E8EB',
                          background: selectedTemplate === t.id ? '#EBF4FF' : 'white',
                          color: selectedTemplate === t.id ? '#3182F6' : '#6B7684',
                          fontSize: 13, cursor: 'pointer'
                        }}
                      >
                        {t.name}
                      </button>
                    ))}
                  </div>
                </div>
              )}
              
              {/* 회의 내용 */}
              <div style={{ marginBottom: 20 }}>
                <label style={{ display: 'block', fontSize: 14, fontWeight: 600, marginBottom: 8 }}>
                  📝 회의 내용 <span style={{ fontSize: 12, fontWeight: 400, color: '#8B95A1' }}>(선택)</span>
                </label>
                <textarea
                  value={form.content}
                  onChange={(e) => setForm({ ...form, content: e.target.value })}
                  placeholder="회의 내용을 입력하세요...&#10;템플릿을 선택하면 자동으로 채워집니다."
                  style={{ 
                    width: '100%', 
                    padding: '12px 16px', 
                    borderRadius: 10, 
                    border: '1px solid #E5E8EB', 
                    fontSize: 14,
                    lineHeight: 1.6,
                    minHeight: 120,
                    resize: 'vertical',
                    fontFamily: 'inherit'
                  }}
                />
              </div>
              
              {/* 액션 아이템 - 수정 모드에서만 */}
              {isEdit ? (
                <div style={{ marginBottom: 20 }}>
                  <label style={{ display: 'block', fontSize: 14, fontWeight: 600, marginBottom: 8 }}>
                    📌 액션 아이템
                  </label>
                  
                  {/* 기존 액션 아이템 목록 */}
                  {form.actionItems.length > 0 && (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 12 }}>
                      {form.actionItems.map(ai => {
                        const assignee = TEAM_MEMBERS.find(m => m.id === ai.assignee);
                        return (
                          <div key={ai.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', background: '#F7F8FA', borderRadius: 8 }}>
                            <span style={{ color: ai.status === 'done' ? '#00C471' : '#D1D6DB' }}>{ai.status === 'done' ? '✅' : '☐'}</span>
                            <span style={{ flex: 1, fontSize: 13, color: '#191F28' }}>{ai.title}</span>
                            {assignee && (
                              <div style={{ width: 20, height: 20, borderRadius: '50%', background: assignee.color, color: 'white', fontSize: 9, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                                {assignee.initial}
                              </div>
                            )}
                            <button
                              onClick={() => removeActionItem(ai.id)}
                              style={{ width: 24, height: 24, borderRadius: 4, border: 'none', background: '#FEE4E2', color: '#F04452', fontSize: 12, cursor: 'pointer' }}
                            >
                              ✕
                            </button>
                          </div>
                        );
                      })}
                    </div>

                  {/* 새 액션 아이템 추가 폼 */}
                  <div style={{ display: 'flex', gap: 8 }}>
                    <input

                      value={newActionItem.title}

                      onKeyDown={(e) => e.key === 'Enter' && addActionItem()}
                      placeholder="액션 아이템 입력..."
                      style={{ flex: 1, padding: '10px 12px', borderRadius: 8, border: '1px solid #E5E8EB', fontSize: 13 }}
                    />
                    <select
                      value={newActionItem.assignee}
                      onChange={(e) => setNewActionItem({ ...newActionItem, assignee: Number(e.target.value) })}
                      style={{ padding: '10px 12px', borderRadius: 8, border: '1px solid #E5E8EB', fontSize: 13 }}
                    >
                      {TEAM_MEMBERS.map(m => (
                        <option key={m.id} value={m.id}>{m.name}</option>
                      ))}
                    </select>
                    <input
                      type="date"
                      value={newActionItem.dueDate}
                      onChange={(e) => setNewActionItem({ ...newActionItem, dueDate: e.target.value })}
                      style={{ padding: '10px 12px', borderRadius: 8, border: '1px solid #E5E8EB', fontSize: 13 }}
                    />

      // 주간 루틴
      const getWeekStart = (dateStr) => {
        const d = new Date(dateStr);
        const day = d.getDay();
        const diff = d.getDate() - day;
        return new Date(d.setDate(diff)).toISOString().split('T')[0];
      };
      const weekStart = getWeekStart(todayStr);
      const weeklyRoutines = fixedTasks.filter(t => {
