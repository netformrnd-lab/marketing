    // ============ 루틴 상세 모달 ============
    function RoutineDetailModal({ routine, onClose, onToggleComplete, onUpdateRecords, onUpdateTitle }) {
      const [showAddRecord, setShowAddRecord] = useState(false);
      const [newRecord, setNewRecord] = useState({ date: today, title: '', checked: false });
      const [editingRecord, setEditingRecord] = useState(null); // 수정 중인 기록
      const [filterMonth, setFilterMonth] = useState('all'); // 'all' 또는 'YYYY-MM'
      const [isEditingTitle, setIsEditingTitle] = useState(false); // 제목 수정 모드
      const [editTitle, setEditTitle] = useState(routine.title); // 수정 중인 제목
      
      // 주간 시작일 계산
      const getWeekStart = (dateStr) => {
        const d = new Date(dateStr);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        return formatDate(new Date(d.setDate(diff)));
      };
      
      const typeInfo = {
        daily: { label: '일일 루틴', icon: '☀️', color: '#F59E0B', bgColor: '#FEF3C7' },
        weekly: { label: '주간 루틴', icon: '📅', color: '#3B82F6', bgColor: '#DBEAFE' },
        monthly: { label: '월간 루틴', icon: '📆', color: '#9333EA', bgColor: '#F3E8FF' },
      };
      const info = typeInfo[routine.routineType] || typeInfo.daily;
      const completionKey = routine.routineType === 'weekly' 
        ? getWeekStart(routine.date) 
        : routine.routineType === 'monthly' 
          ? routine.date.slice(0, 7) + '-01' 
          : routine.date;
      const isCompleted = (routine.completedDates || []).includes(completionKey);
      const proj = BRANDS.find(p => p.id === routine.projectId);
      const records = routine.records || [];
      
      // 월별 필터링된 기록
      const filteredRecords = filterMonth === 'all' 
        ? records 
        : records.filter(r => r.date && r.date.startsWith(filterMonth));
      
      // 필터 가능한 월 목록 생성 (2025년 12월부터 현재 월까지)
      const generateMonthOptions = () => {
        const months = [];
        const startDate = new Date(2025, 11, 1); // 2025년 12월
        const currentDate = new Date();
        const endDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1); // 다음 달까지 포함
        
        let date = new Date(startDate);
        while (date <= endDate) {
          const year = date.getFullYear();
          const month = String(date.getMonth() + 1).padStart(2, '0');
          const monthKey = `${year}-${month}`;
          const count = records.filter(r => r.date?.startsWith(monthKey)).length;
          months.push({ key: monthKey, year, month: date.getMonth() + 1, count });
          date.setMonth(date.getMonth() + 1);
        }
        return months.reverse(); // 최신 월이 위로
      };
      const monthOptions = generateMonthOptions();
      
      const addRecord = () => {
        if (!newRecord.title.trim()) return;
        const record = { id: Date.now(), ...newRecord };
        onUpdateRecords([...records, record]);
        setNewRecord({ date: today, title: '', note: '' });
        setShowAddRecord(false);
      };
      
      const updateRecord = () => {
        if (!editingRecord || !editingRecord.title.trim()) return;
        onUpdateRecords(records.map(r => r.id === editingRecord.id ? editingRecord : r));
        setEditingRecord(null);
      };
      
      const deleteRecord = (recordId) => {
        onUpdateRecords(records.filter(r => r.id !== recordId));
      };
      
      return (
        <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.4)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1100 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: 'white', borderRadius: 20, padding: 24, width: '100%', maxWidth: 560, maxHeight: '85vh', overflow: 'auto' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 20 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <div style={{ width: 44, height: 44, borderRadius: 12, background: info.bgColor, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 24 }}>{info.icon}</div>
                <div>
                  <span style={{ fontSize: 12, fontWeight: 600, color: info.color }}>{info.label}</span>
                  {isEditingTitle ? (
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <input 
                        type="text"
                        value={editTitle}
                        onChange={(e) => setEditTitle(e.target.value)}
                        onKeyDown={(e) => {
                          if (e.key === 'Enter' && editTitle.trim()) {
                            onUpdateTitle(editTitle.trim());
                            setIsEditingTitle(false);
                          }
                          if (e.key === 'Escape') {
                            setEditTitle(routine.title);
                            setIsEditingTitle(false);
                          }
                        }}
                        autoFocus
                        style={{ fontSize: 18, fontWeight: 700, color: '#191F28', border: '1px solid #3182F6', borderRadius: 6, padding: '4px 8px', width: 200 }}
                      />
                      <button onClick={() => { if (editTitle.trim()) { onUpdateTitle(editTitle.trim()); setIsEditingTitle(false); } }} style={{ padding: '4px 8px', borderRadius: 6, border: 'none', background: '#3182F6', color: 'white', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>저장</button>
                      <button onClick={() => { setEditTitle(routine.title); setIsEditingTitle(false); }} style={{ padding: '4px 8px', borderRadius: 6, border: '1px solid #E5E8EB', background: 'white', color: '#6B7684', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>취소</button>
                    </div>
                  ) : (
                    <h3 
                      onClick={() => setIsEditingTitle(true)}
                      style={{ fontSize: 18, fontWeight: 700, color: '#191F28', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6 }}
                      title="클릭하여 수정"
                    >
                      {routine.title}
                      <Icon name="edit" size={14} color="#B0B8C1" />
                    </h3>
                  )}
                </div>
              </div>
              <button onClick={onClose} style={{ width: 36, height: 36, borderRadius: 10, border: 'none', background: '#F7F8FA', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}>
                <Icon name="x" size={20} color="#8B95A1" />
              </button>
            </div>
            
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 20 }}>
              {proj && <span style={{ padding: '6px 12px', borderRadius: 8, background: `${proj.color}15`, color: proj.color, fontSize: 13, fontWeight: 600 }}>{proj.name}</span>}
              <span style={{ padding: '6px 12px', borderRadius: 8, background: isCompleted ? '#D1FAE5' : '#FEE4E2', color: isCompleted ? '#059669' : '#F04452', fontSize: 13, fontWeight: 600 }}>
                {isCompleted ? '✓ 완료' : '○ 미완료'}
              </span>
            </div>
            
            <button 
              onClick={() => onToggleComplete(routine.id, routine.routineType)}
              style={{ width: '100%', padding: 14, borderRadius: 12, border: 'none', background: isCompleted ? '#F7F8FA' : info.color, fontSize: 15, fontWeight: 600, color: isCompleted ? '#6B7684' : 'white', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, marginBottom: 24 }}
            >
              {isCompleted ? (
                <><Icon name="x" size={18} color="#6B7684" /> 완료 취소</>
              ) : (
                <><Icon name="check" size={18} color="white" /> 완료로 표시</>
              )}
            </button>
            
            {/* 기록 히스토리 섹션 */}
            <div style={{ borderTop: '1px solid #E5E8EB', paddingTop: 20 }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                  <h4 style={{ fontSize: 15, fontWeight: 700, color: '#191F28', display: 'flex', alignItems: 'center', gap: 6 }}>
                    📝 기록 히스토리
                    <span style={{ fontSize: 12, fontWeight: 600, color: '#8B95A1' }}>({filteredRecords.length}{filterMonth !== 'all' ? `/${records.length}` : ''})</span>
                  </h4>
                  {/* 월별 필터 */}
                  <select
                    value={filterMonth}
                    onChange={(e) => setFilterMonth(e.target.value)}
                    style={{ 
                      padding: '4px 8px', borderRadius: 6, border: '1px solid #E5E8EB', 
                      fontSize: 12, color: '#6B7684', cursor: 'pointer', background: 'white'
                    }}
                  >
                    <option value="all">전체 ({records.length})</option>
                    {monthOptions.map(({ key, year, month, count }) => (
                      <option key={key} value={key}>
                        {year}년 {month}월 ({count})
                      </option>
                    ))}
                  </select>
                </div>
                <button 
                  onClick={() => setShowAddRecord(!showAddRecord)}
                  style={{ padding: '6px 12px', borderRadius: 8, border: '1px solid #E5E8EB', background: showAddRecord ? '#F7F8FA' : 'white', fontSize: 13, fontWeight: 600, color: '#3182F6', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 4 }}
                >
                  <Icon name="plus" size={14} color="#3182F6" /> 기록 추가
                </button>
              </div>
              
              {/* 기록 추가 폼 */}
              {showAddRecord && (
                <div style={{ background: '#F7F8FA', borderRadius: 12, padding: 16, marginBottom: 16 }}>
                  <div style={{ display: 'grid', gridTemplateColumns: '100px 1fr', gap: 12, marginBottom: 12 }}>
                    <div>
                      <label style={{ fontSize: 12, fontWeight: 600, color: '#6B7684', marginBottom: 4, display: 'block' }}>날짜</label>
                      <input 
                        type="date" 
                        value={newRecord.date} 
                        onChange={(e) => setNewRecord({ ...newRecord, date: e.target.value })}
                        style={{ width: '100%', padding: '8px 10px', borderRadius: 8, border: '1px solid #E5E8EB', fontSize: 13 }}
                      />
                    </div>
                    <div>
                      <label style={{ fontSize: 12, fontWeight: 600, color: '#6B7684', marginBottom: 4, display: 'block' }}>제목 *</label>
                      <input 
                        type="text" 
                        value={newRecord.title} 
                        onChange={(e) => setNewRecord({ ...newRecord, title: e.target.value })}
                        placeholder="예: AI 트렌드 2025"
                        style={{ width: '100%', padding: '8px 10px', borderRadius: 8, border: '1px solid #E5E8EB', fontSize: 13 }}
                      />
                    </div>
                  </div>
                  <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
                    <button onClick={() => setShowAddRecord(false)} style={{ padding: '8px 16px', borderRadius: 8, border: '1px solid #E5E8EB', background: 'white', fontSize: 13, fontWeight: 600, color: '#6B7684', cursor: 'pointer' }}>취소</button>
                    <button onClick={addRecord} disabled={!newRecord.title.trim()} style={{ padding: '8px 16px', borderRadius: 8, border: 'none', background: newRecord.title.trim() ? '#3182F6' : '#E5E8EB', fontSize: 13, fontWeight: 600, color: newRecord.title.trim() ? 'white' : '#8B95A1', cursor: newRecord.title.trim() ? 'pointer' : 'default' }}>추가</button>
                  </div>
                </div>
              )}
              
              {/* 수정 폼 */}
              {editingRecord && (
                <div style={{ background: '#FFF7ED', borderRadius: 12, padding: 16, marginBottom: 16, border: '1px solid #FDBA74' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}>
                    <span style={{ fontSize: 13, fontWeight: 600, color: '#EA580C' }}>✏️ 기록 수정</span>
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: '100px 1fr', gap: 12, marginBottom: 12 }}>
                    <div>
                      <label style={{ fontSize: 12, fontWeight: 600, color: '#6B7684', marginBottom: 4, display: 'block' }}>날짜</label>
                      <input 
                        type="date" 
                        value={editingRecord.date} 
                        onChange={(e) => setEditingRecord({ ...editingRecord, date: e.target.value })}
                        style={{ width: '100%', padding: '8px 10px', borderRadius: 8, border: '1px solid #E5E8EB', fontSize: 13 }}
                      />
                    </div>
                    <div>
                      <label style={{ fontSize: 12, fontWeight: 600, color: '#6B7684', marginBottom: 4, display: 'block' }}>제목 *</label>
                      <input 
                        type="text" 
                        value={editingRecord.title} 
                        onChange={(e) => setEditingRecord({ ...editingRecord, title: e.target.value })}
                        placeholder="예: AI 트렌드 2025"
                        style={{ width: '100%', padding: '8px 10px', borderRadius: 8, border: '1px solid #E5E8EB', fontSize: 13 }}
                      />
                    </div>
                  </div>
                  <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
                    <button onClick={() => setEditingRecord(null)} style={{ padding: '8px 16px', borderRadius: 8, border: '1px solid #E5E8EB', background: 'white', fontSize: 13, fontWeight: 600, color: '#6B7684', cursor: 'pointer' }}>취소</button>
                    <button onClick={updateRecord} disabled={!editingRecord.title.trim()} style={{ padding: '8px 16px', borderRadius: 8, border: 'none', background: editingRecord.title.trim() ? '#EA580C' : '#E5E8EB', fontSize: 13, fontWeight: 600, color: editingRecord.title.trim() ? 'white' : '#8B95A1', cursor: editingRecord.title.trim() ? 'pointer' : 'default' }}>수정 완료</button>
                  </div>
                </div>
              )}
              
              {/* 기록 테이블 */}
              {filteredRecords.length > 0 ? (
                <div style={{ border: '1px solid #E5E8EB', borderRadius: 12, overflow: 'hidden' }}>
                  <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
                    <thead>
                      <tr style={{ background: '#F7F8FA' }}>
                        <th style={{ padding: '10px 12px', textAlign: 'left', fontWeight: 600, color: '#6B7684', borderBottom: '1px solid #E5E8EB', width: 80 }}>날짜</th>
                        <th style={{ padding: '10px 12px', textAlign: 'left', fontWeight: 600, color: '#6B7684', borderBottom: '1px solid #E5E8EB' }}>제목</th>
                        <th style={{ padding: '10px 12px', textAlign: 'center', fontWeight: 600, color: '#6B7684', borderBottom: '1px solid #E5E8EB', width: 60 }}>확인</th>
                        <th style={{ padding: '10px 12px', textAlign: 'center', fontWeight: 600, color: '#6B7684', borderBottom: '1px solid #E5E8EB', width: 70 }}></th>
                      </tr>
                    </thead>
                    <tbody>
                      {[...filteredRecords].sort((a, b) => b.date.localeCompare(a.date)).map((record, idx) => (
                        <tr key={record.id} style={{ background: editingRecord?.id === record.id ? '#FFF7ED' : (idx % 2 === 1 ? '#FAFBFC' : 'white') }}>
                          <td style={{ padding: '10px 12px', color: '#191F28', borderBottom: idx < filteredRecords.length - 1 ? '1px solid #F2F3F5' : 'none' }}>
                            {record.date.slice(5).replace('-', '/')}
                          </td>
                          <td style={{ padding: '10px 12px', color: '#191F28', fontWeight: 500, borderBottom: idx < filteredRecords.length - 1 ? '1px solid #F2F3F5' : 'none' }}>
                            {record.title}
                          </td>
                          <td style={{ padding: '10px 12px', textAlign: 'center', borderBottom: idx < filteredRecords.length - 1 ? '1px solid #F2F3F5' : 'none' }}>
                            <button
                              onClick={() => {
                                const updated = records.map(r => r.id === record.id ? { ...r, checked: !r.checked } : r);
                                onUpdateRecords(updated);
                              }}
                              style={{ 
                                width: 22, height: 22, borderRadius: 6, 
                                border: record.checked ? 'none' : '2px solid #D1D5DB',
                                background: record.checked ? '#3182F6' : 'white',
                                cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center'
                              }}
                            >
                              {record.checked && <Icon name="check" size={14} color="white" />}
                            </button>
                          </td>
                          <td style={{ padding: '10px 8px', textAlign: 'center', borderBottom: idx < filteredRecords.length - 1 ? '1px solid #F2F3F5' : 'none' }}>
                            <div style={{ display: 'flex', gap: 4, justifyContent: 'center' }}>
                              <button onClick={() => setEditingRecord({ ...record })} style={{ width: 24, height: 24, borderRadius: 6, border: 'none', background: 'transparent', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }} title="수정">
                                <Icon name="edit" size={14} color="#3182F6" />
                              </button>
                              <button onClick={() => deleteRecord(record.id)} style={{ width: 24, height: 24, borderRadius: 6, border: 'none', background: 'transparent', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }} title="삭제">
                                <Icon name="trash" size={14} color="#B0B8C1" />
                              </button>
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              ) : (
                <div style={{ textAlign: 'center', padding: '24px 0', color: '#8B95A1', fontSize: 13 }}>
                  {filterMonth !== 'all' ? `${filterMonth.split('-')[0]}년 ${parseInt(filterMonth.split('-')[1])}월 기록이 없습니다` : '아직 기록이 없습니다'}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ============ 삭제 확인 모달 ============
    function ConfirmModal({ title, message, onConfirm, onCancel, confirmText = '삭제', confirmColor = '#F04452' }) {
      useEscapeKey(onCancel);
      return (
        <div onClick={onCancel} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1200 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: 'white', borderRadius: 20, padding: 28, width: '100%', maxWidth: 400 }}>
            <div style={{ textAlign: 'center', marginBottom: 24 }}>
              <div style={{ width: 56, height: 56, borderRadius: '50%', background: '#FEE4E2', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 16px' }}>
                <Icon name="trash" size={28} color="#F04452" />
              </div>
              <h3 style={{ fontSize: 18, fontWeight: 700, color: '#191F28', marginBottom: 8 }}>{title}</h3>
              <p style={{ fontSize: 14, color: '#6B7684', lineHeight: 1.5 }}>{message}</p>
            </div>
            <div style={{ display: 'flex', gap: 12 }}>
              <button onClick={onCancel} style={{ flex: 1, padding: 14, borderRadius: 12, border: '1px solid #E5E8EB', background: 'white', fontSize: 15, fontWeight: 600, color: '#6B7684', cursor: 'pointer' }}>
                취소
              </button>
              <button onClick={onConfirm} style={{ flex: 1, padding: 14, borderRadius: 12, border: 'none', background: confirmColor, fontSize: 15, fontWeight: 600, color: 'white', cursor: 'pointer' }}>
                {confirmText}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ============ 고정업무 추가 모달 ============
    function FixedTaskModal({ routineType, onSave, onClose }) {
      useEscapeKey(onClose);
      const [form, setForm] = useState({ title: '', projectId: null, routineType: routineType });
      
      const typeInfo = {
        daily: { label: '일일 루틴 업무', icon: '☀️', color: '#F59E0B' },
        weekly: { label: '주간 루틴 업무', icon: '📅', color: '#3B82F6' },
        monthly: { label: '월간 루틴 업무', icon: '📆', color: '#9333EA' },
      };
      const info = typeInfo[routineType] || typeInfo.daily;
      
      return (
        <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1100 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: 'white', borderRadius: 20, padding: 28, width: '100%', maxWidth: 480, maxHeight: '90vh', overflow: 'auto' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 24 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                <span style={{ fontSize: 24 }}>{info.icon}</span>
                <h2 style={{ fontSize: 20, fontWeight: 700, color: '#191F28' }}>{info.label} 추가</h2>
              </div>
              <button onClick={onClose} style={{ width: 36, height: 36, borderRadius: 10, border: 'none', background: '#F7F8FA', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <Icon name="x" size={20} color="#8B95A1" />
              </button>
            </div>
            
            <div style={{ marginBottom: 20 }}>
              <label style={{ display: 'block', fontSize: 14, fontWeight: 600, marginBottom: 8 }}>업무명 *</label>
              <input 
                type="text" 
                value={form.title} 
                onChange={(e) => setForm({ ...form, title: e.target.value })}
                placeholder={routineType === 'daily' ? '매일 수행할 업무' : routineType === 'weekly' ? '매주 수행할 업무' : '매월 수행할 업무'}
                style={{ width: '100%', padding: '14px 16px', borderRadius: 12, border: '1px solid #E5E8EB', fontSize: 15 }}
                autoFocus
              />
            </div>
            
            <div style={{ marginBottom: 24 }}>
              <label style={{ display: 'block', fontSize: 14, fontWeight: 600, marginBottom: 8 }}>프로젝트</label>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                <button onClick={() => setForm({ ...form, projectId: null })} style={{ padding: '10px 16px', borderRadius: 10, border: form.projectId === null ? '2px solid #3182F6' : '1px solid #E5E8EB', background: form.projectId === null ? '#EBF4FF' : 'white', color: form.projectId === null ? '#3182F6' : '#6B7684', fontSize: 14, fontWeight: 500 }}>없음</button>
                {BRANDS.map(b => (
                  <button key={b.id} onClick={() => setForm({ ...form, projectId: b.id })} style={{ padding: '10px 16px', borderRadius: 10, border: form.projectId === b.id ? `2px solid ${b.color}` : '1px solid #E5E8EB', background: form.projectId === b.id ? `${b.color}15` : 'white', color: form.projectId === b.id ? b.color : '#6B7684', fontSize: 14, fontWeight: 500 }}>{b.name}</button>
                ))}
              </div>
            </div>
            
            <div style={{ display: 'flex', gap: 12 }}>
              <button onClick={onClose} style={{ flex: 1, padding: 16, borderRadius: 12, border: '1px solid #E5E8EB', background: 'white', fontSize: 15, fontWeight: 600, color: '#6B7684' }}>취소</button>
              <button 
                onClick={() => form.title.trim() && onSave(form)} 
                disabled={!form.title.trim()}
                style={{ flex: 1, padding: 16, borderRadius: 12, border: 'none', background: form.title.trim() ? info.color : '#E5E8EB', fontSize: 15, fontWeight: 600, color: form.title.trim() ? 'white' : '#8B95A1' }}
              >
                추가하기
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ============ 루틴 섹션 컴포넌트 ============
    function RoutineSection({ title, type, icon, bgColor, borderColor, textColor, buttonColor, tasks, stats, isCompleted, onToggle, onDelete, onAdd, onItemClick }) {
      const [isCollapsed, setIsCollapsed] = useState(false);
      
      return (
        <div style={{ background: 'white', borderRadius: 12, border: `1px solid ${borderColor}`, overflow: 'hidden' }}>
          {/* 헤더 */}
          <div 
            onClick={() => setIsCollapsed(!isCollapsed)}
            style={{ 
              display: 'flex', alignItems: 'center', justifyContent: 'space-between',
              padding: '14px 16px', background: bgColor, cursor: 'pointer'
            }}
          >
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ fontSize: 16 }}>{icon}</span>
              <span style={{ fontSize: 14, fontWeight: 700, color: textColor }}>{title}</span>
              <span style={{ padding: '3px 8px', borderRadius: 8, background: `${buttonColor}20`, color: textColor, fontSize: 13, fontWeight: 600 }}>{stats.completed}/{stats.total}</span>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <button 
                onClick={(e) => { e.stopPropagation(); onAdd(); }}
                style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '8px 14px', borderRadius: 8, background: buttonColor, border: 'none', color: 'white', fontSize: 13, fontWeight: 600, cursor: 'pointer' }}
              >
                <Icon name="plus" size={14} color="white" /> 추가
              </button>
              <div style={{ transform: isCollapsed ? 'rotate(0deg)' : 'rotate(180deg)', transition: 'transform 0.2s' }}>
                <Icon name="chevronDown" size={16} color={textColor} />
              </div>
            </div>
          </div>
          
          {/* 리스트 */}
          {!isCollapsed && (
            tasks.length === 0 ? (
              <div style={{ padding: '20px', textAlign: 'center', background: `${bgColor}50` }}>
                <p style={{ fontSize: 13, color: textColor }}>등록된 업무가 없습니다</p>
              </div>
            ) : (
              tasks.map((task, idx) => {
                const proj = BRANDS.find(p => p.id === task.projectId);
                const completed = isCompleted(task);
                const hasRecords = (task.records || []).length > 0;
                return (
                  <div 
                    key={task.id}
                    style={{ 
                      display: 'flex', alignItems: 'center', gap: 10,
                      padding: '12px 16px', background: `${bgColor}50`,
                      borderTop: `1px solid ${borderColor}`
                    }}
                  >
                    <button onClick={(e) => { e.stopPropagation(); onToggle(task.id); }} style={{ width: 24, height: 24, borderRadius: 6, border: 'none', background: completed ? buttonColor : 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 1px 2px rgba(0,0,0,0.1)', cursor: 'pointer', flexShrink: 0 }}>
                      {completed && <Icon name="check" size={14} color="white" />}
                    </button>
                    <span style={{ flex: 1, fontSize: 14, fontWeight: 500, color: completed ? '#8B95A1' : '#191F28', textDecoration: completed ? 'line-through' : 'none', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{task.title}</span>

    // ============ 메모 패널 ============
    function NotePanel({ task, onClose, onUpdateTask }) {
      const [note, setNote] = useState(task.note || '');
      const [taskDate, setTaskDate] = useState(task.date || today);
      const [isEditing, setIsEditing] = useState(false);
      const [attachments, setAttachments] = useState(task.attachments || []);
      const fileInputRef = React.useRef(null);
      const proj = BRANDS.find(p => p.id === task.projectId);

      const handleSave = () => { 
        onUpdateTask({ note, date: taskDate, attachments }); 
        setIsEditing(false); 
      };
      
      const [isUploading, setIsUploading] = useState(false);
      const [uploadProgress, setUploadProgress] = useState(0);
      
      const handleFileSelect = async (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;
        
        // 파일 크기 체크 (10MB 제한)
        const maxSize = 10 * 1024 * 1024;
        for (const file of files) {
          if (file.size > maxSize) {
            alert(`파일 크기가 너무 큽니다 (최대 10MB)\n${file.name}: ${(file.size / 1024 / 1024).toFixed(1)}MB`);
            e.target.value = '';
            return;
          }
        }
        
        setIsUploading(true);
        setUploadProgress(0);
        
        for (const file of files) {
          try {
            // Firebase Storage에 업로드
            const path = `attachments/worklog/${task.id}/${Date.now()}_${file.name}`;
            const result = await FirebaseService.uploadFile(file, path, (progress) => {
              setUploadProgress(progress);
            });
            
            if (result) {
              const newAttachment = {
                id: Date.now() + Math.random(),
                name: result.name,
                size: result.size,
                type: result.type,
                url: result.url,
                path: path
              };
              const updated = [...attachments, newAttachment];
              setAttachments(updated);
              onUpdateTask({ note, date: taskDate, attachments: updated });
            } else {
              alert(`파일 업로드 실패: ${file.name}`);
            }
          } catch (error) {
            console.error('File upload error:', error);
            alert(`파일 업로드 실패: ${error.message || '알 수 없는 오류'}`);
          }
        }
        
        setIsUploading(false);
        e.target.value = '';
      };
      
      const removeAttachment = async (id) => {
        const attachment = attachments.find(a => a.id === id);
        // Firebase Storage에서 파일 삭제
        if (attachment?.path) {
          await FirebaseService.deleteFile(attachment.path);
        }
        const updated = attachments.filter(a => a.id !== id);
        setAttachments(updated);
        onUpdateTask({ note, date: taskDate, attachments: updated });
      };

      // task가 변경되면 상태 업데이트
      React.useEffect(() => { 
        setNote(task.note || ''); 
        setTaskDate(task.date || today);
        setAttachments(task.attachments || []);
      }, [task.id, task.note, task.date, task.attachments]);

      return (
        <>
          {/* 바깥 영역 클릭 시 닫기 위한 오버레이 */}
          <div 
            onClick={onClose} 
            style={{ position: 'fixed', top: 0, left: 0, right: 420, bottom: 0, zIndex: 999 }}

          {/* 메모 패널 */}

          <div style={{ padding: '20px 24px', borderBottom: '1px solid #E5E8EB' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
              <h3 style={{ fontSize: 18, fontWeight: 700, color: '#191F28' }}>📝 업무 메모</h3>
              <button onClick={onClose} style={{ width: 32, height: 32, borderRadius: 8, border: 'none', background: '#F7F8FA', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <Icon name="x" size={18} color="#6B7684" />
              </button>
            </div>

            <div style={{ background: '#F7F8FA', borderRadius: 12, padding: 16 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
                {task.completed ? (
                  <div style={{ width: 22, height: 22, borderRadius: 6, background: '#3182F6', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    <Icon name="check" size={14} color="white" />
                  </div>
                ) : (
                  <div style={{ width: 22, height: 22, borderRadius: 6, border: '2px solid #D1D6DB' }} />
                )}
                <span style={{ fontSize: 16, fontWeight: 600, color: task.completed ? '#8B95A1' : '#191F28', textDecoration: task.completed ? 'line-through' : 'none', flex: 1 }}>{task.title}</span>
                {task.bookmark && <Icon name="bookmarkFill" size={16} color="#F59E0B" />}
              </div>
              {proj && (
                <div style={{ marginTop: 8 }}>

              )}
            </div>

          <div style={{ flex: 1, padding: 24, overflow: 'auto' }}>
            {/* 날짜 수정 영역 */}

              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>

              </div>
              <input 
                type="date" 
                value={taskDate} 
                onChange={(e) => {
                  setTaskDate(e.target.value);

                style={{ width: '100%', padding: '12px 14px', borderRadius: 10, border: '1px solid #E5E8EB', fontSize: 14, background: 'white', cursor: 'pointer' }}

                <button onClick={() => setIsEditing(true)} style={{ display: 'flex', alignItems: 'center', gap: 4, padding: '6px 12px', borderRadius: 6, border: 'none', background: '#EBF4FF', color: '#3182F6', fontSize: 13, fontWeight: 500 }}>
                  <Icon name="edit" size={14} color="#3182F6" /> 수정
                </button>
              )}
            </div>

            {isEditing ? (
              <div>
                <textarea
                  value={note}
                  onChange={(e) => setNote(e.target.value)}
                  placeholder="메모를 입력하세요..."
                  style={{ width: '100%', minHeight: 200, padding: 16, borderRadius: 12, border: '2px solid #3182F6', fontSize: 14, lineHeight: 1.8, resize: 'none', outline: 'none' }}
                  autoFocus
                />
                <div style={{ display: 'flex', gap: 8, marginTop: 12 }}>
                  <button onClick={() => { setNote(task.note || ''); setIsEditing(false); }} style={{ flex: 1, padding: 12, borderRadius: 8, border: '1px solid #E5E8EB', background: 'white', fontSize: 14, fontWeight: 600, color: '#6B7684' }}>취소</button>
                  <button onClick={handleSave} style={{ flex: 1, padding: 12, borderRadius: 8, border: 'none', background: '#3182F6', fontSize: 14, fontWeight: 600, color: 'white' }}>저장</button>
                </div>
              </div>
            ) : (
              <div onClick={() => setIsEditing(true)} style={{ minHeight: 160, padding: 16, borderRadius: 12, background: '#F7F8FA', fontSize: 14, lineHeight: 1.8, color: note ? '#191F28' : '#8B95A1', whiteSpace: 'pre-wrap', cursor: 'pointer', border: '2px dashed transparent', transition: 'border-color 0.2s' }} onMouseEnter={(e) => e.target.style.borderColor = '#D1D6DB'} onMouseLeave={(e) => e.target.style.borderColor = 'transparent'}>
                {note || '메모를 작성하려면 클릭하세요...'}
              </div>
            )}
            
            {/* 첨부파일 영역 */}
            <div style={{ marginTop: 24 }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
                <span style={{ fontSize: 14, fontWeight: 600, color: '#191F28' }}>첨부파일</span>

                  style={{ display: 'flex', alignItems: 'center', gap: 4, padding: '6px 12px', borderRadius: 6, border: 'none', background: isUploading ? '#E5E8EB' : '#EBF4FF', color: isUploading ? '#8B95A1' : '#3182F6', fontSize: 13, fontWeight: 500, cursor: isUploading ? 'not-allowed' : 'pointer' }}

    function TaskModal({ task, date, onSave, onClose, existingSubtasks = [] }) {
      useEscapeKey(onClose);
      const [form, setForm] = useState({ title: task?.title || '', projectId: task?.projectId || null, date: task?.date || date, note: task?.note || '', bookmark: task?.bookmark || false });
      // 하위업무 상태 (신규 추가 시에만 사용, 수정 시에는 기존 서브태스크 표시)
      const [subtasks, setSubtasks] = useState(existingSubtasks.map(st => ({ id: st.id, title: st.title, isExisting: true })));
      const [newSubtaskTitle, setNewSubtaskTitle] = useState('');
      const subtaskInputRef = useRef(null);
      
      // 하위업무 추가
      const addSubtask = () => {
        if (newSubtaskTitle.trim()) {
          setSubtasks(prev => [...prev, { id: `new-${Date.now()}`, title: newSubtaskTitle.trim(), isExisting: false }]);
          setNewSubtaskTitle('');
          subtaskInputRef.current?.focus();
        }
      };
      
      // 하위업무 삭제
      const removeSubtask = (id) => {
        setSubtasks(prev => prev.filter(st => st.id !== id));
      };
      
      // 하위업무 수정
      const updateSubtask = (id, title) => {
        setSubtasks(prev => prev.map(st => st.id === id ? { ...st, title } : st));
      };
      
      // Enter 키로 하위업무 추가
      const handleSubtaskKeyDown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          addSubtask();
        }
      };
      
      // 저장 시 하위업무 정보도 함께 전달
      const handleSave = () => {
        if (form.title.trim()) {
          const newSubtasks = subtasks.filter(st => !st.isExisting).map(st => ({ title: st.title }));
          const updatedExisting = subtasks.filter(st => st.isExisting).map(st => ({ id: st.id, title: st.title }));
          onSave({ ...task, ...form, newSubtasks, updatedSubtasks: updatedExisting });
        }
      };
      
      return (
        <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: 'white', borderRadius: 20, padding: 24, width: '100%', maxWidth: 480, maxHeight: '90vh', overflow: 'auto' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 20 }}>

            </div>
            <div style={{ marginBottom: 16 }}>

              <select value={form.projectId || ''} onChange={(e) => setForm({ ...form, projectId: e.target.value ? Number(e.target.value) : null })} style={{ width: '100%', padding: '12px 14px', borderRadius: 10, border: '1px solid #E5E8EB', fontSize: 14 }}>
                <option value="">개인 업무</option>

            {/* 하위업무 섹션 */}
            <div style={{ marginBottom: 16 }}>

                  {subtasks.map((st, idx) => (

                      <span style={{ color: '#3182F6', fontSize: 12, flexShrink: 0 }}>↳</span>
                      <input
                        type="text"

                        style={{ flex: 1, padding: '6px 10px', borderRadius: 6, border: '1px solid transparent', background: 'white', fontSize: 13 }}
                      />
                      <button
                        onClick={() => removeSubtask(st.id)}
                        style={{ width: 24, height: 24, borderRadius: 6, border: 'none', background: 'transparent', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}
                      >
                        <Icon name="x" size={14} color="#8B95A1" />
                      </button>
                    </div>
                  ))}
                </div>
              )}
              
              {/* 하위업무 입력 */}
              <div style={{ display: 'flex', gap: 8 }}>
                <input
                  ref={subtaskInputRef}

                <button
                  onClick={addSubtask}

                  style={{ padding: '10px 16px', borderRadius: 10, border: 'none', background: newSubtaskTitle.trim() ? '#3182F6' : '#E5E8EB', color: newSubtaskTitle.trim() ? 'white' : '#8B95A1', fontSize: 13, fontWeight: 600, cursor: newSubtaskTitle.trim() ? 'pointer' : 'not-allowed', whiteSpace: 'nowrap' }}
                >
                  추가
                </button>

            <div style={{ marginBottom: 16 }}>
              <label style={{ display: 'block', fontSize: 13, fontWeight: 600, color: '#191F28', marginBottom: 8 }}>메모</label>
              <textarea value={form.note} onChange={(e) => setForm({ ...form, note: e.target.value })} placeholder="메모를 입력하세요 (선택사항)" rows={3} style={{ width: '100%', padding: '12px 14px', borderRadius: 10, border: '1px solid #E5E8EB', fontSize: 14, resize: 'none', lineHeight: 1.5 }} />
            </div>
            <label style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 20, cursor: 'pointer' }}>
              <input type="checkbox" checked={form.bookmark} onChange={(e) => setForm({ ...form, bookmark: e.target.checked })} style={{ width: 18, height: 18 }} />
              <span style={{ fontSize: 14, color: '#191F28' }}>중요 업무로 표시</span>
            </label>

              <button onClick={onClose} style={{ flex: 1, padding: 14, borderRadius: 10, border: '1px solid #E5E8EB', background: 'white', fontSize: 14, fontWeight: 600, color: '#6B7684', cursor: 'pointer' }}>취소</button>
              <button onClick={handleSave} disabled={!form.title.trim()} style={{ flex: 1, padding: 14, borderRadius: 10, border: 'none', background: form.title.trim() ? '#3182F6' : '#E5E8EB', fontSize: 14, fontWeight: 600, color: form.title.trim() ? 'white' : '#8B95A1', cursor: form.title.trim() ? 'pointer' : 'not-allowed' }}>{task ? '수정' : '추가'}</button>
            </div>
          </div>
        </div>
      );
    }

    // ============ 프로젝트 탭 ============
    function ProjectTab({ projects, setProjects, tasks, setTasks, currentUser, readComments, setReadComments, projectTemplates, meetings = [], setMeetings }) {
      const [viewMode, setViewMode] = useState('projects'); // 'projects' | 'tasks'
      const [selectedBrand, setSelectedBrand] = useState(null);
      const [selectedProject, setSelectedProject] = useState(null);
      const [showAddProject, setShowAddProject] = useState(false);
      const [filterStatus, setFilterStatus] = useState('progress');
      const [searchQuery, setSearchQuery] = useState('');
      const [searchDate, setSearchDate] = useState('');
      
      // 삭제 확인 모달 상태
      const [confirmDelete, setConfirmDelete] = useState(null); // { type: 'project' | 'task', id, title }
      
      // ESC 키로 모달 닫기
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            // confirmDelete는 항상 최우선 (zIndex가 가장 높음)
            if (confirmDelete) { setConfirmDelete(null); return; }
            // selectedProject가 열려있으면 ProjectDetailSlide에서 처리
            if (selectedProject) return;
            if (showAddProject) setShowAddProject(false);
          }
        };
        document.addEventListener('keydown', handleKeyDown);
        return () => document.removeEventListener('keydown', handleKeyDown);
      }, [confirmDelete, showAddProject, selectedProject]);
      
      // 업무 검색 뷰 필터
      const [taskSearchQuery, setTaskSearchQuery] = useState('');
      const [taskDateRange, setTaskDateRange] = useState({ start: '', end: '' });
      const [taskFilterBrand, setTaskFilterBrand] = useState(null); // 브랜드 필터
      const [taskFilterStatus, setTaskFilterStatus] = useState('all');
      const [taskFilterMember, setTaskFilterMember] = useState(null); // null = 전체

      const filteredProjects = useMemo(() => { 
        let r = projects; 
        if (selectedBrand) r = r.filter(p => p.brandId === selectedBrand); 
        if (filterStatus) r = r.filter(p => p.status === filterStatus); 
        // 텍스트 검색 필터
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          r = r.filter(p => 
            p.title.toLowerCase().includes(q) || 
            p.description?.toLowerCase().includes(q)
          );
        }
        // 날짜 검색 필터 (완료: completedDate, 보류: createdDate)
        if (searchDate && filterStatus === 'complete') {
          r = r.filter(p => p.completedDate && p.completedDate.startsWith(searchDate.slice(0, 7)));
        }
        if (searchDate && filterStatus === 'hold') {
          r = r.filter(p => p.createdDate && p.createdDate.startsWith(searchDate.slice(0, 7)));
        }
        // 우선순위 정렬 (긴급 → 보통 → 여유 → 없음)
        r = r.sort((a, b) => {
          const priorityA = PRIORITY_OPTIONS.find(p => p.id === a.priority)?.order ?? 3;
          const priorityB = PRIORITY_OPTIONS.find(p => p.id === b.priority)?.order ?? 3;
          if (priorityA !== priorityB) return priorityA - priorityB;
          // 같은 우선순위면 최신순
          return (b.createdDate || '').localeCompare(a.createdDate || '');
        });
        return r; 
      }, [projects, selectedBrand, filterStatus, searchQuery, searchDate]);
      
      // 업무 검색 뷰용 필터링된 업무
      const filteredTasks = useMemo(() => {
        // 프로젝트에 속한 업무
        let result = tasks.filter(t => {
          const project = projects.find(p => p.id === t.projectId);
          return project;
        });
        
        // 담당자 필터
        if (taskFilterMember) {
          result = result.filter(t => t.memberId === taskFilterMember);
        }
        
        // 브랜드 필터
        if (taskFilterBrand) {
          result = result.filter(t => {
            const project = projects.find(p => p.id === t.projectId);
            return project && project.brandId === taskFilterBrand;
          });
        }
        
        // 텍스트 검색 (업무명, 메모, 프로젝트명)
        if (taskSearchQuery.trim()) {
          const q = taskSearchQuery.toLowerCase();
          result = result.filter(t => {
            const project = projects.find(p => p.id === t.projectId);
            return t.title.toLowerCase().includes(q) || 
                   t.memo?.toLowerCase().includes(q) ||
                   project?.title.toLowerCase().includes(q);
          });
        }
        
        // 날짜 범위 필터
        if (taskDateRange.start) result = result.filter(t => t.date >= taskDateRange.start);
        if (taskDateRange.end) result = result.filter(t => t.date <= taskDateRange.end);
        
        // 완료된 업무만 표시
        result = result.filter(t => t.completed);
        
        // 정렬: 날짜 내림차순 → 같은 날짜면 프로젝트별로 묶기
        return result.sort((a, b) => {
          const dateCompare = b.date.localeCompare(a.date);
          if (dateCompare !== 0) return dateCompare;
          return a.projectId - b.projectId;
        });
      }, [tasks, projects, taskSearchQuery, taskDateRange, taskFilterBrand, taskFilterMember]);
      
      const getProjectStats = (pid) => { const pt = tasks.filter(t => t.projectId === pid); return { total: pt.length, completed: pt.filter(t => t.completed).length }; };
      const getUnreadCount = (pid) => { const p = projects.find(x => x.id === pid); return p ? Math.max(0, (p.comments || []).length - (readComments[pid] || 0)) : 0; };
      const openProject = (p) => { setSelectedProject(p); setReadComments(prev => ({ ...prev, [p.id]: (p.comments || []).length })); };
      const addProject = (p) => {
        const projectId = Date.now();
        const newProject = { ...p, id: projectId, comments: [], creatorId: currentUser.id, memberIds: (p.memberIds && p.memberIds.length > 0) ? p.memberIds : [currentUser.id] };
        setProjects(prev => [...prev, newProject]);
        
        // 템플릿이 선택된 경우 업무 자동 생성
        if (p.templateId) {
          const template = projectTemplates.find(t => t.id === p.templateId);
          if (template) {
            const newTasks = template.tasks.map((task, idx) => ({
              id: projectId + idx + 1,
              projectId: projectId,
              title: task.title,
              order: task.order,
              completed: false,
              note: '',
              bookmark: false,
              memberId: currentUser.id,
              date: today
            }));
            setTasks(prev => [...prev, ...newTasks]);
          }
        }
      };
      const updateProject = (p) => { setProjects(prev => prev.map(x => x.id === p.id ? { ...x, ...p } : x)); if (selectedProject?.id === p.id) setSelectedProject(prev => ({ ...prev, ...p })); };
      // 휴지통으로 이동 (deletedAt 추가)
      const deleteProject = (pid) => { 
        const now = Date.now();
        setProjects(prev => prev.map(p => p.id === pid ? { ...p, deletedAt: now } : p)); 
        setTasks(prev => prev.map(t => t.projectId === pid ? { ...t, deletedAt: now } : t)); 
      };
      const addComment = (pid, text, file = null) => { const nc = { id: Date.now(), memberId: currentUser.id, text, file, createdAt: new Date().toISOString() }; setProjects(prev => prev.map(p => p.id === pid ? { ...p, comments: [...(p.comments || []), nc] } : p)); setReadComments(prev => ({ ...prev, [pid]: (prev[pid] || 0) + 1 })); if (selectedProject?.id === pid) setSelectedProject(prev => ({ ...prev, comments: [...(prev.comments || []), nc] })); };
      const updateComment = (pid, cid, text) => { setProjects(prev => prev.map(p => p.id === pid ? { ...p, comments: (p.comments || []).map(c => c.id === cid ? { ...c, text, editedAt: new Date().toISOString() } : c) } : p)); if (selectedProject?.id === pid) setSelectedProject(prev => ({ ...prev, comments: (prev.comments || []).map(c => c.id === cid ? { ...c, text, editedAt: new Date().toISOString() } : c) })); };
      const deleteComment = (pid, cid) => { setProjects(prev => prev.map(p => p.id === pid ? { ...p, comments: (p.comments || []).filter(c => c.id !== cid) } : p)); setReadComments(prev => ({ ...prev, [pid]: Math.max(0, (prev[pid] || 0) - 1) })); if (selectedProject?.id === pid) setSelectedProject(prev => ({ ...prev, comments: (prev.comments || []).filter(c => c.id !== cid) })); };
      const addTask = (t) => { const pt = tasks.filter(x => x.projectId === t.projectId); const mx = Math.max(...pt.map(x => x.order), -1); setTasks(prev => [...prev, { ...t, id: Date.now(), order: mx + 1, completed: false, note: '', bookmark: false }]); };
      const toggleTaskComplete = (id) => {
        setTasks(prev => {
          const task = prev.find(t => t.id === id);
          if (!task) return prev;
          
          const newCompleted = !task.completed;
          
          // 하위업무인 경우 (parentTaskId가 없는 업무)
          if (!task.parentTaskId) {
            const subtasks = prev.filter(t => t.parentTaskId === id);
            
            if (subtasks.length > 0) {
              // 하위업무 체크 → 모든 서브태스크도 같이 체크/해제
              return prev.map(t => {
                if (t.id === id) return { ...t, completed: newCompleted };
                if (t.parentTaskId === id) return { ...t, completed: newCompleted };
                return t;
              });
            }
          }
          
          // 서브태스크인 경우 (parentTaskId가 있는 업무)
          if (task.parentTaskId) {
            const updated = prev.map(t => t.id === id ? { ...t, completed: newCompleted } : t);
            
            // 모든 서브태스크가 완료되었는지 확인
            const siblings = updated.filter(t => t.parentTaskId === task.parentTaskId);
            const allCompleted = siblings.every(t => t.completed);
            
            // 부모 하위업무도 업데이트
            return updated.map(t => {
              if (t.id === task.parentTaskId) {
                return { ...t, completed: allCompleted };
              }
              return t;
            });
          }
          
          // 일반 업무 (서브태스크 없는 하위업무)
          return prev.map(t => t.id === id ? { ...t, completed: newCompleted } : t);
        });
      };
      // 휴지통으로 이동 (deletedAt 추가)
      const deleteTask = (id) => setTasks(prev => prev.map(t => 
        (t.id === id || t.parentTaskId === id) ? { ...t, deletedAt: Date.now() } : t
      ));
      const requestDeleteTask = (task) => setConfirmDelete({ type: 'task', id: task.id, title: task.title });
      const requestDeleteProject = (project) => setConfirmDelete({ type: 'project', id: project.id, title: project.title });
      
      // 삭제 확인 처리
      const handleConfirmDelete = () => {
        if (confirmDelete) {
          if (confirmDelete.type === 'task') {
            deleteTask(confirmDelete.id);
          } else if (confirmDelete.type === 'project') {
            deleteProject(confirmDelete.id);
            setSelectedProject(null); // 프로젝트 삭제 후 슬라이드 닫기
          }
          setConfirmDelete(null);
        }
      };
      
      const updateTask = (updatedTask) => setTasks(prev => prev.map(t => t.id === updatedTask.id ? { ...t, ...updatedTask } : t));
      const reorderTasks = (updates) => setTasks(prev => prev.map(t => { const u = updates.find(x => x.id === t.id); return u ? { ...t, order: u.order } : t; }));

      // 내가 참여한 프로젝트 (내가 만든 프로젝트 OR 내가 담당자인 업무가 있는 프로젝트)
      const myTaskProjectIds = [...new Set(tasks.filter(t => t.memberId === currentUser.id).map(t => t.projectId))];
      
      // 프로젝트별 담당자 목록 (하위업무 담당자 기준)
      const getProjectMembers = (projectId) => {
        return [...new Set(tasks.filter(t => t.projectId === projectId).map(t => t.memberId))];
      };
      
      // 내 프로젝트: 내가 담당자(memberIds)로 지정되어 있고 나 혼자인 프로젝트
      const myProjects = filteredProjects.filter(p => {
        const memberIds = p.memberIds || [];
        if (!memberIds.includes(currentUser.id)) return false;
        return memberIds.length === 1;
      });
      
      // 협력 프로젝트: 내가 담당자이고 다른 사람도 담당자인 프로젝트
      const collabProjects = filteredProjects.filter(p => {
        const memberIds = p.memberIds || [];
        if (!memberIds.includes(currentUser.id)) return false;
        return memberIds.length > 1;
      });
      
      // 팀 프로젝트: 내가 담당자가 아닌 프로젝트
      const teamProjects = filteredProjects.filter(p => {
        const memberIds = p.memberIds || [];
        return !memberIds.includes(currentUser.id);
      });

      // 프로젝트 카드 컴포넌트
      const ProjectCard = ({ project }) => {
        const [showPriorityMenu, setShowPriorityMenu] = useState(false);
        const st = getProjectStats(project.id), unread = getUnreadCount(project.id), brand = BRANDS.find(b => b.id === project.brandId), status = STATUS_OPTIONS.find(s => s.id === project.status), prog = st.total > 0 ? Math.round((st.completed / st.total) * 100) : 0;
        const projectMembers = project.memberIds ? TEAM_MEMBERS.filter(m => (project.memberIds || []).includes(m.id)) : [];
        const priority = PRIORITY_OPTIONS.find(p => p.id === project.priority) || PRIORITY_OPTIONS.find(p => p.id === 'none');
        
        const handlePriorityChange = (e, priorityId) => {
          e.stopPropagation();
          setProjects(prev => prev.map(p => 
            p.id === project.id ? { ...p, priority: priorityId } : p
          ));
          setShowPriorityMenu(false);
        };
        
        return (
          <div onClick={() => openProject(project)} style={{ background: 'white', borderRadius: 16, padding: 20, cursor: 'pointer', border: '1px solid #E5E8EB', position: 'relative' }}>
            {unread > 0 && <div style={{ position: 'absolute', top: -8, right: -8, minWidth: 22, height: 22, borderRadius: 11, background: '#F04452', color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontWeight: 700, padding: '0 6px' }}>{unread}</div>}
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12, flexWrap: 'wrap' }}>
              <span style={{ padding: '4px 10px', borderRadius: 6, background: `${brand.color}15`, color: brand.color, fontSize: 11, fontWeight: 700 }}>{brand.name}</span>
              <span style={{ display: 'flex', alignItems: 'center', gap: 4, padding: '4px 8px', borderRadius: 6, background: status.bg, color: status.color, fontSize: 11, fontWeight: 600 }}><Icon name={status.icon} size={12} color={status.color} /> {status.label}</span>
              {/* 우선순위 배지 */}
              <div style={{ position: 'relative' }}>
                <button 
                  onClick={(e) => { e.stopPropagation(); setShowPriorityMenu(!showPriorityMenu); }}
                  style={{ 
                    display: 'flex', alignItems: 'center', gap: 4, padding: '4px 10px', borderRadius: 6, 
                    background: priority.bg, color: priority.color, fontSize: 11, fontWeight: 600,
                    border: 'none', cursor: 'pointer'
                  }}
                >
                  {priority.icon} {priority.label} ▾
                </button>
                {/* 우선순위 드롭다운 */}
                {showPriorityMenu && (
                  <div 
                    onClick={(e) => e.stopPropagation()}
                    style={{ 
                      position: 'absolute', top: '100%', left: 0, marginTop: 4, 
                      background: 'white', borderRadius: 10, boxShadow: '0 4px 20px rgba(0,0,0,0.15)',
                      border: '1px solid #E5E8EB', overflow: 'hidden', zIndex: 100, minWidth: 100
                    }}
                  >
                    {PRIORITY_OPTIONS.map(p => (
                      <button
                        key={p.id}
                        onClick={(e) => handlePriorityChange(e, p.id)}
                        style={{
                          display: 'flex', alignItems: 'center', gap: 8, width: '100%',
                          padding: '10px 14px', border: 'none', background: project.priority === p.id ? p.bg : 'white',
                          fontSize: 13, fontWeight: 500, color: p.color, cursor: 'pointer', textAlign: 'left'
                        }}
                        onMouseEnter={(e) => e.target.style.background = p.bg}
                        onMouseLeave={(e) => e.target.style.background = project.priority === p.id ? p.bg : 'white'}
                      >
                        {p.icon} {p.label}
                      </button>
                    ))}
                  </div>
                )}
              </div>
            </div>
            <h3 style={{ fontSize: 17, fontWeight: 700, color: '#191F28', marginBottom: 6 }}>{project.title}</h3>

        newTasks.splice(targetIdx, 0, draggedTask);

        setDraggedTask(null);
