              <div style={{ display: 'flex', gap: 8, marginBottom: 12 }}>
                {STATUS_OPTIONS.map(s => (
                  <button 
                    key={s.id} 
                    onClick={() => handleStatusChange(s.id)}
                    style={{ 
                      display: 'flex', alignItems: 'center', gap: 6, 
                      padding: '8px 14px', borderRadius: 8, 
                      border: project.status === s.id ? `2px solid ${s.color}` : '1px solid #E5E8EB', 
                      background: project.status === s.id ? s.bg : 'white', 
                      color: project.status === s.id ? s.color : '#6B7684', 
                      fontSize: 13, fontWeight: 600 
                    }}
                  >
                    <Icon name={s.icon} size={14} color={project.status === s.id ? s.color : '#8B95A1'} />
                    {s.label}
                  </button>
                ))}
              </div>
              
              {/* 프로젝트 설명 */}
              {project.description && (
                <div style={{ background: '#F7F8FA', borderRadius: 10, padding: 14, marginBottom: 12 }}>
                  <p style={{ fontSize: 13, color: '#4B5563', lineHeight: 1.6 }}>{project.description}</p>
                </div>
              )}
              
              {/* 날짜 정보 */}
              <div style={{ display: 'flex', gap: 16, marginBottom: 12 }}>
                {project.createdDate && (
                  <span style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 13, color: '#6B7684' }}>
                    <Icon name="calendar" size={14} color="#8B95A1" /> 등록일: {formatShortDate(project.createdDate)}
                  </span>
                )}
                {project.completedDate && (
                  <span style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 13, color: '#00C471' }}>
                    <Icon name="checkCircle" size={14} color="#00C471" /> 완료일: {formatShortDate(project.completedDate)}
                  </span>
                )}
              </div>
              
              {tasks.length > 0 && (
                <div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}><span style={{ fontSize: 13, color: '#6B7684' }}>업무 진행률</span><span style={{ fontSize: 13, fontWeight: 600, color: '#191F28' }}>{comp}/{tasks.length} ({prog}%)</span></div>
                  <div style={{ height: 8, background: '#F2F3F5', borderRadius: 4 }}><div style={{ height: '100%', borderRadius: 4, background: prog === 100 ? '#00C471' : '#3182F6', width: `${prog}%` }} /></div>
                </div>
              )}
            </div>

            <div style={{ display: 'flex', borderBottom: '1px solid #E5E8EB' }}>
              <button onClick={() => setActiveTab('tasks')} style={{ flex: 1, padding: 16, border: 'none', background: 'white', fontSize: 15, fontWeight: 600, color: activeTab === 'tasks' ? '#3182F6' : '#8B95A1', borderBottom: activeTab === 'tasks' ? '2px solid #3182F6' : '2px solid transparent' }}>하위업무 ({tasks.length})</button>
              <button onClick={() => setActiveTab('comments')} style={{ flex: 1, padding: 16, border: 'none', background: 'white', fontSize: 15, fontWeight: 600, color: activeTab === 'comments' ? '#3182F6' : '#8B95A1', borderBottom: activeTab === 'comments' ? '2px solid #3182F6' : '2px solid transparent' }}>댓글 ({project.comments.length})</button>
            </div>

            <div style={{ flex: 1, overflow: 'auto', padding: 24 }}>
              {activeTab === 'tasks' ? (
                <>
                  <button onClick={() => { setShowAddTask(true); setAddingSubtaskParentId(null); }} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10, width: '100%', padding: 18, marginBottom: 20, border: '2px dashed #D1D6DB', borderRadius: 14, background: '#FAFBFC', fontSize: 15, fontWeight: 600, color: '#6B7684', cursor: 'pointer' }}><Icon name="plus" size={20} color="#6B7684" /> 하위업무 추가</button>
                  {sorted.filter(t => !t.parentTaskId).length === 0 ? <p style={{ textAlign: 'center', color: '#8B95A1', padding: '40px 0', fontSize: 15 }}>등록된 하위업무가 없습니다</p> : (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                      {sorted.filter(t => !t.parentTaskId).map(t => {
                        const m = TEAM_MEMBERS.find(x => x.id === t.memberId);
                        const isDragging = draggedTask?.id === t.id;
                        const isDragOver = dragOverId === t.id;
                        const subtasks = sorted.filter(st => st.parentTaskId === t.id);
                        const completedSubtasks = subtasks.filter(st => st.completed).length;
                        return (
                          <div key={t.id}>
                            <div 
                              draggable
                              onDragStart={(e) => handleDragStart(e, t)}
                              onDragOver={(e) => handleDragOver(e, t)}
                              onDragLeave={handleDragLeave}
                              onDrop={(e) => handleDrop(e, t)}
                              onDragEnd={handleDragEnd}
                              style={{ 
                                display: 'flex', alignItems: 'center', gap: 14, padding: '16px 18px', 
                                background: isDragOver ? '#EBF4FF' : 'white', 
                                border: isDragOver ? '2px solid #3182F6' : '1px solid #E5E8EB', 
                                borderRadius: 14,
                                opacity: isDragging ? 0.5 : 1,
                                cursor: 'grab'
                              }}
                            >
                              <Icon name="grip" size={18} color="#D1D6DB" />
                              <button onClick={() => onToggleTask(t.id)} style={{ width: 26, height: 26, borderRadius: 8, border: t.completed ? 'none' : '2px solid #D1D6DB', background: t.completed ? '#3182F6' : 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, cursor: 'pointer' }}>{t.completed && <Icon name="check" size={16} color="white" />}</button>
                              <div onClick={() => setSelectedSubTask(t)} style={{ flex: 1, minWidth: 0, cursor: 'pointer' }}>
                                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                                  <p style={{ fontSize: 15, fontWeight: 600, color: t.completed ? '#8B95A1' : '#191F28', textDecoration: t.completed ? 'line-through' : 'none' }}>{t.title}</p>
                                  {t.note && <Icon name="fileText" size={16} color="#3182F6" />}
                                  {t.attachments && t.attachments.length > 0 && <Icon name="paperclip" size={16} color="#8B95A1" />}
                                  {subtasks.length > 0 && <span style={{ fontSize: 12, padding: '3px 8px', borderRadius: 6, background: '#F0F7FF', color: '#3182F6', fontWeight: 600 }}>{completedSubtasks}/{subtasks.length}</span>}
                                </div>
                                <p style={{ fontSize: 13, color: '#8B95A1', marginTop: 4 }}>{formatShortDate(t.date)}</p>
                              </div>
                              {m && <div style={{ width: 34, height: 34, borderRadius: '50%', background: m.color, color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, fontWeight: 700, flexShrink: 0 }}>{m.initial}</div>}
                              <button onClick={() => { setShowAddTask(true); setAddingSubtaskParentId(t.id); }} title="서브태스크 추가" style={{ width: 36, height: 36, borderRadius: 8, border: 'none', background: '#F0F7FF', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, cursor: 'pointer' }}><Icon name="plus" size={18} color="#3182F6" /></button>
                              <button onClick={() => setEditingTaskId(t.id)} style={{ width: 36, height: 36, borderRadius: 8, border: 'none', background: '#F7F8FA', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, cursor: 'pointer' }}><Icon name="edit" size={18} color="#6B7684" /></button>
                              <button onClick={() => onDeleteTask(t)} style={{ width: 36, height: 36, borderRadius: 8, border: 'none', background: '#FEE4E2', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, cursor: 'pointer' }}><Icon name="trash" size={18} color="#F04452" /></button>
                            </div>
                            {/* 서브태스크 목록 */}
                            {subtasks.length > 0 && (
                              <div style={{ marginLeft: 40, marginTop: 8, display: 'flex', flexDirection: 'column', gap: 8 }}>
                                {subtasks.map(st => {
                                  const stm = TEAM_MEMBERS.find(x => x.id === st.memberId);
                                  return (
                                    <div key={st.id} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '14px 16px', background: '#FAFBFC', border: '1px solid #E5E8EB', borderRadius: 12 }}>
                                      <div style={{ width: 3, height: 24, background: '#D1D6DB', borderRadius: 2 }} />
                                      <button onClick={() => onToggleTask(st.id)} style={{ width: 22, height: 22, borderRadius: 6, border: st.completed ? 'none' : '2px solid #D1D6DB', background: st.completed ? '#00C471' : 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, cursor: 'pointer' }}>{st.completed && <Icon name="check" size={14} color="white" />}</button>
                                      <div onClick={() => setSelectedSubTask(st)} style={{ flex: 1, minWidth: 0, cursor: 'pointer' }}>
                                        <p style={{ fontSize: 14, fontWeight: 500, color: st.completed ? '#8B95A1' : '#191F28', textDecoration: st.completed ? 'line-through' : 'none' }}>{st.title}</p>
                                      </div>
                                      {stm && <div style={{ width: 30, height: 30, borderRadius: '50%', background: stm.color, color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontWeight: 700, flexShrink: 0 }}>{stm.initial}</div>}
                                      <button onClick={() => setEditingTaskId(st.id)} style={{ width: 32, height: 32, borderRadius: 8, border: 'none', background: '#F7F8FA', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, cursor: 'pointer' }}><Icon name="edit" size={16} color="#6B7684" /></button>
                                      <button onClick={() => onDeleteTask(st)} style={{ width: 32, height: 32, borderRadius: 8, border: 'none', background: '#FEE4E2', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, cursor: 'pointer' }}><Icon name="trash" size={16} color="#F04452" /></button>
                                    </div>
                                  );
                                })}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </>
              ) : (
                <>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                    {project.comments.length === 0 ? <p style={{ textAlign: 'center', color: '#8B95A1', padding: '40px 0' }}>아직 댓글이 없습니다</p> : project.comments.map(c => {
                      const a = TEAM_MEMBERS.find(m => m.id === c.memberId), isMy = c.memberId === currentUser.id, isEdit = editingCommentId === c.id;
                      return (
                        <div key={c.id} style={{ display: 'flex', gap: 12 }}>
                          <div style={{ width: 32, height: 32, borderRadius: '50%', background: a?.color || '#8B95A1', color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontWeight: 700, flexShrink: 0 }}>{a?.initial || '?'}</div>
                          <div style={{ flex: 1 }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
                              <span style={{ fontSize: 14, fontWeight: 600, color: '#191F28' }}>{a?.name}</span>
                              <span style={{ fontSize: 12, color: '#8B95A1' }}>{formatDateTime(c.createdAt)}</span>
                              {c.editedAt && <span style={{ fontSize: 11, color: '#B0B8C1' }}>(수정됨)</span>}
                              {isMy && !isEdit && <div style={{ marginLeft: 'auto', display: 'flex', gap: 4 }}><button onClick={() => { setEditingCommentId(c.id); setEditText(c.text); }} style={{ padding: '4px 8px', borderRadius: 6, border: 'none', background: '#F7F8FA', fontSize: 12, color: '#6B7684' }}>수정</button><button onClick={() => onDeleteComment(c.id)} style={{ padding: '4px 8px', borderRadius: 6, border: 'none', background: '#FEE4E2', fontSize: 12, color: '#F04452' }}>삭제</button></div>}
                            </div>
                            {isEdit ? (
                              <div><textarea value={editText} onChange={(e) => setEditText(e.target.value)} style={{ width: '100%', padding: '10px 12px', borderRadius: 8, border: '1px solid #3182F6', fontSize: 14, resize: 'none', minHeight: 60 }} autoFocus /><div style={{ display: 'flex', gap: 8, marginTop: 8 }}><button onClick={() => setEditingCommentId(null)} style={{ padding: '8px 14px', borderRadius: 8, border: '1px solid #E5E8EB', background: 'white', fontSize: 13, color: '#6B7684' }}>취소</button><button onClick={() => { if (editText.trim()) { onUpdateComment(c.id, editText.trim()); setEditingCommentId(null); } }} style={{ padding: '8px 14px', borderRadius: 8, border: 'none', background: '#3182F6', fontSize: 13, color: 'white' }}>저장</button></div></div>
                            ) : (
                              <>
                                {c.text && <p style={{ fontSize: 14, color: '#4B5563', lineHeight: 1.5 }}>{c.text}</p>}
                                {c.file && (
                                  <div style={{ display: 'inline-flex', alignItems: 'center', gap: 6, marginTop: c.text ? 8 : 0, padding: '8px 12px', background: '#F0F7FF', borderRadius: 8, cursor: 'pointer' }}>
                                    <Icon name="fileText" size={16} color="#3182F6" />
                                    <span style={{ fontSize: 13, color: '#3182F6', fontWeight: 500 }}>{c.file.name}</span>
                                  </div>
                                )}
                              </>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </>
              )}
            </div>

            {activeTab === 'comments' && (
              <div style={{ padding: 16, borderTop: '1px solid #E5E8EB' }}>
                {/* 첨부 파일 미리보기 */}
                {attachedFile && (
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12, padding: '8px 12px', background: '#F0F7FF', borderRadius: 8 }}>
                    <Icon name="fileText" size={16} color="#3182F6" />
                    <span style={{ flex: 1, fontSize: 13, color: '#3182F6', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{attachedFile.name}</span>
                    <button onClick={() => setAttachedFile(null)} style={{ width: 20, height: 20, borderRadius: 4, border: 'none', background: '#E5E8EB', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}><Icon name="x" size={12} color="#6B7684" /></button>
                  </div>
                )}
                <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                  <div style={{ width: 36, height: 36, borderRadius: '50%', background: currentUser.color, color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, fontWeight: 700 }}>{currentUser.initial}</div>
                  <div style={{ flex: 1, display: 'flex', alignItems: 'center', background: '#F7F8FA', borderRadius: 12, padding: '4px 4px 4px 16px' }}>
                    <input type="text" value={comment} onChange={(e) => setComment(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter' && (comment.trim() || attachedFile)) { handleSubmitComment(); } }} placeholder="댓글을 입력하세요..." style={{ flex: 1, border: 'none', background: 'transparent', fontSize: 14, padding: '10px 0' }} />
                    <input type="file" ref={fileInputRef} onChange={handleFileSelect} style={{ display: 'none' }} />
                    <button onClick={() => fileInputRef.current?.click()} style={{ width: 36, height: 36, borderRadius: 8, border: 'none', background: 'transparent', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}><Icon name="paperclip" size={18} color="#8B95A1" /></button>
                    <button onClick={handleSubmitComment} disabled={!comment.trim() && !attachedFile} style={{ width: 36, height: 36, borderRadius: 8, border: 'none', background: (comment.trim() || attachedFile) ? '#3182F6' : '#E5E8EB', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icon name="send" size={16} color={(comment.trim() || attachedFile) ? 'white' : '#8B95A1'} /></button>
                  </div>
                </div>
              </div>
            )}

            {/* 하위업무 상세 보기 모달 - 인라인 편집 가능 */}
            {selectedSubTask && (
              <SubTaskDetailModal 
                task={selectedSubTask}
                brand={brand}
                project={project}
                onClose={() => setSelectedSubTask(null)}
                onToggle={() => { onToggleTask(selectedSubTask.id); setSelectedSubTask(prev => ({ ...prev, completed: !prev.completed })); }}
                onSave={(updated) => { onUpdateTask(updated); setSelectedSubTask(updated); }}
                onDelete={() => { onDeleteTask(selectedSubTask); setSelectedSubTask(null); }}
                onEdit={() => { setEditingTaskId(selectedSubTask.id); setSelectedSubTask(null); }}
              />
            )}

            {showAddTask && <SubTaskModal parentTaskId={addingSubtaskParentId} currentUser={currentUser} onSave={(t) => { onAddTask({ ...t, parentTaskId: addingSubtaskParentId }); setShowAddTask(false); setAddingSubtaskParentId(null); }} onClose={() => { setShowAddTask(false); setAddingSubtaskParentId(null); }} />}
            
            {/* 하위업무 수정 모달 */}
            {editingTaskId && <SubTaskModal task={sorted.find(t => t.id === editingTaskId)} currentUser={currentUser} onSave={(t) => { onUpdateTask(t); setEditingTaskId(null); }} onClose={() => setEditingTaskId(null)} />}
            
            {/* 프로젝트 수정 모달 */}
            {showEditProject && <ProjectModal project={project} currentUser={currentUser} onSave={(p) => { onUpdateProject(p); setShowEditProject(false); }} onClose={() => setShowEditProject(false)} />}
            
          </div>
        </div>
      );
    }

    // 하위업무 상세 모달 (인라인 편집 가능)
    function SubTaskDetailModal({ task, brand, project, onClose, onToggle, onSave, onDelete, onEdit }) {
      // ESC 키는 부모 컴포넌트(ProjectDetailSlide)에서 처리
      const [title, setTitle] = useState(task.title || '');
      const [note, setNote] = useState(task.note || '');
      const [attachments, setAttachments] = useState(task.attachments || []);
      const [hasChanges, setHasChanges] = useState(false);
      const [isUploading, setIsUploading] = useState(false);
      const fileInputRef = React.useRef(null);
      const m = TEAM_MEMBERS.find(x => x.id === task.memberId);
      
      const handleTitleChange = (e) => {
        setTitle(e.target.value);
        setHasChanges(true);
      };
      
      const handleNoteChange = (e) => {
        setNote(e.target.value);
        setHasChanges(true);
      };
      
      const handleFileSelect = async (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;
        
        setIsUploading(true);
        
        for (const file of files) {
          try {
            // Firebase Storage에 업로드
            const path = `attachments/tasks/${task.id}/${Date.now()}_${file.name}`;
            const result = await FirebaseService.uploadFile(file, path);
            
            if (result) {
              setAttachments(prev => [...prev, {
                id: Date.now() + Math.random(),
                name: result.name,
                size: result.size,
                type: result.type,
                url: result.url,
                path: path
              }]);
              setHasChanges(true);
            }
          } catch (error) {
            console.error('File upload error:', error);
            alert('파일 업로드에 실패했습니다.');
          }
        }
        
        setIsUploading(false);
        e.target.value = '';
      };
      
      const removeAttachment = async (attachment) => {
        // Firebase Storage에서 파일 삭제
        if (attachment.path) {
          await FirebaseService.deleteFile(attachment.path);
        }
        setAttachments(prev => prev.filter(a => a.id !== attachment.id));
        setHasChanges(true);
      };
      
      const handleSave = () => {
        onSave({ ...task, title, note, attachments });
        setHasChanges(false);
      };
      
      return (
        <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.4)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1100 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: 'white', borderRadius: 20, padding: 24, width: '100%', maxWidth: 480, maxHeight: '85vh', overflow: 'auto' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 20 }}>
              <h2 style={{ fontSize: 18, fontWeight: 700, color: '#191F28' }}>📋 하위업무 상세</h2>
              <button onClick={onClose} style={{ width: 32, height: 32, borderRadius: 8, border: 'none', background: '#F7F8FA', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}><Icon name="x" size={18} color="#8B95A1" /></button>
            </div>
            
            {/* 업로드 중 표시 */}
            {isUploading && (
              <div style={{ position: 'absolute', inset: 0, background: 'rgba(255,255,255,0.8)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 10, borderRadius: 20 }}>
                <div style={{ textAlign: 'center' }}>
                  <div className="loading-spinner" style={{ margin: '0 auto 12px' }}></div>
                  <p style={{ fontSize: 14, color: '#6B7684' }}>파일 업로드 중...</p>
                </div>
              </div>
            )}
            
            {/* 업무 정보 */}
            <div style={{ background: '#F7F8FA', borderRadius: 12, padding: 16, marginBottom: 16 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}>
                <span style={{ padding: '4px 10px', borderRadius: 6, background: `${brand.color}15`, color: brand.color, fontSize: 12, fontWeight: 600 }}>{brand.name}</span>
                <span style={{ padding: '4px 10px', borderRadius: 6, background: '#E5E8EB', color: '#6B7684', fontSize: 11, fontWeight: 600 }}>{project.title}</span>
              </div>
              <input 
                type="text"
                value={title}
                onChange={handleTitleChange}
                placeholder="업무명을 입력하세요"
                style={{ 
                  width: '100%', 
                  fontSize: 18, 
                  fontWeight: 700, 
                  color: '#191F28', 
                  marginBottom: 8, 
                  textDecoration: task.completed ? 'line-through' : 'none',
                  border: 'none',
                  background: 'transparent',
                  padding: '4px 0',
                  borderBottom: '2px solid transparent',
                  outline: 'none',
                  transition: 'border-color 0.2s'
                }}
                onFocus={(e) => e.target.style.borderBottomColor = '#3182F6'}
                onBlur={(e) => e.target.style.borderBottomColor = 'transparent'}
              />
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <p style={{ fontSize: 14, color: '#6B7684' }}>📅 {formatShortDate(task.date)}</p>
                {m && <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}><div style={{ width: 20, height: 20, borderRadius: '50%', background: m.color, color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 9, fontWeight: 700 }}>{m.initial}</div><span style={{ fontSize: 12, color: '#6B7684' }}>{m.name}</span></div>}
              </div>
            </div>
            
            {/* 메모 영역 - 편집 가능 */}
            <div style={{ marginBottom: 16 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 8 }}>
                <Icon name="fileText" size={16} color="#F59E0B" />
                <span style={{ fontSize: 13, fontWeight: 600, color: '#92400E' }}>메모</span>
              </div>
              <textarea 
                value={note} 
                onChange={handleNoteChange}
                placeholder="메모를 입력하세요..."
                rows={4}
                style={{ width: '100%', padding: '14px 16px', borderRadius: 12, border: '1px solid #E5E8EB', fontSize: 14, resize: 'none', lineHeight: 1.6, background: '#FFFBEB' }}
              />
            </div>
            
            {/* 첨부파일 영역 - 추가/삭제 가능 */}
            <div style={{ marginBottom: 16 }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>

    function SubTaskModal({ task, parentTaskId, currentUser, onSave, onClose }) {
      // ESC 키는 부모 컴포넌트(ProjectDetailSlide)에서 처리
      const isTeamLeader = currentUser?.role === '팀장';
      const [form, setForm] = useState({ 
        title: task?.title || '', 
        memberId: task?.memberId || (isTeamLeader ? null : currentUser?.id), 
        date: task?.date || today,
        note: task?.note || '',
        attachments: task?.attachments || []
      });
      const [pendingFiles, setPendingFiles] = useState([]); // 업로드 대기 중인 파일들
      const [isUploading, setIsUploading] = useState(false);
      const fileInputRef = React.useRef(null);
      const isEdit = !!task;
      const isSubtask = !!parentTaskId;
      
      const handleFileSelect = (e) => {
        const files = Array.from(e.target.files);
        // 파일 정보를 임시로 저장 (실제 업로드는 저장 시 진행)
        const newAttachments = files.map(f => ({
          id: Date.now() + Math.random(),
          name: f.name,
          size: f.size,
          type: f.type,
          file: f  // 실제 파일 객체 보관
        }));
        setForm(prev => ({ ...prev, attachments: [...prev.attachments, ...newAttachments] }));
        setPendingFiles(prev => [...prev, ...files]);
        e.target.value = '';
      };
      
      const removeAttachment = (id) => {
        const att = form.attachments.find(a => a.id === id);
        if (att && att.file) {
          // 대기 중인 파일에서도 제거
          setPendingFiles(prev => prev.filter(f => f.name !== att.name));
        }
        setForm(prev => ({ ...prev, attachments: prev.attachments.filter(a => a.id !== id) }));
      };
      
      const handleSave = async () => {
        if (!form.title.trim() || !form.memberId) return;
        
        setIsUploading(true);
        
        // 새 파일들 업로드
        const uploadedAttachments = [];
        const taskId = task?.id || Date.now();
        
        for (const att of form.attachments) {
          if (att.file) {
            // 새로 추가된 파일 - Firebase에 업로드
            try {
              const path = `attachments/subtasks/${taskId}/${Date.now()}_${att.file.name}`;
              const result = await FirebaseService.uploadFile(att.file, path);
              if (result) {
                uploadedAttachments.push({
                  id: att.id,
                  name: result.name,
                  size: result.size,
                  type: result.type,
                  url: result.url,
                  path: path
                });
              }
            } catch (error) {
              console.error('Upload error:', error);
            }
          } else {
            // 기존 파일 - 그대로 유지
            uploadedAttachments.push(att);
          }
        }
        
        setIsUploading(false);
        onSave({ ...(task || {}), ...form, title: form.title.trim(), attachments: uploadedAttachments });
      };
      
      // 저장 가능 여부 (팀장은 담당자 선택 필수, 팀원은 자동 할당)
      const canSave = form.title.trim() && form.memberId;
      
      return (
        <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1100 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: 'white', borderRadius: 20, padding: 24, width: '100%', maxWidth: 420, maxHeight: '90vh', overflow: 'auto', position: 'relative' }}>
            {/* 업로드 중 표시 */}
            {isUploading && (
              <div style={{ position: 'absolute', inset: 0, background: 'rgba(255,255,255,0.9)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 10, borderRadius: 20 }}>
                <div style={{ textAlign: 'center' }}>
                  <div className="loading-spinner" style={{ margin: '0 auto 12px' }}></div>
                  <p style={{ fontSize: 14, color: '#6B7684' }}>파일 업로드 중...</p>
                </div>
              </div>
            )}
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 20 }}><h3 style={{ fontSize: 18, fontWeight: 700, color: '#191F28' }}>{isEdit ? '하위업무 수정' : isSubtask ? '서브태스크 추가' : '하위업무 추가'}</h3><button onClick={onClose} style={{ width: 32, height: 32, borderRadius: 8, border: 'none', background: '#F7F8FA', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}><Icon name="x" size={18} color="#8B95A1" /></button></div>
            <div style={{ marginBottom: 16 }}><label style={{ display: 'block', fontSize: 13, fontWeight: 600, marginBottom: 8 }}>업무명 *</label><input type="text" value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} placeholder="예: 디자인 시안 제작" style={{ width: '100%', padding: '12px 14px', borderRadius: 10, border: '1px solid #E5E8EB', fontSize: 14 }} /></div>
            {isTeamLeader && (
              <div style={{ marginBottom: 16 }}><label style={{ display: 'block', fontSize: 13, fontWeight: 600, marginBottom: 8 }}>담당자 *</label><div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>{TEAM_MEMBERS.map(m => <button key={m.id} onClick={() => setForm({ ...form, memberId: m.id })} style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '8px 12px', borderRadius: 8, border: form.memberId === m.id ? `2px solid ${m.color}` : '1px solid #E5E8EB', background: form.memberId === m.id ? `${m.color}15` : 'white', cursor: 'pointer' }}><div style={{ width: 22, height: 22, borderRadius: '50%', background: m.color, color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 10, fontWeight: 700 }}>{m.initial}</div><span style={{ fontSize: 13, fontWeight: 500, color: form.memberId === m.id ? '#191F28' : '#6B7684' }}>{m.name}</span></button>)}</div></div>
            )}
            <div style={{ marginBottom: 16 }}><label style={{ display: 'block', fontSize: 13, fontWeight: 600, marginBottom: 8 }}>기한</label><input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} onClick={(e) => e.target.showPicker()} style={{ width: '100%', padding: '12px 14px', borderRadius: 10, border: '1px solid #E5E8EB', fontSize: 14, cursor: 'pointer' }} /></div>
            <div style={{ marginBottom: 16 }}><label style={{ display: 'block', fontSize: 13, fontWeight: 600, marginBottom: 8 }}>메모 (선택)</label><textarea value={form.note} onChange={(e) => setForm({ ...form, note: e.target.value })} placeholder="메모를 입력하세요" rows={3} style={{ width: '100%', padding: '12px 14px', borderRadius: 10, border: '1px solid #E5E8EB', fontSize: 14, resize: 'none' }} /></div>
            
            {/* 첨부파일 영역 */}
            <div style={{ marginBottom: 24 }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
                <label style={{ fontSize: 13, fontWeight: 600 }}>첨부파일 (선택)</label>
                <button onClick={() => fileInputRef.current?.click()} style={{ display: 'flex', alignItems: 'center', gap: 4, padding: '6px 12px', borderRadius: 6, border: 'none', background: '#EBF4FF', color: '#3182F6', fontSize: 12, fontWeight: 500, cursor: 'pointer' }}>
                  <Icon name="paperclip" size={14} color="#3182F6" /> 파일 추가
                </button>
                <input ref={fileInputRef} type="file" multiple onChange={handleFileSelect} style={{ display: 'none' }} />
              </div>
              
              {form.attachments.length === 0 ? (
                <div onClick={() => fileInputRef.current?.click()} style={{ padding: 16, borderRadius: 10, background: '#F7F8FA', border: '2px dashed #E5E8EB', textAlign: 'center', cursor: 'pointer' }}>
                  <Icon name="paperclip" size={20} color="#D1D6DB" />
                  <p style={{ fontSize: 12, color: '#8B95A1', marginTop: 6 }}>클릭하여 파일 첨부</p>
                </div>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                  {form.attachments.map(file => (
                    <div key={file.id} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '8px 10px', borderRadius: 8, background: '#F0F7FF', border: '1px solid #DBEAFE' }}>
                      <Icon name="fileText" size={16} color="#3182F6" />
                      <span style={{ flex: 1, fontSize: 12, color: '#191F28', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{file.name}</span>
                      <span style={{ fontSize: 10, color: '#8B95A1' }}>{(file.size / 1024).toFixed(1)}KB</span>
                      <button onClick={() => removeAttachment(file.id)} style={{ width: 20, height: 20, borderRadius: 4, border: 'none', background: '#FEE4E2', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}>

              )}

            <div style={{ display: 'flex', gap: 12 }}><button onClick={onClose} style={{ flex: 1, padding: 14, borderRadius: 10, border: '1px solid #E5E8EB', background: 'white', fontSize: 14, fontWeight: 600, color: '#6B7684', cursor: 'pointer' }}>취소</button><button onClick={handleSave} disabled={!form.title.trim() || !form.memberId} style={{ flex: 1, padding: 14, borderRadius: 10, border: 'none', background: (form.title.trim() && form.memberId) ? '#3182F6' : '#E5E8EB', fontSize: 14, fontWeight: 600, color: (form.title.trim() && form.memberId) ? 'white' : '#8B95A1', cursor: (form.title.trim() && form.memberId) ? 'pointer' : 'not-allowed' }}>{isEdit ? '수정하기' : '추가하기'}</button></div>
          </div>
        </div>
      );

    // ============ 전체업무 탭 ============
    function CalendarTab({ tasks, setTasks, projects, currentUser }) {
      const [viewMode, setViewMode] = useState('list'); // 'calendar' or 'list'
      const [currentMonth, setCurrentMonth] = useState({ year: new Date().getFullYear(), month: new Date().getMonth() });
      const [selectedTask, setSelectedTask] = useState(null);
      const [editingTask, setEditingTask] = useState(null);
      const [showEditModal, setShowEditModal] = useState(false);
      
      // 삭제 확인 모달 상태
      const [confirmDelete, setConfirmDelete] = useState(null);
      
      // ESC 키로 모달 닫기
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            if (confirmDelete) setConfirmDelete(null);
            else if (showEditModal) { setShowEditModal(false); setEditingTask(null); }
            else if (selectedTask) setSelectedTask(null);
          }
        };
        document.addEventListener('keydown', handleKeyDown);
        return () => document.removeEventListener('keydown', handleKeyDown);
      }, [confirmDelete, showEditModal, selectedTask]);
      
      // 리스트 뷰 필터 상태
      const [searchQuery, setSearchQuery] = useState('');
      const [dateRange, setDateRange] = useState({ start: '', end: '' });
      const [filterProject, setFilterProject] = useState(null);
      const [filterStatus, setFilterStatus] = useState('all'); // 'all', 'completed', 'incomplete'
      
      // 팀원 필터 (팀장만 사용 가능, 기본값: 내 업무만)
      const [selectedMembers, setSelectedMembers] = useState([currentUser.id]);
      
      // 팀원 필터 토글 (팀장만 사용)
      const toggleMember = (memberId) => {
        if (currentUser.role !== '팀장') return;
        setSelectedMembers(prev => {
          if (prev.includes(memberId)) {
            if (prev.length === 1) return prev;
            return prev.filter(id => id !== memberId);
          }
          return [...prev, memberId];
        });
      };
      
      // 전체 선택/해제 (팀장만 사용)
      const toggleAllMembers = () => {
        if (currentUser.role !== '팀장') return;
        if (selectedMembers.length === TEAM_MEMBERS.length) {
          setSelectedMembers([currentUser.id]);
        } else {
          setSelectedMembers(TEAM_MEMBERS.map(m => m.id));
        }
      };
      
      // 선택된 팀원의 업무만 필터링 (팀장이 아니면 자기 업무만)
      const memberTasks = useMemo(() => {
        if (currentUser.role !== '팀장') {
          return tasks.filter(t => t.memberId === currentUser.id);
        }
        return tasks.filter(t => selectedMembers.includes(t.memberId));
      }, [tasks, selectedMembers, currentUser]);

      const monthDates = useMemo(() => getMonthDates(currentMonth.year, currentMonth.month), [currentMonth]);
      const tasksByDate = useMemo(() => { const g = {}; memberTasks.forEach(t => { if (!g[t.date]) g[t.date] = []; g[t.date].push(t); }); return g; }, [memberTasks]);
      const stats = useMemo(() => { const tm = memberTasks.filter(t => { const d = new Date(t.date); return d.getFullYear() === currentMonth.year && d.getMonth() === currentMonth.month; }); return { total: tm.length, completed: tm.filter(t => t.completed).length }; }, [memberTasks, currentMonth]);
      
      // 리스트 뷰용 필터링된 업무
      const filteredTasks = useMemo(() => {
        return memberTasks
          .filter(t => !searchQuery || t.title.toLowerCase().includes(searchQuery.toLowerCase()) || (t.note && t.note.toLowerCase().includes(searchQuery.toLowerCase())))
          .filter(t => !dateRange.start || t.date >= dateRange.start)
          .filter(t => !dateRange.end || t.date <= dateRange.end)
          .filter(t => filterProject === null || t.projectId === filterProject || (filterProject === 0 && !t.projectId))
          .filter(t => filterStatus === 'all' || (filterStatus === 'completed' && t.completed) || (filterStatus === 'incomplete' && !t.completed))
          .sort((a, b) => b.date.localeCompare(a.date));
      }, [memberTasks, searchQuery, dateRange, filterProject, filterStatus]);
      
      // 부모 업무만 (서브태스크 제외)
      const parentTasks = useMemo(() => {
        return filteredTasks.filter(t => !t.parentTaskId);
      }, [filteredTasks]);
      
      // 서브태스크 가져오기 (부모와 함께 표시하기 위해 memberTasks에서 가져옴)
      const getSubtasks = (parentId) => {
        return memberTasks.filter(t => t.parentTaskId === parentId);
      };

      const moveMonth = (dir) => setCurrentMonth(prev => { let m = prev.month + (dir === 'prev' ? -1 : 1), y = prev.year; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } return { year: y, month: m }; });
      const toggleTaskComplete = (id) => { 
        setTasks(prev => {
          const task = prev.find(t => t.id === id);
          if (!task) return prev;
          
          const newCompleted = !task.completed;
          
          // 하위업무인 경우
          if (!task.parentTaskId) {
            const subtasks = prev.filter(t => t.parentTaskId === id);
            if (subtasks.length > 0) {
              return prev.map(t => {
                if (t.id === id) return { ...t, completed: newCompleted };
                if (t.parentTaskId === id) return { ...t, completed: newCompleted };
                return t;
              });
            }
          }
          
          // 서브태스크인 경우
          if (task.parentTaskId) {
            const updated = prev.map(t => t.id === id ? { ...t, completed: newCompleted } : t);
            const siblings = updated.filter(t => t.parentTaskId === task.parentTaskId);
            const allCompleted = siblings.every(t => t.completed);
            return updated.map(t => t.id === task.parentTaskId ? { ...t, completed: allCompleted } : t);
          }
          
          return prev.map(t => t.id === id ? { ...t, completed: newCompleted } : t);
        }); 
        if (selectedTask?.id === id) setSelectedTask(prev => ({ ...prev, completed: !prev.completed })); 
      };
      // 휴지통으로 이동 (deletedAt 추가)
      const deleteTask = (id) => { 
        setTasks(prev => prev.map(t => 
          (t.id === id || t.parentTaskId === id) ? { ...t, deletedAt: Date.now() } : t
        )); 
        setSelectedTask(null); 
      };
      const requestDeleteTask = (task) => setConfirmDelete({ id: task.id, title: task.title });
      const handleConfirmDelete = () => {
        if (confirmDelete) {
          deleteTask(confirmDelete.id);
          setConfirmDelete(null);
        }
      };
      const updateTask = (task) => { setTasks(prev => prev.map(t => t.id === task.id ? { ...t, ...task } : t)); };

      return (
        <div style={{ minHeight: '100vh' }}>

            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 20 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 20 }}>
                <h1 style={{ fontSize: 24, fontWeight: 700, color: '#191F28' }}>{currentUser.role === '팀장' ? '전체 업무' : '내 업무'}</h1>
                {/* 뷰 모드 토글 */}
                <div style={{ display: 'flex', gap: 8 }}>
                  <button onClick={() => setViewMode('list')} style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '10px 20px', borderRadius: 10, border: viewMode === 'list' ? '2px solid #3182F6' : '1px solid #E5E8EB', background: viewMode === 'list' ? '#EBF4FF' : 'white', fontSize: 15, fontWeight: 600, color: viewMode === 'list' ? '#3182F6' : '#6B7684', cursor: 'pointer' }}>
                    <Icon name="clipboard" size={18} color={viewMode === 'list' ? '#3182F6' : '#6B7684'} /> 리스트
                  </button>
                  <button onClick={() => setViewMode('calendar')} style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '10px 20px', borderRadius: 10, border: viewMode === 'calendar' ? '2px solid #3182F6' : '1px solid #E5E8EB', background: viewMode === 'calendar' ? '#EBF4FF' : 'white', fontSize: 15, fontWeight: 600, color: viewMode === 'calendar' ? '#3182F6' : '#6B7684', cursor: 'pointer' }}>
                    <Icon name="calendar" size={18} color={viewMode === 'calendar' ? '#3182F6' : '#6B7684'} /> 캘린더
                  </button>
                </div>
              </div>
              
              {/* 팀원 필터 - 팀장만 표시 */}
              {currentUser.role === '팀장' && (
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <span style={{ fontSize: 13, color: '#6B7684', marginRight: 4 }}>팀원</span>
                  <button 
                    onClick={toggleAllMembers}
                    style={{ 
                      padding: '6px 12px', borderRadius: 8, 
                      border: selectedMembers.length === TEAM_MEMBERS.length ? '2px solid #3182F6' : '1px solid #E5E8EB', 
                      background: selectedMembers.length === TEAM_MEMBERS.length ? '#EBF4FF' : 'white',
                      fontSize: 12, fontWeight: 600, 
                      color: selectedMembers.length === TEAM_MEMBERS.length ? '#3182F6' : '#6B7684',
                      cursor: 'pointer'
                    }}
                  >
                    전체
                  </button>
                  {TEAM_MEMBERS.map(m => (
                    <button 
                      key={m.id}
                      onClick={() => toggleMember(m.id)}
                      style={{ 
                        display: 'flex', alignItems: 'center', gap: 6, 
                        padding: '6px 12px', borderRadius: 8,
                        border: selectedMembers.includes(m.id) ? `2px solid ${m.color}` : '1px solid #E5E8EB',
                        background: selectedMembers.includes(m.id) ? `${m.color}15` : 'white',
                        cursor: 'pointer'
                      }}
                    >
                      <div style={{ 
                        width: 22, height: 22, borderRadius: '50%', 
                        background: m.color, color: 'white', 
                        display: 'flex', alignItems: 'center', justifyContent: 'center', 
                        fontSize: 10, fontWeight: 700 
                      }}>{m.initial}</div>
                      <span style={{ fontSize: 12, fontWeight: 500, color: selectedMembers.includes(m.id) ? '#191F28' : '#6B7684' }}>{m.name}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
            
            {viewMode === 'list' ? (
              /* 리스트 뷰 필터 */
              <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                {/* 검색 + 날짜 범위 */}
                <div style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, background: '#F7F8FA', borderRadius: 10, padding: '0 14px', flex: 1, maxWidth: 400 }}>
                    <Icon name="search" size={18} color="#8B95A1" />
                    <input 
                      type="text" 
                      value={searchQuery} 
                      onChange={(e) => setSearchQuery(e.target.value)} 
                      placeholder="업무명 또는 메모 검색..." 
                      style={{ flex: 1, border: 'none', background: 'transparent', padding: '12px 0', fontSize: 14, color: '#191F28', outline: 'none' }} 
                    />
                    {searchQuery && (
                      <button onClick={() => setSearchQuery('')} style={{ background: 'none', border: 'none', cursor: 'pointer' }}>
                        <Icon name="x" size={16} color="#8B95A1" />

                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>

                      onClick={(e) => e.target.showPicker()}

                    <span style={{ color: '#8B95A1' }}>~</span>
                    <input

                    <button onClick={() => setFilterProject(0)} style={{ padding: '6px 14px', borderRadius: 8, border: filterProject === 0 ? '1.5px solid #8B95A1' : '1px solid #E5E8EB', background: filterProject === 0 ? '#8B95A115' : 'white', fontSize: 13, fontWeight: 500, color: filterProject === 0 ? '#8B95A1' : '#6B7684', cursor: 'pointer' }}>기타 업무</button>
                  </div>
                  
                  <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 8 }}>
                    <span style={{ fontSize: 13, color: '#6B7684' }}>상태</span>

                    <button onClick={() => setFilterStatus('incomplete')} style={{ padding: '6px 14px', borderRadius: 8, border: filterStatus === 'incomplete' ? '1.5px solid #F59E0B' : '1px solid #E5E8EB', background: filterStatus === 'incomplete' ? '#FEF3C7' : 'white', fontSize: 13, fontWeight: 500, color: filterStatus === 'incomplete' ? '#F59E0B' : '#6B7684', cursor: 'pointer' }}>미완료</button>
                    <button onClick={() => setFilterStatus('completed')} style={{ padding: '6px 14px', borderRadius: 8, border: filterStatus === 'completed' ? '1.5px solid #00C471' : '1px solid #E5E8EB', background: filterStatus === 'completed' ? '#DCFCE7' : 'white', fontSize: 13, fontWeight: 500, color: filterStatus === 'completed' ? '#00C471' : '#6B7684', cursor: 'pointer' }}>완료</button>
                  </div>
                </div>
                
                {/* 검색 결과 카운트 */}
                <div style={{ fontSize: 14, color: '#6B7684' }}>
                  총 <strong style={{ color: '#191F28' }}>{parentTasks.length}</strong>개의 업무
                </div>
              </div>
            ) : (
              /* 캘린더 뷰 헤더 */
              <>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                    <button onClick={() => moveMonth('prev')} style={{ width: 36, height: 36, borderRadius: 10, border: '1px solid #E5E8EB', background: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}><Icon name="chevronLeft" size={20} color="#6B7684" /></button>
                    <h2 style={{ fontSize: 24, fontWeight: 700, color: '#191F28', minWidth: 160, textAlign: 'center' }}>{currentMonth.year}년 {currentMonth.month + 1}월</h2>
                    <button onClick={() => moveMonth('next')} style={{ width: 36, height: 36, borderRadius: 10, border: '1px solid #E5E8EB', background: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}><Icon name="chevronRight" size={20} color="#6B7684" /></button>
                    <button onClick={() => setCurrentMonth({ year: new Date().getFullYear(), month: new Date().getMonth() })} style={{ padding: '8px 16px', borderRadius: 8, border: '1px solid #E5E8EB', background: 'white', fontSize: 14, fontWeight: 500, color: '#3182F6', cursor: 'pointer' }}>오늘</button>
                  </div>
                  <div style={{ textAlign: 'right' }}><p style={{ fontSize: 12, color: '#8B95A1' }}>{currentMonth.month + 1}월 업무</p><p style={{ fontSize: 18, fontWeight: 700 }}><span style={{ color: '#00C471' }}>{stats.completed}</span><span style={{ color: '#8B95A1', fontWeight: 400 }}> / {stats.total}</span></p></div>
                </div>
              </>
            )}
          </header>

          {viewMode === 'list' ? (
            /* 리스트 뷰 */
            <div style={{ padding: 32 }}>
              <div style={{ background: 'white', borderRadius: 16, border: '1px solid #E5E8EB', overflow: 'hidden' }}>
                {/* 테이블 헤더 */}
                <div style={{ display: 'grid', gridTemplateColumns: '44px 100px 1fr 80px 120px 44px', alignItems: 'center', padding: '12px 20px', borderBottom: '1px solid #E5E8EB', background: '#FAFBFC' }}>
                  <div></div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: '#6B7684' }}>날짜</div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: '#6B7684' }}>업무</div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: '#6B7684', textAlign: 'center' }}>담당자</div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: '#6B7684', textAlign: 'center' }}>프로젝트</div>
                  <div></div>
                </div>
                
                {parentTasks.length === 0 ? (
                  <div style={{ padding: '60px 20px', textAlign: 'center' }}>
                    <Icon name="search" size={48} color="#D1D6DB" />
                    <p style={{ fontSize: 16, color: '#8B95A1', marginTop: 16 }}>검색 결과가 없습니다</p>
                  </div>
                ) : (
                  parentTasks.map(task => {
                    const project = projects.find(p => p.id === task.projectId);
                    const proj = project ? BRANDS.find(b => b.id === project.brandId) : BRANDS.find(p => p.id === task.projectId);
                    const member = TEAM_MEMBERS.find(m => m.id === task.memberId);
                    const subtasks = getSubtasks(task.id);
                    const hasSubtasks = subtasks.length > 0;
                    return (
                      <div key={task.id}>
                        {/* 부모 업무 */}
                        <div 
                          onClick={() => setSelectedTask(task)}
                          style={{ display: 'grid', gridTemplateColumns: '44px 100px 1fr 80px 120px 44px', alignItems: 'center', padding: '14px 20px', borderBottom: hasSubtasks ? 'none' : '1px solid #F2F3F5', cursor: 'pointer', transition: 'background 0.15s' }}
                          onMouseEnter={(e) => e.currentTarget.style.background = '#F7F8FA'}
                          onMouseLeave={(e) => e.currentTarget.style.background = 'white'}
                        >
                          <button 
                            onClick={(e) => { e.stopPropagation(); toggleTaskComplete(task.id); }} 
                            style={{ width: 28, height: 28, borderRadius: 8, border: task.completed ? 'none' : '2px solid #D1D6DB', background: task.completed ? '#3182F6' : 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}
                          >
                            {task.completed && <Icon name="check" size={16} color="white" />}
                          </button>
                          
                          <span style={{ fontSize: 13, color: '#6B7684' }}>{task.date.slice(5).replace('-', '/')}</span>
                          
                          <div>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                              <span style={{ fontSize: 14, fontWeight: 500, color: task.completed ? '#8B95A1' : '#191F28', textDecoration: task.completed ? 'line-through' : 'none' }}>{task.title}</span>
                              {hasSubtasks && <span style={{ fontSize: 11, padding: '2px 6px', borderRadius: 4, background: '#F0F7FF', color: '#3182F6', fontWeight: 600 }}>{subtasks.filter(s => s.completed).length}/{subtasks.length}</span>}
                              {task.bookmark && <Icon name="bookmarkFill" size={14} color="#F59E0B" />}
                              {task.note && <Icon name="fileText" size={14} color="#3182F6" />}
                              {task.note && <span style={{ fontSize: 12, color: '#8B95A1', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: 200 }}>{task.note.split('\n')[0]}</span>}
                            </div>
                          </div>
                          
                          <div style={{ display: 'flex', justifyContent: 'center' }}>
                            {member && (
                              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                                <div style={{ width: 24, height: 24, borderRadius: '50%', background: member.color, color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 10, fontWeight: 700 }}>{member.initial}</div>
                              </div>
                            )}
                          </div>
                          
                          <div style={{ display: 'flex', justifyContent: 'center' }}>
                            {proj ? <span style={{ padding: '4px 10px', borderRadius: 6, background: `${proj.color}15`, color: proj.color, fontSize: 12, fontWeight: 600 }}>{proj.name}</span> : <span style={{ padding: '4px 10px', borderRadius: 6, background: '#8B95A115', color: '#8B95A1', fontSize: 12, fontWeight: 600 }}>기타 업무</span>}
